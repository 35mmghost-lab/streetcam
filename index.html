<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>StreetCam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: monospace;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewfinder-box {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: grayscale(100%) contrast(150%);
    }

    /* Стартова кнопка */
    #btn-start {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      padding: 20px 40px;
      font-size: 16px;
      font-weight: bold;
      background: #ffb642;
      border: 2px solid #fff;
      border-radius: 10px;
      color: #000;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 182, 66, 0.9);
    }

    /* Верхня панель HUD */
    #hud {
      position: fixed;
      top: env(safe-area-inset-top, 10px);
      left: 0;
      width: 100%;
      display: none;
      justify-content: space-around;
      align-items: center;
      padding: 6px 4px;
      z-index: 500;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
    }
    .hud-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #eee;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .hud-btn.active {
      background: rgba(255, 182, 66, 0.3);
      border-color: #ffb642;
      color: #ffb642;
    }

    /* Сітки */
    #grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }
    .grid-v, .grid-h {
      position: absolute;
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.8);
    }
    .grid-v { top: 0; bottom: 0; width: 1px; }
    .grid-h { left: 0; right: 0; height: 1px; }

    .grid-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      stroke: rgba(255, 255, 255, 0.45);
      stroke-width: 1.5;
      fill: none;
    }
    .center-cross {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
    }
    .center-cross::before, .center-cross::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
    }
    .center-cross::before { top: 15px; left: 0; width: 32px; height: 1px; }
    .center-cross::after { top: 0; left: 15px; width: 1px; height: 32px; }

    /* Далекомір */
    #rangefinder {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 70;
      display: none;
    }
    #range-text {
      position: absolute;
      top: 56px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1.5px solid #ffb642;
      color: #ffb642;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      white-space: nowrap;
    }
    .stadia-svg {
      width: 100%;
      height: 100%;
      stroke: #ffb642;
      stroke-width: 2;
      fill: none;
    }
    .stadia-label {
      fill: #ffb642;
      font-size: 16px;
      font-weight: bold;
      font-family: monospace;
    }

    /* Затвор */
    #shutter {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease-out;
    }
    #shutter.flash {
      opacity: 0.9;
    }

    /* Стелс-оверлей */
    #stealth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 950;
      display: none;
      cursor: pointer;
    }
    #btn-stealth-exit {
      position: absolute;
      top: env(safe-area-inset-top, 14px);
      right: 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(255, 255, 255, 0.4);
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      z-index: 960;
    }

    /* Налаштування */
    #settings-modal {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(12, 12, 12, 0.97);
      border-top: 1px solid #333;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 900;
      max-height: 80vh;
      overflow-y: auto;
    }
    .setting-title {
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
    }
    .setting-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .opt-btn {
      padding: 8px 4px;
      background: #1e1e1e;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      font-family: monospace;
    }
    .opt-btn.active {
      background: #fff;
      color: #000;
      font-weight: bold;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type=range] {
      flex: 1;
      accent-color: #ffb642;
      height: 4px;
    }
    #close-settings-btn {
      width: 100%;
      padding: 12px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div id="viewfinder-box">
    <video id="v" autoplay playsinline muted></video>
  </div>
  
  <div id="grid"></div>

  <div id="rangefinder">
    <div id="range-text">DIST: -- m (H: 1.60m)</div>
    <svg class="stadia-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <line x1="390" y1="120" x2="430" y2="120" />
      <line x1="390" y1="880" x2="430" y2="880" />
      <text x="320" y="505" class="stadia-label">1.2m</text>
      
      <line x1="440" y1="260" x2="470" y2="260" />
      <line x1="440" y1="740" x2="470" y2="740" />
      <text x="390" y="505" class="stadia-label">2.0m</text>

      <line x1="475" y1="340" x2="495" y2="340" />
      <line x1="475" y1="660" x2="495" y2="660" />
      <text x="515" y="505" class="stadia-label">3.0m</text>
    </svg>
  </div>

  <div id="shutter"></div>

  <!-- Стелс-оверлей -->
  <div id="stealth-overlay">
    <button id="btn-stealth-exit">✕ ВИЙТИ</button>
  </div>

  <button id="btn-start">▶ УВІМКНУТИ КАМЕРУ</button>

  <div id="hud">
    <button class="hud-btn" id="btn-snap">📷 SNAP</button>
    <button class="hud-btn" id="btn-film">🎞️ Tri-X 400</button>
    <button class="hud-btn" id="btn-grid">🌐 Третини</button>
    <button class="hud-btn" id="btn-range">🎯 Далекомір</button>
    <button class="hud-btn" id="btn-stealth">🕶️ Стелс</button>
    <button class="hud-btn" id="btn-settings">⚙️</button>
  </div>

  <div id="settings-modal">
    <div>
      <div class="setting-title">ВИСОТА ТОЧКИ ЗЙОМКИ</div>
      <div class="setting-grid" style="grid-template-columns: repeat(2, 1fr);" id="height-group">
        <button class="opt-btn active" data-h="1.6">👁️ Рівень очей (1.60 м)</button>
        <button class="opt-btn" data-h="1.3">🥋 Рівень пояса (1.30 м)</button>
      </div>
    </div>

    <div>
      <div class="setting-title">ЕКСПОКОРЕКЦІЯ (EV)</div>
      <div class="slider-container">
        <input type="range" id="ev-slider" min="-2.0" max="2.0" step="0.1" value="0.0">
        <span id="ev-val" style="min-width: 45px; color: #ffb642;">0.0 EV</span>
      </div>
    </div>

    <div>
      <div class="setting-title">ЗОННЕ ФОКУСУВАННЯ LEICA</div>
      <div class="setting-grid" id="focus-group">
        <button class="opt-btn active" data-dist="auto">AF Auto</button>
        <button class="opt-btn" data-dist="0.7">0.7 m</button>
        <button class="opt-btn" data-dist="1.2">1.2 m</button>
        <button class="opt-btn" data-dist="2.0">2.0 m</button>
        <button class="opt-btn" data-dist="3.0">3.0 m</button>
        <button class="opt-btn" data-dist="5.0">5.0 m</button>
        <button class="opt-btn" data-dist="100.0" style="grid-column: span 2;">∞ Нескінченність</button>
      </div>
    </div>

    <button id="close-settings-btn">Закрити налаштування</button>
  </div>

  <canvas id="c"></canvas>

  <script>
    const v = document.getElementById('v');
    const btnStart = document.getElementById('btn-start');
    const hud = document.getElementById('hud');
    const grid = document.getElementById('grid');
    const rangefinder = document.getElementById('rangefinder');
    const shutter = document.getElementById('shutter');
    const canvas = document.getElementById('c');
    const settingsModal = document.getElementById('settings-modal');
    const stealthOverlay = document.getElementById('stealth-overlay');
    const btnStealthExit = document.getElementById('btn-stealth-exit');

    const btnSnap = document.getElementById('btn-snap');
    const btnFilm = document.getElementById('btn-film');
    const btnGrid = document.getElementById('btn-grid');
    const btnRange = document.getElementById('btn-range');
    const btnStealth = document.getElementById('btn-stealth');
    const btnSettings = document.getElementById('btn-settings');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const evSlider = document.getElementById('ev-slider');
    const evVal = document.getElementById('ev-val');

    let videoTrack = null;
    let isRangeActive = false;
    let isStealthActive = false;
    let currentEV = 0.0;

    const films = [
      { name: 'Tri-X 400', isBW: true, contrast: 1.55 },
      { name: 'HP5 Plus', isBW: true, contrast: 1.25 },
      { name: 'T-Max 3200', isBW: true, contrast: 1.90 },
      { name: 'Neopan 100', isBW: true, contrast: 1.35 },
      { name: 'Portra 400', isBW: false, filter: 'saturate(85%) contrast(110%) sepia(10%)' },
      { name: 'Cinestill 800T', isBW: false, filter: 'saturate(115%) contrast(130%) hue-rotate(190deg) sepia(15%)' }
    ];
    let filmIdx = 0;

    const grids = ['thirds', 'golden', 'fibonacci', 'diagonals', 'center', 'off'];
    const gridNames = {
      'thirds': '🌐 Третини',
      'golden': '🌐 Золотий перетин',
      'fibonacci': '🌐 Спіраль Фібоначчі',
      'diagonals': '🌐 Діагоналі',
      'center': '🌐 Центр',
      'off': '🌐 Сітка: Вимк'
    };
    let gridIdx = 0;

    function updateFilters() {
      const brightnessFactor = Math.pow(2, currentEV);
      const preset = films[filmIdx];
      if (preset.isBW) {
        v.style.filter = 'grayscale(100%) contrast(' + (preset.contrast * 100) + '%) brightness(' + (brightnessFactor * 100) + '%)';
      } else {
        v.style.filter = preset.filter + ' brightness(' + (brightnessFactor * 100) + '%)';
      }
    }

    function renderGrid() {
      const mode = grids[gridIdx];
      btnGrid.textContent = gridNames[mode];
      grid.innerHTML = '';

      if (mode === 'thirds') {
        grid.innerHTML = '<div class="grid-v" style="left:33.33%;"></div><div class="grid-v" style="left:66.66%;"></div><div class="grid-h" style="top:33.33%;"></div><div class="grid-h" style="top:66.66%;"></div>';
      } else if (mode === 'golden') {
        grid.innerHTML = '<div class="grid-v" style="left:38.2%;"></div><div class="grid-v" style="left:61.8%;"></div><div class="grid-h" style="top:38.2%;"></div><div class="grid-h" style="top:61.8%;"></div>';
      } else if (mode === 'fibonacci') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 618" preserveAspectRatio="none"><path d="M 0,618 A 618,618 0 0,1 618,0 A 382,382 0 0,1 1000,382 A 236,236 0 0,1 764,618 A 146,146 0 0,1 618,472 A 90,90 0 0,1 708,382 A 56,56 0 0,1 764,438 A 34,34 0 0,1 730,472" /><line x1="618" y1="0" x2="618" y2="618" stroke="rgba(255,255,255,0.25)" /><line x1="618" y1="382" x2="1000" y2="382" stroke="rgba(255,255,255,0.25)" /><line x1="764" y1="382" x2="764" y2="618" stroke="rgba(255,255,255,0.25)" /></svg>';
      } else if (mode === 'diagonals') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><line x1="0" y1="0" x2="1000" y2="1000" /><line x1="1000" y1="0" x2="0" y2="1000" /><line x1="0" y1="500" x2="500" y2="0" stroke="rgba(255,255,255,0.25)" /><line x1="500" y1="1000" x2="1000" y2="500" stroke="rgba(255,255,255,0.25)" /></svg>';
      } else if (mode === 'center') {
        grid.innerHTML = '<div class="center-cross"></div><div class="grid-v" style="left:50%;"></div><div class="grid-h" style="top:50%;"></div>';
      }
    }

    // 1. ЗАПУСК КАМЕРИ З ВИСОКОЮ РОЗДІЛЬНОЮ ЗДАТНІСТЮ
    btnStart.addEventListener('click', () => {
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }

      navigator.mediaDevices.getUserMedia({
        video: { 
          facingMode: { ideal: "environment" },
          width: { ideal: 3840, min: 1920 },
          height: { ideal: 2160, min: 1080 }
        },
        audio: false
      }).then(stream => {
        v.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        v.play();
        btnStart.style.display = 'none';
        hud.style.display = 'flex';
        renderGrid();
        updateFilters();
      }).catch(err => {
        // Fallback, якщо пристрій не підтримує 4K/FullHD
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        }).then(stream => {
          v.srcObject = stream;
          videoTrack = stream.getVideoTracks()[0];
          v.play();
          btnStart.style.display = 'none';
          hud.style.display = 'flex';
          renderGrid();
          updateFilters();
        }).catch(e => alert("Помилка камери: " + e.message));
      });
    });

    // 2. ПЛІВКИ
    btnFilm.addEventListener('click', (e) => {
      e.stopPropagation();
      filmIdx = (filmIdx + 1) % films.length;
      btnFilm.textContent = '🎞️ ' + films[filmIdx].name;
      updateFilters();
    });

    // 3. СІТКИ
    btnGrid.addEventListener('click', (e) => {
      e.stopPropagation();
      gridIdx = (gridIdx + 1) % grids.length;
      renderGrid();
    });

    // 4. ДАЛЕКОМІР
    btnRange.addEventListener('click', (e) => {
      e.stopPropagation();
      isRangeActive = !isRangeActive;
      rangefinder.style.display = isRangeActive ? 'block' : 'none';
      btnRange.classList.toggle('active', isRangeActive);
    });

    // 5. СТЕЛС-РЕЖИМ
    btnStealth.addEventListener('click', (e) => {
      e.stopPropagation();
      isStealthActive = true;
      stealthOverlay.style.display = 'block';
      if (navigator.vibrate) navigator.vibrate(40);
    });

    btnStealthExit.addEventListener('click', (e) => {
      e.stopPropagation();
      isStealthActive = false;
      stealthOverlay.style.display = 'none';
      if (navigator.vibrate) navigator.vibrate([20, 20]);
    });

    stealthOverlay.addEventListener('click', (e) => {
      if (e.target === btnStealthExit) return;
      capturePhoto(true);
    });

    // 6. НАЛАШТУВАННЯ
    btnSettings.addEventListener('click', (e) => {
      e.stopPropagation();
      settingsModal.style.display = 'flex';
    });

    closeSettingsBtn.addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });

    evSlider.addEventListener('input', (e) => {
      currentEV = parseFloat(e.target.value);
      evVal.textContent = (currentEV > 0 ? '+' : '') + currentEV.toFixed(1) + ' EV';
      updateFilters();
    });

    document.querySelectorAll('#focus-group .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#focus-group .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const dist = btn.getAttribute('data-dist');
        if (videoTrack && videoTrack.applyConstraints) {
          if (dist === 'auto') {
            videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
          } else {
            videoTrack.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: parseFloat(dist) }] }).catch(() => {});
          }
        }
      });
    });

    // 7. ЗЙОМКА ТА ЗБЕРЕЖЕННЯ У ПОВНІЙ ЯКОСТІ
    function capturePhoto(isSilentStealth = false) {
      if (settingsModal.style.display === 'flex') return;

      if (!isSilentStealth) {
        shutter.classList.add('flash');
        setTimeout(() => shutter.classList.remove('flash'), 100);
      }

      if (navigator.vibrate) {
        if (isSilentStealth) {
          navigator.vibrate(35);
        } else {
          navigator.vibrate([30, 20, 30]);
        }
      }

      const w = v.videoWidth || 1920;
      const h = v.videoHeight || 1080;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(v, 0, 0, w, h);

      const activePreset = films[filmIdx];
      const evFactor = Math.pow(2, currentEV);

      if (activePreset.isBW) {
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        const contrast = activePreset.contrast || 1.45;

        for (let i = 0; i < d.length; i += 4) {
          let r = d[i] * evFactor;
          let g = d[i + 1] * evFactor;
          let b = d[i + 2] * evFactor;

          let y = 0.299 * r + 0.587 * g + 0.114 * b;
          y = ((y / 255 - 0.5) * contrast + 0.5) * 255;
          y = Math.min(255, Math.max(0, y));

          d[i] = y; d[i + 1] = y; d[i + 2] = y;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      canvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'STREET_' + activePreset.name.replace(/\s+/g, '') + '_' + Date.now() + '.jpg';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      }, 'image/jpeg', 0.98);
    }

    btnSnap.addEventListener('click', (e) => {
      e.stopPropagation();
      capturePhoto(false);
    });

    v.addEventListener('click', () => capturePhoto(false));

    window.addEventListener('keydown', (e) => {
      if (e.key === 'VolumeDown' || e.key === 'VolumeUp' || e.code === 'VolumeDown' || e.code === 'VolumeUp') {
        e.preventDefault();
        capturePhoto(isStealthActive);
      }
    });
  </script>
</body>
</html>
