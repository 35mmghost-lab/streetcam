<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    #viewfinder-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.1s ease;
    }
    /* Сітка */
    #grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      grid-template-rows: 1fr 1fr 1fr;
      opacity: 0.3;
      border: 1px solid rgba(255, 255, 255, 0.4);
    }
    .grid-cell {
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    /* Верхній HUD */
    #top-hud {
      position: absolute;
      top: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 12px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }
    .hud-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #eee;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .hud-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }
    /* Панель налаштувань */
    #settings-modal {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(12, 12, 12, 0.95);
      border-top: 1px solid #333;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 14px;
      z-index: 30;
    }
    .setting-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 6px;
    }
    .setting-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }
    .opt-btn {
      flex: 1;
      padding: 10px;
      background: #1e1e1e;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }
    .opt-btn.active {
      background: #fff;
      color: #000;
      font-weight: bold;
      border-color: #fff;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }
    input[type=range] {
      flex: 1;
      accent-color: #fff;
      height: 4px;
    }
    .slider-val {
      font-size: 12px;
      font-family: monospace;
      min-width: 45px;
      text-align: right;
    }
    #close-settings-btn {
      width: 100%;
      padding: 12px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 4px;
      cursor: pointer;
    }
    /* Анімація спалаху затвора */
    #shutter-flash {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 25;
    }
    .flash-anim {
      animation: flash 0.1s ease-out;
    }
    @keyframes flash {
      0% { opacity: 0.9; }
      100% { opacity: 0; }
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="viewfinder-container">
      <video id="camera-stream" autoplay playsinline muted></video>
      <div id="grid-overlay">
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
        <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
      </div>
      <div id="shutter-flash"></div>
    </div>

    <!-- HUD -->
    <div id="top-hud">
      <button class="hud-btn" id="shutter-hud-btn">📷 SNAP</button>
      <button class="hud-btn" id="aspect-btn">3:2</button>
      <button class="hud-btn" id="grid-btn">🌐 Сітка</button>
      <button class="hud-btn" id="film-btn">🎞️ Tri-X 400</button>
      <button class="hud-btn" id="open-settings-btn">⚙️</button>
    </div>

    <!-- Налаштування -->
    <div id="settings-modal">
      <div>
        <div class="setting-title">Експокорекція (EV)</div>
        <div class="slider-container">
          <input type="range" id="ev-slider" min="-2.0" max="2.0" step="0.1" value="0.0">
          <span class="slider-val" id="ev-val">0.0 EV</span>
        </div>
      </div>

      <div>
        <div class="setting-title">Фокусування (Focus Mode)</div>
        <div class="setting-row">
          <button class="opt-btn active" data-type="focus" data-val="continuous">Auto (AF)</button>
          <button class="opt-btn" data-type="focus" data-val="hyperfocal">Гіперфокал (2-3м)</button>
        </div>
      </div>

      <div>
        <div class="setting-title">Світлочутливість (ISO)</div>
        <div class="setting-row">
          <button class="opt-btn active" data-type="iso" data-val="auto">Auto</button>
          <button class="opt-btn" data-type="iso" data-val="400">400</button>
          <button class="opt-btn" data-type="iso" data-val="800">800</button>
          <button class="opt-btn" data-type="iso" data-val="1600">1600</button>
        </div>
      </div>

      <button id="close-settings-btn">Закрити налаштування</button>
    </div>
  </div>

  <canvas id="capture-canvas"></canvas>

  <script>
    const video = document.getElementById('camera-stream');
    const flash = document.getElementById('shutter-flash');
    const canvas = document.getElementById('capture-canvas');
    const settingsModal = document.getElementById('settings-modal');
    const evSlider = document.getElementById('ev-slider');
    const evVal = document.getElementById('ev-val');

    let videoTrack = null;
    let currentEV = 0.0;
    let currentFilm = 'tri-x'; // Tri-X 400

    // Запуск камери
    async function initCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        updateFilters();
      } catch (err) {
        console.error('Помилка доступу до камери:', err);
      }
    }

    // Оновлення фільтрів видошукача (Tri-X 400 + EV)
    function updateFilters() {
      // Розрахунок яскравості відповідно до EV
      const brightnessFactor = Math.pow(2, currentEV);
      video.style.filter = `grayscale(100%) contrast(150%) brightness(${brightnessFactor * 100}%)`;
    }

    // Зміна EV через повзунок
    evSlider.addEventListener('input', (e) => {
      currentEV = parseFloat(e.target.value);
      evVal.textContent = `${currentEV > 0 ? '+' : ''}${currentEV.toFixed(1)} EV`;
      updateFilters();

      // Спроба застосувати апаратний EV
      if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
        const capabilities = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (capabilities.exposureCompensation) {
          videoTrack.applyConstraints({
            advanced: [{ exposureCompensation: currentEV }]
          }).catch(() => {});
        }
      }
    });

    // Спуск затвора та автозбереження
    async function triggerShutter() {
      // Анімація затвора
      flash.classList.remove('flash-anim');
      void flash.offsetWidth;
      flash.classList.add('flash-anim');

      // Вібрація (якщо підтримується)
      if (navigator.vibrate) navigator.vibrate(40);

      // Захоплення кадру
      const width = video.videoWidth || 1920;
      const height = video.videoHeight || 1080;
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      // Застосування фільтра Tri-X + EV до полотна
      const brightnessFactor = Math.pow(2, currentEV);
      ctx.filter = `grayscale(100%) contrast(150%) brightness(${brightnessFactor * 100}%)`;
      ctx.drawImage(video, 0, 0, width, height);

      // Автоматичне пряме завантаження без запитання
      canvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `STREET_${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);
      }, 'image/jpeg', 0.95);
    }

    // Клік по екрану для фото
    document.getElementById('viewfinder-container').addEventListener('click', (e) => {
      if (settingsModal.style.display === 'flex') return;
      triggerShutter();
    });

    // Фізичні кнопки гучності як спуск
    window.addEventListener('keydown', (e) => {
      if (e.key === 'VolumeDown' || e.key === 'VolumeUp') {
        e.preventDefault();
        triggerShutter();
      }
    });

    document.getElementById('shutter-hud-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      triggerShutter();
    });

    // Керування меню налаштувань
    document.getElementById('open-settings-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      settingsModal.style.display = 'flex';
    });
    document.getElementById('close-settings-btn').addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });

    // Перемикання сітки
    let gridVisible = true;
    document.getElementById('grid-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      gridVisible = !gridVisible;
      document.getElementById('grid-overlay').style.display = gridVisible ? 'grid' : 'none';
    });

    // Запуск
    window.addEventListener('load', initCamera);
  </script>
</body>
</html>
