<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cam Test</title>
  <style>
    body { background: #111; color: #fff; font-family: monospace; padding: 20px; text-align: center; }
    #v { width: 100%; max-height: 60vh; background: #222; border: 2px solid #ffb642; margin-top: 15px; }
    button { padding: 16px 24px; font-size: 18px; font-weight: bold; background: #ffb642; border: none; border-radius: 8px; cursor: pointer; }
    #log { margin-top: 15px; color: #39ff14; font-size: 14px; text-align: left; background: #000; padding: 10px; border-radius: 6px; }
  </style>
</head>
<body>
  <h2>StreetCam Test</h2>
  <button id="btn" onclick="run()">▶ ТЕСТ КАМЕРИ</button>
  <div id="log">Статус: очікування натискання...</div>
  <video id="v" autoplay playsinline muted></video>

  <script>
    function log(msg) {
      document.getElementById('log').innerText += '\n' + msg;
    }

    function run() {
      log('1. Запит дозволу на камеру...');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        log('ПОМИЛКА: mediaDevices не підтримується цим браузером/протоколом (потрібен HTTPS).');
        return;
      }

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      }).then(function(stream) {
        log('2. Дозвіл отримано! Передача потоку у відео...');
        var v = document.getElementById('v');
        v.srcObject = stream;
        v.play().then(function() {
          log('3. УСПІХ: Відео відтворюється!');
        }).catch(function(e) {
          log('Помилка відтворення play(): ' + e.message);
        });
      }).catch(function(err) {
        log('ПОМИЛКА getUserMedia: ' + err.name + ' — ' + err.message);
      });
    }
  </script>
</body>
</html>
