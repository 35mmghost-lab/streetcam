<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam Pro</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-user-select: none; 
      -webkit-tap-highlight-color: transparent; 
    }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
    #v { width: 100vw; height: 100vh; object-fit: cover; }

    #btn-start {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 18px 28px; font-size: 16px; font-weight: bold; background: #ffb642;
      border: 2px solid #fff; border-radius: 10px; color: #000; z-index: 10000; cursor: pointer;
    }

    #top-bar {
      position: fixed; top: 10px; left: 0; width: 100%; display: none;
      z-index: 999; background: rgba(0,0,0,0.8); padding: 8px 6px;
      overflow-x: auto; white-space: nowrap; gap: 6px;
    }
    #top-bar::-webkit-scrollbar { display: none; }
    
    .t-btn {
      display: inline-block; background: #1a1a1a; color: #ffb642; border: 1px solid #ffb642;
      padding: 6px 10px; border-radius: 4px; font-size: 11px; cursor: pointer;
    }
    .t-btn.active { background: #39ff14; color: #000; border-color: #39ff14; font-weight: bold; }

    #control-strip {
      position: fixed; top: 56px; left: 50%; transform: translateX(-50%);
      display: none; justify-content: center; align-items: center; gap: 8px; z-index: 998;
      background: rgba(0,0,0,0.7); padding: 5px 14px; border-radius: 20px;
      border: 1px solid rgba(255,182,66,0.3); backdrop-filter: blur(4px);
    }
    .strip-label { font-size: 11px; color: #ddd; font-weight: bold; text-shadow: 0 1px 2px #000; }
    #ev-slider { accent-color: #ffb642; width: 130px; height: 18px; cursor: pointer; }
    #ev-label { font-size: 12px; color: #ffb642; min-width: 55px; text-align: right; font-weight: bold; text-shadow: 0 1px 2px #000; }

    #frameline { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; display: none; }
    #frame-box {
      position: absolute; border: 1.5px solid rgba(255, 182, 66, 0.85);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); overflow: hidden;
    }

    #grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .grid-v, .grid-h { position: absolute; background: rgba(255, 255, 255, 0.45); }
    .grid-v { top: 0; bottom: 0; width: 1px; }
    .grid-h { left: 0; right: 0; height: 1px; }
    .grid-svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; stroke: rgba(255,255,255,0.55); stroke-width: 1.5; fill: none; }
    .grid-sub { stroke: rgba(255,255,255,0.25); stroke-width: 1; fill: none; }
    .center-cross { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; }
    .center-cross::before, .center-cross::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.7); }
    .center-cross::before { top: 15px; left: 0; width: 32px; height: 1px; }
    .center-cross::after { top: 0; left: 15px; width: 1px; height: 32px; }

    #rangefinder { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; display: none; }
    .rad-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 4px #39ff14); }

    #stealth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 2000; display: none; cursor: pointer; }
    #btn-stealth-exit { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #888; padding: 8px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; }

    #hud {
      position: fixed; bottom: 25px; left: 0; width: 100%; display: none;
      justify-content: center; z-index: 999;
    }
    #btn-snap {
      width: 68px; height: 68px; border-radius: 50%; background: #ffb642;
      border: 3.5px solid #fff; box-shadow: 0 0 0 3px rgba(0,0,0,0.6), 0 4px 10px rgba(0,0,0,0.5);
      cursor: pointer; position: relative;
    }
    #btn-snap::after {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 14px; height: 14px; border-radius: 50%; background: rgba(0,0,0,0.25);
    }
    canvas { display: none; }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  
  <div id="frameline">
    <div id="frame-box">
      <div id="grid"></div>
    </div>
  </div>

  <div id="rangefinder">
    <svg class="rad-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <line x1="160" y1="120" x2="240" y2="120" stroke="#39ff14" stroke-width="3" />
      <line x1="160" y1="880" x2="240" y2="880" stroke="#39ff14" stroke-width="3" />
      <text x="100" y="505" fill="#39ff14" font-size="16" font-weight="bold" font-family="monospace">1.2m</text>
      <circle cx="200" cy="210" r="45" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" fill="none" />
      <line x1="200" y1="255" x2="200" y2="560" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="140" y1="350" x2="260" y2="350" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="200" y1="560" x2="150" y2="880" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="200" y1="560" x2="250" y2="880" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" />

      <line x1="470" y1="260" x2="530" y2="260" stroke="#39ff14" stroke-width="3" />
      <line x1="470" y1="740" x2="530" y2="740" stroke="#39ff14" stroke-width="3" />
      <text x="545" y="505" fill="#39ff14" font-size="16" font-weight="bold" font-family="monospace">2.0m</text>
      <circle cx="500" cy="315" r="26" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" fill="none" />
      <line x1="500" y1="341" x2="500" y2="540" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="460" y1="400" x2="540" y2="400" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="500" y1="540" x2="470" y2="740" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="500" y1="540" x2="530" y2="740" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" />

      <line x1="750" y1="340" x2="790" y2="340" stroke="#39ff14" stroke-width="3" />
      <line x1="750" y1="660" x2="790" y2="660" stroke="#39ff14" stroke-width="3" />
      <text x="805" y="505" fill="#39ff14" font-size="16" font-weight="bold" font-family="monospace">3.0m</text>
      <circle cx="770" cy="375" r="18" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" fill="none" />
      <line x1="770" y1="393" x2="770" y2="535" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="740" y1="440" x2="800" y2="440" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="770" y1="535" x2="745" y2="660" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" />
      <line x1="770" y1="535" x2="795" y2="660" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" />
    </svg>
  </div>

  <div id="stealth-overlay" onclick="snap(true)">
    <button id="btn-stealth-exit" onclick="exitStealth(event)">✕ EXIT</button>
  </div>

  <button id="btn-start" onclick="startCam()">▶ УВІМКНУТИ КАМЕРУ</button>

  <div id="top-bar">
    <button class="t-btn" id="film-btn" onclick="nextFilm()">🎞️ Tri-X 400</button>
    <button class="t-btn" id="iso-btn" onclick="nextISO()">⚡ ISO: Auto</button>
    <button class="t-btn" id="focus-btn" onclick="nextFocus()">🔍 Фокус: Auto</button>
    <button class="t-btn" id="frame-btn" onclick="nextFrame()">📐 Full</button>
    <button class="t-btn" id="grid-btn" onclick="nextGrid()">🌐 Сітка: Вимк</button>
    <button class="t-btn" id="range-btn" onclick="toggleRange()">🎯 Далекомір</button>
    <button class="t-btn" id="stealth-btn" onclick="enterStealth()">🕶️ Стелс</button>
  </div>

  <div id="control-strip">
    <span class="strip-label">EV</span>
    <input type="range" id="ev-slider" min="-2.0" max="2.0" step="0.2" value="0.0" oninput="setEV(this.value)">
    <span id="ev-label">0.0 EV</span>
  </div>

  <div id="hud">
    <button id="btn-snap" onclick="snap(false)"></button>
  </div>

  <canvas id="c"></canvas>

  <script>
    var v = document.getElementById('v');
    var btnStart = document.getElementById('btn-start');
    var topBar = document.getElementById('top-bar');
    var controlStrip = document.getElementById('control-strip');
    var evSlider = document.getElementById('ev-slider');
    var evLabel = document.getElementById('ev-label');
    var hud = document.getElementById('hud');
    var filmBtn = document.getElementById('film-btn');
    var isoBtn = document.getElementById('iso-btn');
    var focusBtn = document.getElementById('focus-btn');
    var frameBtn = document.getElementById('frame-btn');
    var gridBtn = document.getElementById('grid-btn');
    var rangeBtn = document.getElementById('range-btn');
    var frameline = document.getElementById('frameline');
    var frameBox = document.getElementById('frame-box');
    var gridEl = document.getElementById('grid');
    var rangeEl = document.getElementById('rangefinder');
    var stealthEl = document.getElementById('stealth-overlay');
    var c = document.getElementById('c');

    var activeStream = null;

    var films = [
      { name: 'Tri-X 400', isBW: true, isIR: false, contrast: 1.5, base: 'grayscale(100%) contrast(150%)' },
      { name: 'T-Max 3200', isBW: true, isIR: false, contrast: 1.9, base: 'grayscale(100%) contrast(190%)' },
      { name: 'HP5 Plus', isBW: true, isIR: false, contrast: 1.25, base: 'grayscale(100%) contrast(125%)' },
      { name: 'Neopan 100', isBW: true, isIR: false, contrast: 1.35, base: 'grayscale(100%) contrast(135%)' },
      { name: 'Infrared (IR)', isBW: true, isIR: true, contrast: 2.2, base: 'grayscale(100%) contrast(220%)' },
      { name: 'Portra 400', isBW: false, isIR: false, contrast: 1.1, base: 'saturate(85%) contrast(110%) sepia(15%)' },
      { name: 'Cinestill 800T', isBW: false, isIR: false, contrast: 1.3, base: 'saturate(120%) contrast(130%) hue-rotate(190deg)' }
    ];
    var fIdx = 0;
    var currentEV = 0.0;

    var isoList = ['Auto', '100', '200', '400', '800', '1600'];
    var isoIdx = 0;

    var focusZones = [
      { name: 'Auto', val: 'auto' },
      { name: '1.2m', val: 1.2 },
      { name: '2.0m', val: 2.0 },
      { name: '3.0m', val: 3.0 },
      { name: '∞ Нескінч', val: 100.0 }
    ];
    var focusIdx = 0;

    var frames = [
      { name: 'Full', ratio: null },
      { name: '3:2 (35mm)', ratio: 2/3 },
      { name: '4:3 (645)', ratio: 3/4 },
      { name: '1:1 (6x6)', ratio: 1.0 },
      { name: '65:24 (XPan)', ratio: 24/65 }
    ];
    var rIdx = 0;

    var grids = ['off', 'thirds', 'golden', 'fibonacci', 'diagonals', 'center'];
    var gridLabels = {
      'off': '🌐 Сітка: Вимк',
      'thirds': '🌐 Третини',
      'golden': '🌐 Золотий перетин',
      'fibonacci': '🌐 Фібоначчі',
      'diagonals': '🌐 Діагоналі',
      'center': '🌐 Центр'
    };
    var gIdx = 0;

    var isRangeOn = false;

    function startCam() {
      btnStart.innerText = "⏳ Запуск...";
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      }).then(function(stream) {
        activeStream = stream;
        v.srcObject = stream;
        
        btnStart.style.display = 'none';
        topBar.style.display = 'flex';
        controlStrip.style.display = 'flex';
        hud.style.display = 'flex';
        
        applyFilm();
        renderLayout();
      }).catch(function(err) {
        btnStart.innerText = "▶ УВІМКНУТИ КАМЕРУ";
        alert("Помилка камери: " + (err.message || err.name));
      });
    }

    function applyFilm() {
      var bFactor = Math.pow(2, currentEV);
      v.style.filter = films[fIdx].base + ' brightness(' + (bFactor * 100) + '%)';
    }

    function setEV(val) {
      currentEV = parseFloat(val);
      evLabel.textContent = (currentEV > 0 ? '+' : '') + currentEV.toFixed(1) + ' EV';
      applyFilm();
    }

    function nextFilm() {
      fIdx = (fIdx + 1) % films.length;
      filmBtn.textContent = '🎞️ ' + films[fIdx].name;
      applyFilm();
    }

    function nextISO() {
      isoIdx = (isoIdx + 1) % isoList.length;
      var curISO = isoList[isoIdx];
      isoBtn.textContent = '⚡ ISO: ' + curISO;
      if (activeStream) {
        var track = activeStream.getVideoTracks()[0];
        if (track && track.applyConstraints) {
          if (curISO === 'Auto') {
            track.applyConstraints({ advanced: [{ exposureMode: 'continuous' }] }).catch(function(){});
          } else {
            track.applyConstraints({ advanced: [{ iso: parseInt(curISO) }] }).catch(function(){});
          }
        }
      }
    }

    function nextFocus() {
      focusIdx = (focusIdx + 1) % focusZones.length;
      var zone = focusZones[focusIdx];
      focusBtn.textContent = '🔍 Фокус: ' + zone.name;
      if (activeStream) {
        var track = activeStream.getVideoTracks()[0];
        if (track && track.applyConstraints) {
          if (zone.val === 'auto') {
            track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function(){});
          } else {
            track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: zone.val }] }).catch(function(){});
          }
        }
      }
    }

    function nextFrame() {
      rIdx = (rIdx + 1) % frames.length;
      frameBtn.textContent = '📐 ' + frames[rIdx].name;
      renderLayout();
    }

    function nextGrid() {
      gIdx = (gIdx + 1) % grids.length;
      gridBtn.textContent = gridLabels[grids[gIdx]];
      renderGrid();
    }

    function toggleRange() {
      isRangeOn = !isRangeOn;
      rangeEl.style.display = isRangeOn ? 'block' : 'none';
      rangeBtn.classList.toggle('active', isRangeOn);
    }

    function enterStealth() {
      stealthEl.style.display = 'block';
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function exitStealth(e) {
      if (e) e.stopPropagation();
      stealthEl.style.display = 'none';
      if (navigator.vibrate) navigator.vibrate([20, 20]);
    }

    function renderLayout() {
      var cur = frames[rIdx];
      frameline.style.display = 'block';

      if (!cur.ratio) {
        frameBox.style.width = '100vw';
        frameBox.style.height = '100vh';
        frameBox.style.top = '0px';
        frameBox.style.left = '0px';
        frameBox.style.boxShadow = 'none';
        frameBox.style.border = 'none';
      } else {
        frameBox.style.boxShadow = '0 0 0 9999px rgba(0, 0, 0, 0.55)';
        frameBox.style.border = '1.5px solid rgba(255, 182, 66, 0.85)';
        var screenRatio = window.innerWidth / window.innerHeight;
        var w, h;
        if (screenRatio > cur.ratio) {
          h = window.innerHeight;
          w = Math.round(h * cur.ratio);
        } else {
          w = window.innerWidth;
          h = Math.round(w / cur.ratio);
        }
        frameBox.style.width = w + 'px';
        frameBox.style.height = h + 'px';
        frameBox.style.top = Math.round((window.innerHeight - h) / 2) + 'px';
        frameBox.style.left = Math.round((window.innerWidth - w) / 2) + 'px';
      }
      renderGrid();
    }
    window.addEventListener('resize', renderLayout);

    function renderGrid() {
      var mode = grids[gIdx];
      gridEl.innerHTML = '';
      if (mode === 'off') return;

      var isPortrait = frameBox.clientHeight >= frameBox.clientWidth;

      if (mode === 'thirds') {
        gridEl.innerHTML = '<div class="grid-v" style="left:33.33%;"></div><div class="grid-v" style="left:66.66%;"></div><div class="grid-h" style="top:33.33%;"></div><div class="grid-h" style="top:66.66%;"></div>';
      } else if (mode === 'golden') {
        gridEl.innerHTML = '<div class="grid-v" style="left:38.2%;"></div><div class="grid-v" style="left:61.8%;"></div><div class="grid-h" style="top:38.2%;"></div><div class="grid-h" style="top:61.8%;"></div>';
      } else if (mode === 'center') {
        gridEl.innerHTML = '<div class="center-cross"></div><div class="grid-v" style="left:50%;"></div><div class="grid-h" style="top:50%;"></div>';
      } else if (mode === 'diagonals') {
        gridEl.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><line x1="0" y1="0" x2="1000" y2="1000" /><line x1="1000" y1="0" x2="0" y2="1000" /><line x1="0" y1="500" x2="500" y2="0" class="grid-sub" /><line x1="500" y1="1000" x2="1000" y2="500" class="grid-sub" /><line x1="0" y1="500" x2="500" y2="1000" class="grid-sub" /><line x1="500" y1="0" x2="1000" y2="500" class="grid-sub" /></svg>';
      } else if (mode === 'fibonacci') {
        gridEl.innerHTML = '<svg class="grid-svg" viewBox="0 0 618 1000" preserveAspectRatio="none"><path d="M 0,0 A 618,618 0 0,1 618,618 A 382,382 0 0,1 236,1000 A 236,236 0 0,1 0,764 A 146,146 0 0,1 146,618 A 90,90 0 0,1 236,708 A 56,56 0 0,1 180,764 A 34,34 0 0,1 146,730" /><line x1="0" y1="618" x2="618" y2="618" class="grid-sub" /><line x1="236" y1="618" x2="236" y2="1000" class="grid-sub" /><line x1="0" y1="764" x2="236" y2="764" class="grid-sub" /><line x1="146" y1="618" x2="146" y2="764" class="grid-sub" /></svg>';
      }
    }

    function snap(isSilent) {
      if (navigator.vibrate) navigator.vibrate(isSilent ? 35 : 25);

      var vw = v.videoWidth || 1920;
      var vh = v.videoHeight || 1080;
      var curFrame = frames[rIdx];

      var streamW = Math.min(vw, vh);
      var streamH = Math.max(vw, vh);

      var cropW = streamW;
      var cropH = streamH;
      var cropX = 0;
      var cropY = 0;

      if (curFrame.ratio) {
        var targetRatio = curFrame.ratio;
        var currentStreamRatio = streamW / streamH;

        if (currentStreamRatio > targetRatio) {
          cropH = streamH;
          cropW = Math.round(streamH * targetRatio);
          cropX = Math.round((streamW - cropW) / 2);
        } else {
          cropW = streamW;
          cropH = Math.round(streamW / targetRatio);
          cropY = Math.round((streamH - cropH) / 2);
        }
      }

      c.width = cropW;
      c.height = cropH;
      var ctx = c.getContext('2d');

      var bFactor = Math.pow(2, currentEV);
      var curFilm = films[fIdx];

      if (vw > vh) {
        ctx.drawImage(v, (vw - cropW) / 2, (vh - cropH) / 2, cropW, cropH, 0, 0, cropW, cropH);
      } else {
        ctx.drawImage(v, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      }

      if (curFilm.isBW) {
        var imgData = ctx.getImageData(0, 0, c.width, c.height);
        var d = imgData.data;
        var contrast = curFilm.contrast;
        for (var i = 0; i < d.length; i += 4) {
          var gray;
          if (curFilm.isIR) {
            gray = (0.75 * d[i] + 0.20 * d[i+1] + 0.05 * d[i+2]) * bFactor;
          } else {
            gray = (0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]) * bFactor;
          }
          gray = ((gray - 128) * contrast) + 128;
          if (gray < 0) gray = 0;
          if (gray > 255) gray = 255;
          d[i] = gray;
          d[i+1] = gray;
          d[i+2] = gray;
        }
        ctx.putImageData(imgData, 0, 0);
      } else {
        ctx.filter = curFilm.base + ' brightness(' + (bFactor * 100) + '%)';
        ctx.drawImage(c, 0, 0);
      }
      
      c.toBlob(function(blob) {
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'STREET_' + curFilm.name.replace(/ /g, '') + '_' + Date.now() + '.jpg';
        a.click();
      }, 'image/jpeg', 0.98);
    }
  </script>
</body>
</html>
