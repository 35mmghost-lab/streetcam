<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
    #v { width: 100vw; height: 100vh; object-fit: cover; filter: grayscale(100%) contrast(150%); }
    #btn-start {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 18px 28px; font-size: 16px; font-weight: bold; background: #ffb642;
      border: 2px solid #fff; border-radius: 10px; color: #000; z-index: 999;
    }
    #hud {
      position: fixed; bottom: 25px; left: 0; width: 100%; display: none;
      justify-content: center; z-index: 999;
    }
    #btn-snap {
      width: 75px; height: 75px; border-radius: 50%; background: #ffb642;
      border: 4px solid #fff; font-size: 14px; font-weight: bold; color: #000;
    }
    canvas { display: none; }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  <button id="btn-start" onclick="startCam()">▶ УВІМКНУТИ КАМЕРУ</button>

  <div id="hud">
    <button id="btn-snap" onclick="snap()">📷 СПУСК</button>
  </div>

  <canvas id="c"></canvas>

  <script>
    const v = document.getElementById('v');
    const btnStart = document.getElementById('btn-start');
    const hud = document.getElementById('hud');
    const c = document.getElementById('c');

    async function startCam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        v.srcObject = stream;
        btnStart.style.display = 'none';
        hud.style.display = 'flex';
      } catch (err) {
        alert("Помилка: " + err.message);
      }
    }

    function snap() {
      c.width = v.videoWidth || 1920;
      c.height = v.videoHeight || 1080;
      const ctx = c.getContext('2d');
      ctx.filter = 'grayscale(100%) contrast(150%)';
      ctx.drawImage(v, 0, 0, c.width, c.height);
      
      c.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'STREET_' + Date.now() + '.jpg';
        a.click();
      }, 'image/jpeg', 0.95);
    }
  </script>
</body>
</html>
