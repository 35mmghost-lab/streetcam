<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
    #v { width: 100vw; height: 100vh; object-fit: cover; }

    #btn-start {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 18px 28px; font-size: 16px; font-weight: bold; background: #ffb642;
      border: 2px solid #fff; border-radius: 10px; color: #000; z-index: 1000; cursor: pointer;
    }

    #top-bar {
      position: fixed; top: 10px; left: 0; width: 100%; display: none;
      justify-content: space-around; z-index: 999; background: rgba(0,0,0,0.65); padding: 8px 4px;
      flex-wrap: wrap; gap: 4px;
    }
    .t-btn {
      background: #222; color: #ffb642; border: 1px solid #ffb642;
      padding: 6px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;
    }
    .t-btn.active { background: #ffb642; color: #000; font-weight: bold; }

    /* Рамка кадрування */
    #frameline { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; display: none; }
    #frame-box {
      position: absolute; border: 1.5px solid rgba(255, 182, 66, 0.85);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); overflow: hidden;
    }

    /* Сітки всередині кадру */
    #grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    .grid-v, .grid-h { position: absolute; background: rgba(255, 255, 255, 0.45); }
    .grid-v { top: 0; bottom: 0; width: 1px; }
    .grid-h { left: 0; right: 0; height: 1px; }
    .grid-svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; stroke: rgba(255,255,255,0.55); stroke-width: 1.5; fill: none; }
    .grid-subline { stroke: rgba(255, 255, 255, 0.25); stroke-width: 1; }
    .center-cross { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; }
    .center-cross::before, .center-cross::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.7); }
    .center-cross::before { top: 15px; left: 0; width: 32px; height: 1px; }
    .center-cross::after { top: 0; left: 15px; width: 1px; height: 32px; }

    /* Далекомір */
    #rangefinder { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; display: none; }
    .stadia-svg { width: 100%; height: 100%; stroke: #ffb642; stroke-width: 2; fill: none; }
    .stadia-label { fill: #ffb642; font-size: 14px; font-weight: bold; font-family: monospace; }

    #hud {
      position: fixed; bottom: 25px; left: 0; width: 100%; display: none;
      justify-content: center; z-index: 999;
    }
    #btn-snap {
      width: 75px; height: 75px; border-radius: 50%; background: #ffb642;
      border: 4px solid #fff; font-size: 13px; font-weight: bold; color: #000; cursor: pointer;
    }
    canvas { display: none; }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  
  <div id="frameline">
    <div id="frame-box">
      <div id="grid"></div>
    </div>
  </div>

  <div id="rangefinder">
    <svg class="stadia-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <line x1="390" y1="120" x2="430" y2="120" />
      <line x1="390" y1="880" x2="430" y2="880" />
      <text x="320" y="505" class="stadia-label">1.2m</text>
      
      <line x1="440" y1="260" x2="470" y2="260" />
      <line x1="440" y1="740" x2="470" y2="740" />
      <text x="390" y="505" class="stadia-label">2.0m</text>

      <line x1="475" y1="340" x2="495" y2="340" />
      <line x1="475" y1="660" x2="495" y2="660" />
      <text x="515" y="505" class="stadia-label">3.0m</text>
    </svg>
  </div>

  <button id="btn-start" onclick="startCam()">▶ УВІМКНУТИ КАМЕРУ</button>

  <div id="top-bar">
    <button class="t-btn" id="film-btn" onclick="nextFilm()">🎞️ Tri-X 400</button>
    <button class="t-btn" id="frame-btn" onclick="nextFrame()">📐 Full</button>
    <button class="t-btn" id="grid-btn" onclick="nextGrid()">🌐 Сітка: Вимк</button>
    <button class="t-btn" id="range-btn" onclick="toggleRange()">🎯 Далекомір</button>
    <button class="t-btn" id="format-btn" onclick="nextFormat()">💾 JPG</button>
  </div>

  <div id="hud">
    <button id="btn-snap" onclick="snap()">📷 СПУСК</button>
  </div>

  <canvas id="c"></canvas>

  <script>
    const v = document.getElementById('v');
    const btnStart = document.getElementById('btn-start');
    const topBar = document.getElementById('top-bar');
    const hud = document.getElementById('hud');
    const c = document.getElementById('c');
    const filmBtn = document.getElementById('film-btn');
    const frameBtn = document.getElementById('frame-btn');
    const gridBtn = document.getElementById('grid-btn');
    const rangeBtn = document.getElementById('range-btn');
    const formatBtn = document.getElementById('format-btn');
    const frameline = document.getElementById('frameline');
    const frameBox = document.getElementById('frame-box');
    const gridEl = document.getElementById('grid');
    const rangeEl = document.getElementById('rangefinder');

    const films = [
      { name: 'Tri-X 400', filter: 'grayscale(100%) contrast(150%)' },
      { name: 'T-Max 3200', filter: 'grayscale(100%) contrast(190%) brightness(90%)' },
      { name: 'HP5 Plus', filter: 'grayscale(100%) contrast(125%)' },
      { name: 'Neopan 100', filter: 'grayscale(100%) contrast(135%)' },
      { name: 'Portra 400', filter: 'saturate(85%) contrast(110%) sepia(15%)' },
      { name: 'Cinestill 800T', filter: 'saturate(120%) contrast(130%) hue-rotate(190deg)' }
    ];
    let fIdx = 0;

    const frames = [
      { name: 'Full', ratio: null },
      { name: '3:2 (35mm)', ratio: 2/3 },
      { name: '4:3 (645)', ratio: 3/4 },
      { name: '1:1 (6x6)', ratio: 1.0 },
      { name: '65:24 (XPan)', ratio: 24/65 }
    ];
    let rIdx = 0;

    const grids = ['off', 'thirds', 'golden', 'fibonacci', 'diagonals', 'center'];
    const gridLabels = {
      'off': '🌐 Сітка: Вимк',
      'thirds': '🌐 Третини',
      'golden': '🌐 Золотий перетин',
      'fibonacci': '🌐 Фібоначчі',
      'diagonals': '🌐 Діагоналі',
      'center': '🌐 Центр'
    };
    let gIdx = 0;

    let isRangeOn = false;
    const formats = ['JPG', 'DNG / RAW'];
    let fmtIdx = 0;

    async function startCam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        v.srcObject = stream;
        btnStart.style.display = 'none';
        topBar.style.display = 'flex';
        hud.style.display = 'flex';
        applyFilm();
        renderLayout();
      } catch (err) {
        alert("Помилка: " + err.message);
      }
    }

    function applyFilm() {
      v.style.filter = films[fIdx].filter;
    }

    function nextFilm() {
      fIdx = (fIdx + 1) % films.length;
      filmBtn.textContent = '🎞️ ' + films[fIdx].name;
      applyFilm();
    }

    function nextFrame() {
      rIdx = (rIdx + 1) % frames.length;
      frameBtn.textContent = '📐 ' + frames[rIdx].name;
      renderLayout();
    }

    function nextGrid() {
      gIdx = (gIdx + 1) % grids.length;
      gridBtn.textContent = gridLabels[grids[gIdx]];
      renderGrid();
    }

    function toggleRange() {
      isRangeOn = !isRangeOn;
      rangeEl.style.display = isRangeOn ? 'block' : 'none';
      rangeBtn.classList.toggle('active', isRangeOn);
    }

    function nextFormat() {
      fmtIdx = (fmtIdx + 1) % formats.length;
      formatBtn.textContent = '💾 ' + formats[fmtIdx];
    }

    function renderLayout() {
      const cur = frames[rIdx];
      frameline.style.display = 'block';

      if (!cur.ratio) {
        frameBox.style.width = '100vw';
        frameBox.style.height = '100vh';
        frameBox.style.top = '0px';
        frameBox.style.left = '0px';
        frameBox.style.boxShadow = 'none';
        frameBox.style.border = 'none';
      } else {
        frameBox.style.boxShadow = '0 0 0 9999px rgba(0, 0, 0, 0.55)';
        frameBox.style.border = '1.5px solid rgba(255, 182, 66, 0.85)';
        const screenRatio = window.innerWidth / window.innerHeight;
        let w, h;
        if (screenRatio > cur.ratio) {
          h = window.innerHeight;
          w = Math.round(h * cur.ratio);
        } else {
          w = window.innerWidth;
          h = Math.round(w / cur.ratio);
        }
        frameBox.style.width = w + 'px';
        frameBox.style.height = h + 'px';
        frameBox.style.top = Math.round((window.innerHeight - h) / 2) + 'px';
        frameBox.style.left = Math.round((window.innerWidth - w) / 2) + 'px';
      }
      renderGrid();
    }
    window.addEventListener('resize', renderLayout);

    function renderGrid() {
      const mode = grids[gIdx];
      gridEl.innerHTML = '';
      if (mode === 'off') return;

      const isPortrait = frameBox.clientHeight >= frameBox.clientWidth;

      if (mode === 'thirds') {
        gridEl.innerHTML = '<div class="grid-v" style="left:33.33%;"></div><div class="grid-v" style="left:66.66%;"></div><div class="grid-h" style="top:33.33%;"></div><div class="grid-h" style="top:66.66%;"></div>';
      } else if (mode === 'golden') {
        gridEl.innerHTML = '<div class="grid-v" style="left:38.2%;"></div><div class="grid-v" style="left:61.8%;"></div><div class="grid-h" style="top:38.2%;"></div><div class="grid-h" style="top:61.8%;"></div>';
      } else if (mode === 'center') {
        gridEl.innerHTML = '<div class="center-cross"></div><div class="grid-v" style="left:50%;"></div><div class="grid-h" style="top:50%;"></div>';
      } else if (mode === 'diagonals') {
        gridEl.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><line x1="0" y1="0" x2="1000" y2="1000" /><line x1="1000" y1="0" x2="0" y2="1000" /><line x1="0" y1="500" x2="500" y2="0" class="grid-subline" /><line x1="500" y1="1000" x2="1000" y2="500" class="grid-subline" /><line x1="0" y1="500" x2="500" y2="1000" class="grid-subline" /><line x1="500" y1="0" x2="1000" y2="500" class="grid-subline" /></svg>';
      } else if (mode === 'fibonacci') {
        if (isPortrait) {
          // Вертикальна неперервна спіраль (618x1000)
          gridEl.innerHTML = '<svg class="grid-svg" viewBox="0 0 618 1000" preserveAspectRatio="none">' +
            '<path d="M 0,0 A 618,618 0 0,1 618,618 A 382,382 0 0,1 236,1000 A 236,236 0 0,1 0,764 A 146,146 0 0,1 146,618 A 90,90 0 0,1 236,708 A 56,56 0 0,1 180,764 A 34,34 0 0,1 146,730" />' +
            '<line x1="0" y1="618" x2="618" y2="618" class="grid-subline" />' +
            '<line x1="236" y1="618" x2="236" y2="1000" class="grid-subline" />' +
            '<line x1="0" y1="764" x2="236" y2="764" class="grid-subline" />' +
            '<line x1="146" y1="618" x2="146" y2="764" class="grid-subline" />' +
            '</svg>';
        } else {
          // Горизонтальна неперервна спіраль (1000x618)
          gridEl.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 618" preserveAspectRatio="none">' +
            '<path d="M 0,618 A 618,618 0 0,1 618,0 A 382,382 0 0,1 1000,382 A 236,236 0 0,1 764,618 A 146,146 0 0,1 618,472 A 90,90 0 0,1 708,382 A 56,56 0 0,1 764,438 A 34,34 0 0,1 730,472" />' +
            '<line x1="618" y1="0" x2="618" y2="618" class="grid-subline" />' +
            '<line x1="618" y1="382" x2="1000" y2="382" class="grid-subline" />' +
            '<line x1="764" y1="382" x2="764" y2="618" class="grid-subline" />' +
            '<line x1="618" y1="472" x2="764" y2="472" class="grid-subline" />' +
            '</svg>';
        }
      }
    }

    function buildDNG(width, height, rgba) {
      const imageBytes = width * height * 3;
      const headerSize = 8;
      const ifdOffset = headerSize + imageBytes;
      const numEntries = 9;
      const ifdSize = 2 + (numEntries * 12) + 4;
      const totalSize = ifdOffset + ifdSize + 64;

      const buffer = new ArrayBuffer(totalSize);
      const view = new DataView(buffer);
      let p = 0;

      view.setUint16(p, 0x4949, true); p += 2;
      view.setUint16(p, 42, true); p += 2;
      view.setUint32(p, ifdOffset, true); p += 4;

      const imgBytes = new Uint8Array(buffer, p, imageBytes);
      for (let i = 0, j = 0; i < rgba.length; i += 4, j += 3) {
        imgBytes[j] = rgba[i];
        imgBytes[j + 1] = rgba[i + 1];
        imgBytes[j + 2] = rgba[i + 2];
      }
      p = ifdOffset;

      view.setUint16(p, numEntries, true); p += 2;
      const writeTag = (tag, type, count, val) => {
        view.setUint16(p, tag, true);
        view.setUint16(p + 2, type, true);
        view.setUint32(p + 4, count, true);
        view.setUint32(p + 8, val, true);
        p += 12;
      };

      writeTag(0x0100, 4, 1, width);
      writeTag(0x0101, 4, 1, height);
      writeTag(0x0102, 3, 3, ifdOffset + ifdSize);
      writeTag(0x0103, 3, 1, 1);
      writeTag(0x0106, 3, 1, 2);
      writeTag(0x0111, 4, 1, headerSize);
      writeTag(0x0115, 3, 1, 3);
      writeTag(0x0116, 4, 1, height);
      writeTag(0x0117, 4, 1, imageBytes);
      view.setUint32(p, 0, true); p += 4;

      view.setUint16(p, 8, true); p += 2;
      view.setUint16(p, 8, true); p += 2;
      view.setUint16(p, 8, true); p += 2;

      return new Blob([buffer], { type: 'image/x-adobe-dng' });
    }

    function snap() {
      const rawW = v.videoWidth || 1920;
      const rawH = v.videoHeight || 1080;
      const curFrame = frames[rIdx];

      let cropW = rawW, cropH = rawH, cropX = 0, cropY = 0;

      if (curFrame.ratio) {
        if (rawW / rawH > curFrame.ratio) {
          cropW = rawH * curFrame.ratio;
          cropX = (rawW - cropW) / 2;
        } else {
          cropH = rawW / curFrame.ratio;
          cropX = 0;
          cropY = (rawH - cropH) / 2;
        }
      }

      c.width = Math.round(cropW);
      c.height = Math.round(cropH);
      const ctx = c.getContext('2d');
      ctx.drawImage(v, cropX, cropY, cropW, cropH, 0, 0, c.width, c.height);

      if (formats[fmtIdx] === 'DNG / RAW') {
        const imgData = ctx.getImageData(0, 0, c.width, c.height);
        const dngBlob = buildDNG(c.width, c.height, imgData.data);
        const a = document.createElement('a');
        a.href = URL.createObjectURL(dngBlob);
        a.download = 'RAW_' + Date.now() + '.dng';
        a.click();
        return;
      }

      ctx.filter = films[fIdx].filter;
      ctx.drawImage(v, cropX, cropY, cropW, cropH, 0, 0, c.width, c.height);
      
      c.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'STREET_' + films[fIdx].name.replace(/ /g, '') + '_' + Date.now() + '.jpg';
        a.click();
      }, 'image/jpeg', 0.95);
    }
  </script>
</body>
</html>
