<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam v2.4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #000; color: #fff; font-family: monospace; overflow: hidden; user-select: none; -webkit-user-select: none; }
    
    #viewfinder-box {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center; background: #000;
    }
    #v-frame {
      position: relative; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center; overflow: hidden;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    #btn-start {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 1000; padding: 22px 30px; font-size: 15px; font-weight: bold;
      background: #ffb642; border: 2px solid #fff; border-radius: 12px; color: #000; cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 182, 66, 0.7); text-align: center; max-width: 85vw;
    }
    #ver-tag {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: #666; z-index: 1001;
    }
    
    #hud {
      position: fixed; top: 12px; left: 0; width: 100%; display: none;
      justify-content: flex-start; align-items: center; padding: 6px 8px; gap: 5px;
      z-index: 500; background: rgba(0, 0, 0, 0.75); overflow-x: auto;
      scrollbar-width: none;
    }
    #hud::-webkit-scrollbar { display: none; }

    .hud-btn {
      background: transparent; border: 1px solid rgba(255, 255, 255, 0.4);
      color: #eee; padding: 6px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }
    .hud-btn.active {
      background: rgba(255, 182, 66, 0.3);
      border-color: #ffb642;
      color: #ffb642;
    }

    /* Сітки */
    #grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
    .grid-v, .grid-h { position: absolute; background: rgba(255, 255, 255, 0.4); }
    .grid-v { top: 0; bottom: 0; width: 1px; }
    .grid-h { left: 0; right: 0; height: 1px; }
    .grid-svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; stroke: rgba(255,255,255,0.45); stroke-width: 1.5; fill: none; }
    .center-cross { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; }
    .center-cross::before, .center-cross::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.7); }
    .center-cross::before { top: 15px; left: 0; width: 32px; height: 1px; }
    .center-cross::after { top: 0; left: 15px; width: 1px; height: 32px; }

    /* Далекомір */
    #rangefinder {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 70; display: none;
    }
    .stadia-svg { width: 100%; height: 100%; stroke: #ffb642; stroke-width: 2; fill: none; }
    .stadia-label { fill: #ffb642; font-size: 15px; font-weight: bold; font-family: monospace; }

    /* Стелс-оверлей */
    #stealth-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 950; display: none; cursor: pointer;
    }
    #btn-stealth-exit {
      position: absolute; top: 14px; right: 14px;
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.7); padding: 8px 12px; border-radius: 4px; font-size: 11px; cursor: pointer;
    }

    /* Меню налаштувань */
    #settings-modal {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: rgba(15, 15, 15, 0.98); border-top: 1px solid #333;
      padding: 16px; display: none; flex-direction: column; gap: 14px;
      z-index: 900; max-height: 80vh; overflow-y: auto;
    }
    .setting-title { font-size: 11px; color: #888; margin-bottom: 6px; text-transform: uppercase; }
    .setting-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .opt-btn {
      padding: 8px 4px; background: #222; color: #aaa; border: 1px solid #333;
      border-radius: 4px; font-size: 11px; cursor: pointer; text-align: center; font-family: monospace;
    }
    .opt-btn.active { background: #fff; color: #000; font-weight: bold; }
    .slider-container { display: flex; align-items: center; gap: 12px; }
    input[type=range] { flex: 1; accent-color: #ffb642; }
    #close-settings-btn {
      width: 100%; padding: 12px; background: #333; color: #fff; border: none;
      border-radius: 4px; font-size: 13px; cursor: pointer;
    }

    #shutter {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 800; opacity: 0; pointer-events: none; transition: opacity 0.08s;
    }
    #shutter.flash { opacity: 0.9; }
    canvas { display: none; }
  </style>
</head>
<body>
  <div id="viewfinder-box">
    <div id="v-frame">
      <video id="v" autoplay playsinline muted></video>
      <div id="grid"></div>
      <div id="rangefinder">
        <svg class="stadia-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
          <line x1="390" y1="120" x2="430" y2="120" />
          <line x1="390" y1="880" x2="430" y2="880" />
          <text x="320" y="505" class="stadia-label">1.2m</text>
          
          <line x1="440" y1="260" x2="470" y2="260" />
          <line x1="440" y1="740" x2="470" y2="740" />
          <text x="390" y="505" class="stadia-label">2.0m</text>

          <line x1="475" y1="340" x2="495" y2="340" />
          <line x1="475" y1="660" x2="495" y2="660" />
          <text x="515" y="505" class="stadia-label">3.0m</text>
        </svg>
      </div>
    </div>
  </div>

  <div id="shutter"></div>

  <!-- Стелс-оверлей -->
  <div id="stealth-overlay">
    <button id="btn-stealth-exit">✕ EXIT</button>
  </div>

  <button id="btn-start">▶ УВІМКНУТИ КАМЕРУ</button>
  <div id="ver-tag">StreetCam v2.4</div>

  <div id="hud">
    <button class="hud-btn" id="btn-lang">🌐 UA</button>
    <button class="hud-btn" id="btn-snap">📷 СПУСК</button>
    <button class="hud-btn" id="btn-film">🎞️ Tri-X 400</button>
    <button class="hud-btn" id="btn-ratio">📐 3:2</button>
    <button class="hud-btn" id="btn-grid">⊞ Сітка: Вимк</button>
    <button class="hud-btn" id="btn-range">🎯 Далекомір</button>
    <button class="hud-btn" id="btn-stealth">🕶️ Стелс</button>
    <button class="hud-btn" id="btn-settings">⚙️</button>
  </div>

  <!-- Меню налаштувань -->
  <div id="settings-modal">
    <div>
      <div class="setting-title" id="t-lang">МОВА / LANGUAGE</div>
      <div class="setting-grid" id="lang-group">
        <button class="opt-btn active" data-lang="ua">UA Українська</button>
        <button class="opt-btn" data-lang="en">EN English</button>
        <button class="opt-btn" data-lang="ja">JA 日本語</button>
      </div>
    </div>

    <div>
      <div class="setting-title" id="t-ratio">ФОРМАТ КАДРУ (ASPECT RATIO)</div>
      <div class="setting-grid" id="ratio-group" style="grid-template-columns: repeat(4, 1fr);">
        <button class="opt-btn active" data-ratio="0">3:2 (35mm)</button>
        <button class="opt-btn" data-ratio="1">4:3 (645)</button>
        <button class="opt-btn" data-ratio="2">4:5 (Insta)</button>
        <button class="opt-btn" data-ratio="3">1:1 (6x6)</button>
        <button class="opt-btn" data-ratio="4">16:9</button>
        <button class="opt-btn" data-ratio="5" style="grid-column: span 2;">65:24 (XPan)</button>
        <button class="opt-btn" data-ratio="6">Full</button>
      </div>
    </div>

    <div>
      <div class="setting-title" id="t-ev">ЕКСПОКОРЕКЦІЯ (EV)</div>
      <div class="slider-container">
        <input type="range" id="ev-slider" min="-2.0" max="2.0" step="0.1" value="0.0">
        <span id="ev-val" style="min-width: 45px; color: #ffb642;">0.0 EV</span>
      </div>
    </div>

    <div>
      <div class="setting-title" id="t-zone-focus">ЗОННЕ ФОКУСУВАННЯ LEICA</div>
      <div class="setting-grid" id="focus-group" style="grid-template-columns: repeat(4, 1fr);">
        <button class="opt-btn active" data-focus="auto">AF Auto</button>
        <button class="opt-btn" data-focus="0.7">0.7 m</button>
        <button class="opt-btn" data-focus="1.2">1.2 m</button>
        <button class="opt-btn" data-focus="2.0">2.0 m</button>
        <button class="opt-btn" data-focus="3.0">3.0 m</button>
        <button class="opt-btn" data-focus="5.0">5.0 m</button>
        <button class="opt-btn" data-focus="100.0" id="opt-inf" style="grid-column: span 2;">∞ Нескінченність</button>
      </div>
    </div>

    <button id="close-settings-btn">Закрити</button>
  </div>

  <canvas id="c"></canvas>

  <script>
    const v = document.getElementById('v');
    const vFrame = document.getElementById('v-frame');
    const btnStart = document.getElementById('btn-start');
    const hud = document.getElementById('hud');
    const grid = document.getElementById('grid');
    const rangefinder = document.getElementById('rangefinder');
    const shutter = document.getElementById('shutter');
    const canvas = document.getElementById('c');
    const btnLang = document.getElementById('btn-lang');
    const btnSnap = document.getElementById('btn-snap');
    const btnFilm = document.getElementById('btn-film');
    const btnRatio = document.getElementById('btn-ratio');
    const btnGrid = document.getElementById('btn-grid');
    const btnRange = document.getElementById('btn-range');
    const btnStealth = document.getElementById('btn-stealth');
    const btnSettings = document.getElementById('btn-settings');
    const stealthOverlay = document.getElementById('stealth-overlay');
    const btnStealthExit = document.getElementById('btn-stealth-exit');
    const settingsModal = document.getElementById('settings-modal');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const evSlider = document.getElementById('ev-slider');
    const evVal = document.getElementById('ev-val');
    const tLang = document.getElementById('t-lang');
    const tRatio = document.getElementById('t-ratio');
    const tEv = document.getElementById('t-ev');
    const tZoneFocus = document.getElementById('t-zone-focus');
    const optInf = document.getElementById('opt-inf');
    const verTag = document.getElementById('ver-tag');

    let videoTrack = null;
    let isRangeActive = false;
    let currentEV = 0.0;

    const i18n = {
      ua: {
        tag: '🌐 UA',
        startBtn: '▶ УВІМКНУТИ КАМЕРУ',
        snap: '📷 СПУСК',
        range: '🎯 Далекомір',
        stealth: '🕶️ Стелс',
        stealthExit: '✕ ВИЙТИ',
        langTitle: 'МОВА / LANGUAGE',
        ratioTitle: 'ФОРМАТ КАДРУ (ASPECT RATIO)',
        evTitle: 'ЕКСПОКОРЕКЦІЯ (EV)',
        focusTitle: 'ЗОННЕ ФОКУСУВАННЯ LEICA',
        optInf: '∞ Нескінченність',
        closeSettings: 'Закрити',
        grids: {
          'off': '⊞ Сітка: Вимк',
          'thirds': '⊞ Третини',
          'golden': '⊞ Золотий',
          'fibonacci': '⊞ Фібоначчі',
          'diagonals': '⊞ Діагоналі',
          'center': '⊞ Центр'
        }
      },
      en: {
        tag: '🌐 EN',
        startBtn: '▶ START CAMERA',
        snap: '📷 SNAP',
        range: '🎯 Rangefinder',
        stealth: '🕶️ Stealth',
        stealthExit: '✕ EXIT',
        langTitle: 'LANGUAGE',
        ratioTitle: 'ASPECT RATIO',
        evTitle: 'EXPOSURE (EV)',
        focusTitle: 'LEICA ZONE FOCUS',
        optInf: '∞ Infinity',
        closeSettings: 'Close',
        grids: {
          'off': '⊞ Grid: Off',
          'thirds': '⊞ Thirds',
          'golden': '⊞ Golden',
          'fibonacci': '⊞ Fibonacci',
          'diagonals': '⊞ Diagonals',
          'center': '⊞ Center'
        }
      },
      ja: {
        tag: '🌐 日本語',
        startBtn: '▶ カメラを起動',
        snap: '📷 シャッター',
        range: '🎯 距離計',
        stealth: '🕶️ ステルス',
        stealthExit: '✕ 終了',
        langTitle: '言語設定',
        ratioTitle: 'アスペクト比',
        evTitle: '露出補正 (EV)',
        focusTitle: 'ゾーンフォーカス',
        optInf: '∞ 無限遠',
        closeSettings: '閉じる',
        grids: {
          'off': '⊞ グリッド: 切',
          'thirds': '⊞ 三分割',
          'golden': '⊞ 黄金比',
          'fibonacci': '⊞ フィボナッチ',
          'diagonals': '⊞ 対角線',
          'center': '⊞ 中央クロス'
        }
      }
    };

    const langKeys = ['ua', 'en', 'ja'];
    let langIdx = 0;

    const films = [
      { name: 'Tri-X 400', isBW: true, contrast: 1.55 },
      { name: 'HP5 Plus', isBW: true, contrast: 1.25 },
      { name: 'T-Max 3200', isBW: true, contrast: 1.90 },
      { name: 'Neopan 100', isBW: true, contrast: 1.35 },
      { name: 'Portra 400', isBW: false, filter: 'saturate(85%) contrast(110%) sepia(10%)' },
      { name: 'Cinestill 800T', isBW: false, filter: 'saturate(115%) contrast(130%) hue-rotate(190deg) sepia(15%)' }
    ];
    let filmIdx = 0;

    const ratios = [
      { name: '3:2', p: 2 / 3, l: 3 / 2 },
      { name: '4:3', p: 3 / 4, l: 4 / 3 },
      { name: '4:5', p: 4 / 5, l: 5 / 4 },
      { name: '1:1', p: 1.0, l: 1.0 },
      { name: '16:9', p: 9 / 16, l: 16 / 9 },
      { name: '65:24', p: 24 / 65, l: 65 / 24 },
      { name: 'Full', p: null, l: null }
    ];
    let ratioIdx = 0;

    const grids = ['off', 'thirds', 'golden', 'fibonacci', 'diagonals', 'center'];
    let gridIdx = 0;

    function applyLanguage() {
      const dict = i18n[langKeys[langIdx]];
      btnLang.textContent = dict.tag;
      btnSnap.textContent = dict.snap;
      btnRange.textContent = dict.range;
      btnStealth.textContent = dict.stealth;
      btnStealthExit.textContent = dict.stealthExit;

      tLang.textContent = dict.langTitle;
      tRatio.textContent = dict.ratioTitle;
      tEv.textContent = dict.evTitle;
      tZoneFocus.textContent = dict.focusTitle;
      optInf.textContent = dict.optInf;
      closeSettingsBtn.textContent = dict.closeSettings;

      document.querySelectorAll('#lang-group .opt-btn').forEach((b, idx) => {
        b.classList.toggle('active', idx === langIdx);
      });
      renderGrid();
    }

    function applyFilmFilter() {
      const preset = films[filmIdx];
      const brightnessFactor = Math.pow(2, currentEV);
      if (preset.isBW) {
        v.style.filter = 'grayscale(100%) contrast(' + (preset.contrast * 100) + '%) brightness(' + (brightnessFactor * 100) + '%)';
      } else {
        v.style.filter = preset.filter + ' brightness(' + (brightnessFactor * 100) + '%)';
      }
    }

    function applyRatioFrame() {
      const r = ratios[ratioIdx];
      btnRatio.textContent = '📐 ' + r.name;
      document.querySelectorAll('#ratio-group .opt-btn').forEach((b, idx) => {
        b.classList.toggle('active', idx === ratioIdx);
      });

      if (!r.p) {
        vFrame.style.width = '100vw';
        vFrame.style.height = '100vh';
        return;
      }
      const isPortrait = window.innerHeight >= window.innerWidth;
      const targetRatio = isPortrait ? r.p : r.l;
      const screenRatio = window.innerWidth / window.innerHeight;

      if (screenRatio > targetRatio) {
        vFrame.style.height = '100vh';
        vFrame.style.width = Math.round(window.innerHeight * targetRatio) + 'px';
      } else {
        vFrame.style.width = '100vw';
        vFrame.style.height = Math.round(window.innerWidth / targetRatio) + 'px';
      }
    }

    function renderGrid() {
      const mode = grids[gridIdx];
      btnGrid.textContent = i18n[langKeys[langIdx]].grids[mode];
      grid.innerHTML = '';
      if (mode === 'thirds') {
        grid.innerHTML = '<div class="grid-v" style="left:33.33%;"></div><div class="grid-v" style="left:66.66%;"></div><div class="grid-h" style="top:33.33%;"></div><div class="grid-h" style="top:66.66%;"></div>';
      } else if (mode === 'golden') {
        grid.innerHTML = '<div class="grid-v" style="left:38.2%;"></div><div class="grid-v" style="left:61.8%;"></div><div class="grid-h" style="top:38.2%;"></div><div class="grid-h" style="top:61.8%;"></div>';
      } else if (mode === 'fibonacci') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 618" preserveAspectRatio="none"><path d="M 0,618 A 618,618 0 0,1 618,0 A 382,382 0 0,1 1000,382 A 236,236 0 0,1 764,618 A 146,146 0 0,1 618,472 A 90,90 0 0,1 708,382 A 56,56 0 0,1 764,438 A 34,34 0 0,1 730,472" /><line x1="618" y1="0" x2="618" y2="618" stroke="rgba(255,255,255,0.3)" /><line x1="618" y1="382" x2="1000" y2="382" stroke="rgba(255,255,255,0.3)" /><line x1="764" y1="382" x2="764" y2="618" stroke="rgba(255,255,255,0.3)" /></svg>';
      } else if (mode === 'diagonals') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><line x1="0" y1="0" x2="1000" y2="1000" stroke="rgba(255,255,255,0.45)" /><line x1="1000" y1="0" x2="0" y2="1000" stroke="rgba(255,255,255,0.45)" /><line x1="0" y1="500" x2="500" y2="0" stroke="rgba(255,255,255,0.25)" /><line x1="500" y1="1000" x2="1000" y2="500" stroke="rgba(255,255,255,0.25)" /></svg>';
      } else if (mode === 'center') {
        grid.innerHTML = '<div class="center-cross"></div><div class="grid-v" style="left:50%;"></div><div class="grid-h" style="top:50%;"></div>';
      }
    }

    async function initCamera() {
      btnStart.textContent = "⏳ ПІДКЛЮЧЕННЯ...";
      try {
        let stream = null;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: "environment" } },
            audio: false
          });
        } catch (e1) {
          // Якщо environment недоступний, пробуємо звичайний запит відео
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
        }

        v.srcObject = stream;
        await v.play();
        videoTrack = stream.getVideoTracks()[0];

        btnStart.style.display = 'none';
        verTag.style.display = 'none';
        hud.style.display = 'flex';
        applyLanguage();
        applyFilmFilter();
        applyRatioFrame();
      } catch (err) {
        btnStart.innerHTML = "⚠️ ПОМИЛКА ДОСТУПУ<br><small style='font-size:11px;'>" + err.name + ": перевірте дозвіл камери у Brave</small>";
      }
    }

    function takePhoto(isSilent = false) {
      if (settingsModal.style.display === 'flex') return;
      if (!isSilent) {
        shutter.classList.add('flash');
        setTimeout(() => shutter.classList.remove('flash'), 100);
      }
      if (navigator.vibrate) navigator.vibrate(isSilent ? 35 : 30);

      const rawW = v.videoWidth || 1920;
      const rawH = v.videoHeight || 1080;
      const r = ratios[ratioIdx];
      let cropW = rawW, cropH = rawH, cropX = 0, cropY = 0;

      if (r.p) {
        const isVideoPortrait = rawH > rawW;
        const targetRatio = isVideoPortrait ? r.p : r.l;
        const currentRatio = rawW / rawH;
        if (currentRatio > targetRatio) {
          cropH = rawH; cropW = rawH * targetRatio; cropX = (rawW - cropW) / 2;
        } else {
          cropW = rawW; cropH = rawW / targetRatio; cropY = (rawH - cropH) / 2;
        }
      }

      canvas.width = Math.round(cropW);
      canvas.height = Math.round(cropH);
      const ctx = canvas.getContext('2d');
      const preset = films[filmIdx];
      const evFactor = Math.pow(2, currentEV);

      if (preset.isBW) {
        ctx.filter = 'none';
        ctx.drawImage(v, cropX, cropY, cropW, cropH, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const d = imgData.data;
        const contrast = preset.contrast;

        for (let i = 0; i < d.length; i += 4) {
          let y = 0.299 * (d[i] * evFactor) + 0.587 * (d[i+1] * evFactor) + 0.114 * (d[i+2] * evFactor);
          y = Math.min(255, Math.max(0, ((y / 255 -
