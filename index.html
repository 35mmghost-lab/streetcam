<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #000; color: #fff; font-family: monospace; overflow: hidden; }
    #viewfinder-box { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
    video { width: 100%; height: 100%; object-fit: cover; }
    
    #btn-start {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 1000; padding: 20px 32px; font-size: 16px; font-weight: bold;
      background: #ffb642; border: 2px solid #fff; border-radius: 10px; color: #000; cursor: pointer;
    }
    
    #hud {
      position: fixed; top: 12px; left: 0; width: 100%; display: none;
      justify-content: space-around; align-items: center; padding: 6px 4px;
      z-index: 500; background: rgba(0, 0, 0, 0.75);
    }
    .hud-btn {
      background: transparent; border: 1px solid rgba(255, 255, 255, 0.4);
      color: #eee; padding: 6px 8px; border-radius: 4px; font-size: 11px; cursor: pointer;
    }
    #shutter {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 800; opacity: 0; pointer-events: none; transition: opacity 0.08s;
    }
    #shutter.flash { opacity: 0.9; }
    canvas { display: none; }
  </style>
</head>
<body>
  <div id="viewfinder-box">
    <video id="v" autoplay playsinline muted></video>
  </div>

  <div id="shutter"></div>
  <button id="btn-start" onclick="startApp()">▶ УВІМКНУТИ КАМЕРУ</button>

  <div id="hud">
    <button class="hud-btn" id="btn-snap" onclick="takePhoto()">📷 СПУСК</button>
    <button class="hud-btn" id="btn-film" onclick="nextFilm()">🎞️ Tri-X 400</button>
  </div>

  <canvas id="c"></canvas>

  <script>
    const v = document.getElementById('v');
    const btnStart = document.getElementById('btn-start');
    const hud = document.getElementById('hud');
    const shutter = document.getElementById('shutter');
    const canvas = document.getElementById('c');
    const btnFilm = document.getElementById('btn-film');

    const films = [
      { name: 'Tri-X 400', contrast: 1.55 },
      { name: 'HP5 Plus', contrast: 1.25 },
      { name: 'T-Max 3200', contrast: 1.90 },
      { name: 'Neopan 100', contrast: 1.35 }
    ];
    let filmIdx = 0;

    async function startApp() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        v.srcObject = stream;
        btnStart.style.display = 'none';
        hud.style.display = 'flex';
        applyFilmFilter();
      } catch (err) {
        alert("Помилка камери: " + err.message);
      }
    }

    function applyFilmFilter() {
      v.style.filter = 'grayscale(100%) contrast(' + (films[filmIdx].contrast * 100) + '%)';
    }

    function nextFilm() {
      filmIdx = (filmIdx + 1) % films.length;
      btnFilm.textContent = '🎞️ ' + films[filmIdx].name;
      applyFilmFilter();
    }

    function takePhoto() {
      shutter.classList.add('flash');
      setTimeout(() => shutter.classList.remove('flash'), 100);
      if (navigator.vibrate) navigator.vibrate(30);

      const w = v.videoWidth || 1920;
      const h = v.videoHeight || 1080;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(v, 0, 0, w, h);

      const imgData = ctx.getImageData(0, 0, w, h);
      const d = imgData.data;
      const contrast = films[filmIdx].contrast;

      for (let i = 0; i < d.length; i += 4) {
        let y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        y = ((y / 255 - 0.5) * contrast + 0.5) * 255;
        y = Math.min(255, Math.max(0, y));
        d[i] = y; d[i + 1] = y; d[i + 2] = y;
      }
      ctx.putImageData(imgData, 0, 0);

      canvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'STREET_' + films[filmIdx].name.replace(/\s+/g, '') + '_' + Date.now() + '.jpg';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      }, 'image/jpeg', 0.95);
    }
  </script>
</body>
</html>
