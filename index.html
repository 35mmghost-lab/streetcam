<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    #viewfinder-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    #grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .grid-line-v, .grid-line-h {
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.8);
    }
    .grid-line-v { top: 0; bottom: 0; width: 1px; }
    .grid-line-h { left: 0; right: 0; height: 1px; }

    .grid-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      stroke: rgba(255, 255, 255, 0.5);
      stroke-width: 1.5;
      fill: none;
      filter: drop-shadow(0 0 1px rgba(0,0,0,0.9));
    }

    .center-cross {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
    }
    .center-cross::before, .center-cross::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.9);
    }
    .center-cross::before { top: 15px; left: 0; width: 32px; height: 1px; }
    .center-cross::after { top: 0; left: 15px; width: 1px; height: 32px; }

    #spirit-level {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 20px;
      pointer-events: none;
      z-index: 7;
      display: none;
      align-items: center;
      justify-content: center;
    }
    .level-line {
      width: 100%;
      height: 2px;
      background-color: #ffb642;
      box-shadow: 0 0 2px #000, 0 0 8px rgba(255, 182, 66, 0.9);
      transition: transform 0.04s ease-out, box-shadow 0.15s ease, height 0.15s ease, background-color 0.15s ease;
      transform-origin: center center;
    }
    .level-line.aligned {
      height: 3px;
      background-color: #ffe082;
      box-shadow: 0 0 3px #000, 0 0 16px #ffb642, 0 0 24px rgba(255, 182, 66, 0.95);
    }

    #rangefinder-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 8;
      display: none;
    }
    .rangefinder-hud-val {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid #ffb642;
      color: #ffb642;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-family: monospace;
      letter-spacing: 1px;
      text-shadow: 0 0 4px rgba(255, 182, 66, 0.8);
    }
    .stadiametric-svg {
      width: 100%;
      height: 100%;
      stroke: #ffb642;
      stroke-width: 1.5;
      fill: none;
      filter: drop-shadow(0 0 2px #000);
    }
    .stadia-text {
      fill: #ffb642;
      font-size: 10px;
      font-family: monospace;
      text-shadow: 0 0 2px #000;
    }

    #iris-shutter {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
    }
    .iris-blade-container {
      width: 140vmax;
      height: 140vmax;
      border-radius: 50%;
      background: radial-gradient(circle, transparent 18%, rgba(12,12,12,0.98) 22%);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
      transform: scale(2.8);
    }
    .iris-anim {
      animation: irisMech 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes irisMech {
      0% { opacity: 0; transform: scale(2.8) rotate(0deg); }
      20% { opacity: 1; }
      50% { opacity: 1; transform: scale(0.28) rotate(60deg); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: scale(2.8) rotate(120deg); }
    }

    #top-hud {
      position: absolute;
      top: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 8px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }
    .hud-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #eee;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .hud-btn.active {
      background: rgba(255, 182, 66, 0.25);
      border-color: #ffb642;
      color: #ffb642;
    }

    #settings-modal {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(12, 12, 12, 0.96);
      border-top: 1px solid #333;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 30;
      max-height: 80vh;
      overflow-y: auto;
    }
    .setting-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 6px;
    }
    .setting-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }
    .opt-btn {
      padding: 8px 4px;
      background: #1e1e1e;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      font-family: monospace;
    }
    .opt-btn.active {
      background: #fff;
      color: #000;
      font-weight: bold;
      border-color: #fff;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }
    input[type=range] {
      flex: 1;
      accent-color: #fff;
      height: 4px;
    }
    .slider-val {
      font-size: 12px;
      font-family: monospace;
      min-width: 45px;
      text-align: right;
    }
    #close-settings-btn {
      width: 100%;
      padding: 11px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      margin-top: 4px;
      cursor: pointer;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="viewfinder-container">
      <video id="camera-stream" autoplay playsinline muted></video>
      <div id="grid-overlay"></div>
      
      <div id="spirit-level">
        <div class="level-line"></div>
      </div>

      <div id="rangefinder-overlay">
        <div class="rangefinder-hud-val" id="rangefinder-text">DIST: -- m (H: 1.6m)</div>
        <svg class="stadiametric-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
          <line x1="420" y1="120" x2="440" y2="120" />
          <line x1="420" y1="880" x2="440" y2="880" />
          <text x="385" y="505" class="stadia-text">1.2m</text>
          
          <line x1="460" y1="260" x2="475" y2="260" />
          <line x1="460" y1="740" x2="475" y2="740" />
          <text x="430" y="505" class="stadia-text">2.0m</text>

          <line x1="485" y1="340" x2="495" y2="340" />
          <line x1="485" y1="660" x2="495" y2="660" />
          <text x="510" y="505" class="stadia-text">3.0m</text>
        </svg>
      </div>
      
      <div id="iris-shutter">
        <div class="iris-blade-container"></div>
      </div>
    </div>

    <div id="top-hud">
      <button class="hud-btn" id="shutter-hud-btn">📷 SNAP</button>
      <button class="hud-btn" id="level-btn">🧭 Рівень</button>
      <button class="hud-btn" id="range-btn">🎯 Далекомір</button>
      <button class="hud-btn" id="lens-btn">🔍 1.0x</button>
      <button class="hud-btn" id="grid-btn">🌐 Третини</button>
      <button class="hud-btn" id="film-btn">🎞️ Tri-X 400</button>
      <button class="hud-btn" id="open-settings-btn">⚙️</button>
    </div>

    <div id="settings-modal">
      <div>
        <div class="setting-title">Висота точки зйомки далекоміра</div>
        <div class="setting-grid" style="grid-template-columns: repeat(2, 1fr);" id="height-group">
          <button class="opt-btn active" data-h="1.6">👁️ Рівень очей (1.60 м)</button>
          <button class="opt-btn" data-h="1.3">🥋 Рівень пояса (1.30 м)</button>
        </div>
      </div>

      <div>
        <div class="setting-title">Тактильний відгук горизонту (Вібрація)</div>
        <div class="setting-grid" style="grid-template-columns: repeat(2, 1fr);" id="haptic-group">
          <button class="opt-btn active" data-haptic="on">📳 Увімк</button>
          <button class="opt-btn" data-haptic="off">🔕 Вимк</button>
        </div>
      </div>

      <div>
        <div class="setting-title">Експокорекція (EV)</div>
        <div class="slider-container">
          <input type="range" id="ev-slider" min="-2.0" max="2.0" step="0.1" value="0.0">
          <span class="slider-val" id="ev-val">0.0 EV</span>
        </div>
      </div>

      <div>
        <div class="setting-title">Фокусна відстань (Leica Zone Focus)</div>
        <div class="setting-grid" id="focus-group">
          <button class="opt-btn active" data-dist="auto">AF Auto</button>
          <button class="opt-btn" data-dist="0.7">0.7 m</button>
          <button class="opt-btn" data-dist="1.0">1.0 m</button>
          <button class="opt-btn" data-dist="1.2">1.2 m</button>
          <button class="opt-btn" data-dist="1.5">1.5 m</button>
          <button class="opt-btn" data-dist="2.0">2.0 m</button>
          <button class="opt-btn" data-dist="3.0">3.0 m</button>
          <button class="opt-btn" data-dist="5.0">5.0 m</button>
          <button class="opt-btn" data-dist="100.0" style="grid-column: span 4;">∞ Нескінченність</button>
        </div>
      </div>

      <div>
        <div class="setting-title">Світлочутливість (ISO)</div>
        <div class="setting-grid" id="iso-group">
          <button class="opt-btn active" data-val="auto">Auto</button>
          <button class="opt-btn" data-val="400">400</button>
          <button class="opt-btn" data-val="800">800</button>
          <button class="opt-btn" data-val="1600">1600</button>
        </div>
      </div>

      <button id="close-settings-btn">Закрити налаштування</button>
    </div>
  </div>

  <canvas id="capture-canvas"></canvas>

  <script>
    const video = document.getElementById('camera-stream');
    const irisShutter = document.getElementById('iris-shutter');
    const canvas = document.getElementById('capture-canvas');
    const settingsModal = document.getElementById('settings-modal');
    const evSlider = document.getElementById('ev-slider');
    const evVal = document.getElementById('ev-val');
    const gridOverlay = document.getElementById('grid-overlay');
    const gridBtn = document.getElementById('grid-btn');
    const filmBtn = document.getElementById('film-btn');
    const lensBtn = document.getElementById('lens-btn');
    const levelBtn = document.getElementById('level-btn');
    const rangeBtn = document.getElementById('range-btn');
    const spiritLevel = document.getElementById('spirit-level');
    const rangefinderOverlay = document.getElementById('rangefinder-overlay');
    const rangefinderText = document.getElementById('rangefinder-text');
    const levelLine = document.querySelector('.level-line');
    const shutterHudBtn = document.getElementById('shutter-hud-btn');

    let videoTrack = null;
    let currentStream = null;
    let currentEV = 0.0;
    let isLevelActive = false;
    let isRangeActive = false;
    let hapticsEnabled = true;
    let wasAligned = false;
    let cameraHeight = 1.6;

    const filmPresets = [
      { name: 'Tri-X 400', isBW: true, contrast: 1.55, grain: 14 },
      { name: 'HP5 Plus', isBW: true, contrast: 1.25, grain: 9 },
      { name: 'T-Max 3200', isBW: true, contrast: 1.85, grain: 24 },
      { name: 'Neopan 100', isBW: true, contrast: 1.35, grain: 5 },
      { name: 'Portra 400', isBW: false, filter: 'saturate(85%) contrast(110%) sepia(10%)', grain: 10 },
      { name: 'Cinestill 800T', isBW: false, filter: 'saturate(115%) contrast(130%) hue-rotate(190deg) sepia(15%)', grain: 16 }
    ];
    let currentFilmIdx = 0;

    const zoomLevels = [
      { label: '🔍 1.0x', zoom: 1.0 },
      { label: '🔍 2.0x', zoom: 2.0 },
      { label: '🔍 3.0x', zoom: 3.0 },
      { label: '🔍 0.5x', zoom: 0.5 }
    ];
    let currentZoomIdx = 0;

    const gridModes = ['thirds', 'golden', 'fibonacci', 'diagonals', 'center', 'off'];
    const gridLabels = {
      'thirds': '🌐 Третини',
      'golden': '🌐 Золотий перетин',
      'fibonacci': '🌐 Спіраль Фібоначчі',
      'diagonals': '🌐 Діагоналі',
      'center': '🌐 Центр',
      'off': '🌐 Сітка: Вимк'
    };
    let currentGridIdx = 0;

    function renderGrid() {
      const mode = gridModes[currentGridIdx];
      gridBtn.textContent = gridLabels[mode];
      gridOverlay.innerHTML = '';

      if (mode === 'thirds') {
        gridOverlay.innerHTML = `
          <div class="grid-line-v" style="left: 33.33%;"></div>
          <div class="grid-line-v" style="left: 66.66%;"></div>
          <div class="grid-line-h" style="top: 33.33%;"></div>
          <div class="grid-line-h" style="top: 66.66%;"></div>
        `;
      } else if (mode === 'golden') {
        gridOverlay.innerHTML = `
          <div class="grid-line-v" style="left: 38.2%;"></div>
          <div class="grid-line-v" style="left: 61.8%;"></div>
          <div class="grid-line-h" style="top: 38.2%;"></div>
          <div class="grid-line-h" style="top: 61.8%;"></div>
        `;
      } else if (mode === 'fibonacci') {
        gridOverlay.innerHTML = `
          <svg class="grid-svg" viewBox="0 0 1000 618" preserveAspectRatio="none">
            <line x1="618" y1="0" x2="618" y2="618" stroke="rgba(255,255,255,0.25)" />
            <line x1="618" y1="382" x2="1000" y2="382" stroke="rgba(255,255,255,0.25)" />
            <line x1="764" y1="382" x2="764" y2="618" stroke="rgba(255,255,255,0.25)" />
            <line x1="618" y1="472" x2="764" y2="472" stroke="rgba(255,255,255,0.25)" />
            <path d="M 0,618 A 618,618 0 0,1 618,0 A 382,382 0 0,1 1000,382 A 236,236 0 0,1 764,618 A 146,146 0 0,1 618,472 A 90,90 0 0,1 708,382 A 56,56 0 0,1 764,438 A 34,34 0 0,1 730,472" />
          </svg>
        `;
      } else if (mode === 'diagonals') {
        gridOverlay.innerHTML = `
          <svg class="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <line x1="0" y1="0" x2="1000" y2="1000" />
            <line x1="1000" y1="0" x2="0" y2="1000" />
            <line x1="0" y1="500" x2="500" y2="0" stroke="rgba(255,255,255,0.25)" />
            <line x1="500" y1="1000" x2="1000" y2="500" stroke="rgba(255,255,255,0.25)" />
            <line x1="0" y1="500" x2="500" y2="1000" stroke="rgba(255,255,255,0.25)" />
            <line x1="500" y1="0" x2="1000" y2="500" stroke="rgba(255,255,255,0.25)" />
          </svg>
        `;
      } else if (mode === 'center') {
        gridOverlay.innerHTML = `
          <div class="center-cross"></div>
          <div class="grid-line-h" style="top: 50%;"></div>
          <div class="grid-line-v" style="left: 50%;"></div>
        `;
      }
    }

    function handleOrientation(event) {
      const isLandscape = window.innerWidth > window.innerHeight;
      const roll = isLandscape ? (event.beta || 0) : (event.gamma || 0);
      const pitch = isLandscape ? (event.gamma || 0) : (event.beta || 0);

      if (isLevelActive) {
        levelLine.style.transform = `rotate(${roll}deg)`;
        const isAligned = Math.abs(roll) <= 0.5;
        if (isAligned) {
          levelLine.classList.add('aligned');
          if (!wasAligned && hapticsEnabled && navigator.vibrate) {
            navigator.vibrate(20);
          }
          wasAligned = true;
        } else {
          levelLine.classList.remove('aligned');
          wasAligned = false;
        }
      }

      if (isRangeActive) {
        const declination = Math.max(1, 90 - Math.abs(pitch));
        const rad = declination * (Math.PI / 180);
        let dist = cameraHeight / Math.tan(rad);
        dist = Math.min(Math.max(dist, 0.5), 50.0);
        rangefinderText.textContent = `DIST: ${dist.toFixed(1)} m (H: ${cameraHeight.toFixed(2)}m)`;
      }
    }

    function checkSensorPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          }
        }).catch(console.error);
      } else {
        window.addEventListener('deviceorientation', handleOrientation, true);
      }
    }

    levelBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isLevelActive = !isLevelActive;
      spiritLevel.style.display = isLevelActive ? 'flex' : 'none';
      levelBtn.classList.toggle('active', isLevelActive);
      checkSensorPermission();
    });

    rangeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      isRangeActive = !isRangeActive;
      rangefinderOverlay.style.display = isRangeActive ? 'block' : 'none';
      rangeBtn.classList.toggle('active', isRangeActive);
      checkSensorPermission();
    });

    document.querySelectorAll('#height-group .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#height-group .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        cameraHeight = parseFloat(btn.getAttribute('data-h'));
      });
    });

    document.querySelectorAll('#haptic-group .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#haptic-group .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        hapticsEnabled = btn.getAttribute('data-haptic') === 'on';
      });
    });

    async function initCamera() {
      try {
        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
        }

        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 3840 },
            height: { ideal: 2160 }
          },
          audio: false
        });

        currentStream = stream;
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        await video.play();
        updateFilters();
        renderGrid();
      } catch (err) {
        console.error('Помилка камери:', err);
      }
    }

    function getCombinedFilter() {
      const brightnessFactor = Math.pow(2, currentEV);
      const preset = filmPresets[currentFilmIdx];
      if (preset.isBW) {
        return `grayscale(100%) contrast(${preset.contrast * 100}%) brightness(${brightnessFactor * 100}%)`;
      } else {
        return `
