<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Відео видошукача */
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: grayscale(100%) contrast(150%);
    }

    /* Стартова кнопка */
    #btn-start {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      padding: 20px 40px;
      font-size: 16px;
      font-weight: bold;
      background: #ffb642;
      border: 2px solid #fff;
      border-radius: 10px;
      color: #000;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 182, 66, 0.9);
    }

    /* Верхня панель інструментів */
    #hud {
      position: fixed;
      top: 12px;
      left: 0;
      width: 100%;
      display: none;
      justify-content: space-around;
      align-items: center;
      padding: 6px 8px;
      z-index: 500;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
    }
    .hud-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #eee;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
    .hud-btn.active {
      background: rgba(255, 182, 66, 0.3);
      border-color: #ffb642;
      color: #ffb642;
    }

    /* Сітки */
    #grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }
    .grid-v, .grid-h {
      position: absolute;
      background: rgba(255, 255, 255, 0.35);
    }
    .grid-v { top: 0; bottom: 0; width: 1px; }
    .grid-h { left: 0; right: 0; height: 1px; }

    /* Рівень горизонту */
    #level {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 20px;
      pointer-events: none;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #level-line {
      width: 100%;
      height: 2px;
      background: #ffb642;
      box-shadow: 0 0 8px rgba(255, 182, 66, 0.9);
      transform-origin: center center;
    }
    #level-line.aligned {
      height: 3px;
      background: #ffe082;
      box-shadow: 0 0 16px rgba(255, 182, 66, 1);
    }

    /* Механічний затвор */
    #shutter {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease-out;
    }
    #shutter.flash {
      opacity: 0.9;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  <div id="grid"></div>
  <div id="level"><div id="level-line"></div></div>
  <div id="shutter"></div>

  <button id="btn-start">▶ УВІМКНУТИ КАМЕРУ</button>

  <div id="hud">
    <button class="hud-btn" id="btn-snap">📷 SNAP</button>
    <button class="hud-btn" id="btn-film">🎞️ Tri-X 400</button>
    <button class="hud-btn" id="btn-grid">🌐 Третини</button>
    <button class="hud-btn" id="btn-level">🧭 Рівень</button>
  </div>

  <canvas id="c"></canvas>

  <script>
    const v = document.getElementById('v');
    const btnStart = document.getElementById('btn-start');
    const hud = document.getElementById('hud');
    const grid = document.getElementById('grid');
    const level = document.getElementById('level');
    const levelLine = document.getElementById('level-line');
    const shutter = document.getElementById('shutter');
    const canvas = document.getElementById('c');

    const btnSnap = document.getElementById('btn-snap');
    const btnFilm = document.getElementById('btn-film');
    const btnGrid = document.getElementById('btn-grid');
    const btnLevel = document.getElementById('btn-level');

    let isLevelActive = false;

    const films = [
      { name: 'Tri-X 400', isBW: true, filter: 'grayscale(100%) contrast(155%)' },
      { name: 'HP5 Plus', isBW: true, filter: 'grayscale(100%) contrast(125%)' },
      { name: 'T-Max 3200', isBW: true, filter: 'grayscale(100%) contrast(190%)' },
      { name: 'Portra 400', isBW: false, filter: 'saturate(85%) contrast(110%) sepia(10%)' }
    ];
    let filmIdx = 0;

    const grids = ['thirds', 'center', 'off'];
    const gridNames = { 'thirds': '🌐 Третини', 'center': '🌐 Центр', 'off': '🌐 Сітка: Вимк' };
    let gridIdx = 0;

    // 1. ЗАПУСК КАМЕРИ
    btnStart.addEventListener('click', () => {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      }).then(stream => {
        v.srcObject = stream;
        v.play();
        btnStart.style.display = 'none';
        hud.style.display = 'flex';
        renderGrid();
        initOrientation();
      }).catch(err => {
        alert("Помилка камери: " + err.message);
      });
    });

    // 2. ЗМІНА ПЛІВКИ
    btnFilm.addEventListener('click', (e) => {
      e.stopPropagation();
      filmIdx = (filmIdx + 1) % films.length;
      btnFilm.textContent = '🎞️ ' + films[filmIdx].name;
      v.style.filter = films[filmIdx].filter;
    });

    // 3. СІТКИ
    function renderGrid() {
      const mode = grids[gridIdx];
      btnGrid.textContent = gridNames[mode];
      grid.innerHTML = '';
      if (mode === 'thirds') {
        grid.innerHTML = '<div class="grid-v" style="left:33.33%;"></div><div class="grid-v" style="left:66.66%;"></div><div class="grid-h" style="top:33.33%;"></div><div class="grid-h" style="top:66.66%;"></div>';
      } else if (mode === 'center') {
        grid.innerHTML = '<div class="grid-v" style="left:50%;"></div><div class="grid-h" style="top:50%;"></div>';
      }
    }
    btnGrid.addEventListener('click', (e) => {
      e.stopPropagation();
      gridIdx = (gridIdx + 1) % grids.length;
      renderGrid();
    });

    // 4. РІВЕНЬ ГОРИЗОНТУ
    btnLevel.addEventListener('click', (e) => {
      e.stopPropagation();
      isLevelActive = !isLevelActive;
      level.style.display = isLevelActive ? 'flex' : 'none';
      btnLevel.classList.toggle('active', isLevelActive);
    });

    function initOrientation() {
      window.addEventListener('deviceorientation', (e) => {
        if (!isLevelActive) return;
        const roll = window.innerWidth > window.innerHeight ? (e.beta || 0) : (e.gamma || 0);
        levelLine.style.transform = 'rotate(' + roll + 'deg)';
        if (Math.abs(roll) <= 0.6) {
          levelLine.classList.add('aligned');
          if (navigator.vibrate) navigator.vibrate(15);
        } else {
          levelLine.classList.remove('aligned');
        }
      }, true);
    }

    // 5. ЗЙОМКА (SNAP)
    function capturePhoto() {
      // Анімація затвора
      shutter.classList.add('flash');
      setTimeout(() => shutter.classList.remove('flash'), 100);
      if (navigator.vibrate) navigator.vibrate([30, 20, 30]);

      const w = v.videoWidth || 1920;
      const h = v.videoHeight || 1080;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(v, 0, 0, w, h);

      // Застосування чорно-білого профілю
      if (films[filmIdx].isBW) {
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          let y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          y = ((y / 255 - 0.5) * 1.45 + 0.5) * 255;
          y = Math.min(255, Math.max(0, y));
          d[i] = y; d[i + 1] = y; d[i + 2] = y;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      // Збереження
      canvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'STREET_' + films[filmIdx].name.replace(/\s+/g, '') + '_' + Date.now() + '.jpg';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      }, 'image/jpeg', 0.95);
    }

    btnSnap.addEventListener('click', (e) => {
      e.stopPropagation();
      capturePhoto();
    });

    v.addEventListener('click', capturePhoto);
  </script>
</body>
</html>
