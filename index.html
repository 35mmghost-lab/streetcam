<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    #viewfinder-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: filter 0.1s ease;
      z-index: 1;
    }

    /* Шар сіток */
    #grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .grid-line-v, .grid-line-h {
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.8);
    }
    .grid-line-v { top: 0; bottom: 0; width: 1px; }
    .grid-line-h { left: 0; right: 0; height: 1px; }

    /* SVG для Спіралі та Діагоналей */
    .grid-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      stroke: rgba(255, 255, 255, 0.5);
      stroke-width: 1.5;
      fill: none;
      filter: drop-shadow(0 0 1px rgba(0,0,0,0.9));
    }

    /* Центральне перехрестя */
    .center-cross {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
    }
    .center-cross::before, .center-cross::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.9);
    }
    .center-cross::before { top: 15px; left: 0; width: 32px; height: 1px; }
    .center-cross::after { top: 0; left: 15px; width: 1px; height: 32px; }

    /* Ірисова діафрагма */
    #iris-shutter {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
    }
    .iris-mask {
      width: 100vmax;
      height: 100vmax;
      background: radial-gradient(circle, transparent 20%, rgba(10,10,10,0.98) 22%);
      transform: scale(3.5);
    }
    .iris-anim {
      animation: irisAction 0.18s cubic-bezier(0.25, 1, 0.5, 1);
    }
    @keyframes irisAction {
      0% {
        opacity: 1;
        transform: scale(3.5) rotate(0deg);
      }
      45% {
        opacity: 1;
        transform: scale(0.18) rotate(45deg);
      }
      100% {
        opacity: 0;
        transform: scale(3.5) rotate(90deg);
      }
    }

    /* Верхній HUD */
    #top-hud {
      position: absolute;
      top: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 12px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }
    .hud-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #eee;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .hud-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Меню налаштувань */
    #settings-modal {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(12, 12, 12, 0.96);
      border-top: 1px solid #333;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 30;
      max-height: 80vh;
      overflow-y: auto;
    }
    .setting-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 6px;
    }
    .setting-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }
    .opt-btn {
      padding: 8px 4px;
      background: #1e1e1e;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      font-family: monospace;
    }
    .opt-btn.active {
      background: #fff;
      color: #000;
      font-weight: bold;
      border-color: #fff;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }
    input[type=range] {
      flex: 1;
      accent-color: #fff;
      height: 4px;
    }
    .slider-val {
      font-size: 12px;
      font-family: monospace;
      min-width: 45px;
      text-align: right;
    }
    #close-settings-btn {
      width: 100%;
      padding: 11px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      margin-top: 4px;
      cursor: pointer;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body tabindex="0">
  <div id="app-container">
    <div id="viewfinder-container">
      <video id="camera-stream" autoplay playsinline muted></video>
      <div id="grid-overlay"></div>
      
      <!-- Ірисова діафрагма -->
      <div id="iris-shutter">
        <div class="iris-mask"></div>
      </div>
    </div>

    <!-- HUD -->
    <div id="top-hud">
      <button class="hud-btn" id="lens-btn">📷 1x</button>
      <button class="hud-btn" id="aspect-btn">3:2</button>
      <button class="hud-btn" id="grid-btn">🌐 Третини</button>
      <button class="hud-btn" id="film-btn">🎞️ Tri-X 400</button>
      <button class="hud-btn" id="open-settings-btn">⚙️</button>
    </div>

    <!-- Налаштування -->
    <div id="settings-modal">
      <div>
        <div class="setting-title">Експокорекція (EV)</div>
        <div class="slider-container">
          <input type="range" id="ev-slider" min="-2.0" max="2.0" step="0.1" value="0.0">
          <span class="slider-val" id="ev-val">0.0 EV</span>
        </div>
      </div>

      <!-- Зональне фокусування Leica M -->
      <div>
        <div class="setting-title">Фокусна відстань (Leica Zone Focus)</div>
        <div class="setting-grid" id="focus-group">
          <button class="opt-btn active" data-dist="auto">AF Auto</button>
          <button class="opt-btn" data-dist="0.7">0.7 m</button>
          <button class="opt-btn" data-dist="1.0">1.0 m</button>
          <button class="opt-btn" data-dist="1.2">1.2 m</button>
          <button class="opt-btn" data-dist="1.5">1.5 m</button>
          <button class="opt-btn" data-dist="2.0">2.0 m</button>
          <button class="opt-btn" data-dist="3.0">3.0 m</button>
          <button class="opt-btn" data-dist="5.0">5.0 m</button>
          <button class="opt-btn" data-dist="100.0" style="grid-column: span 4;">∞ Нескінченність</button>
        </div>
      </div>

      <div>
        <div class="setting-title">Світлочутливість (ISO)</div>
        <div class="setting-grid" id="iso-group">
          <button class="opt-btn active" data-val="auto">Auto</button>
          <button class="opt-btn" data-val="400">400</button>
          <button class="opt-btn" data-val="800">800</button>
          <button class="opt-btn" data-val="1600">1600</button>
        </div>
      </div>

      <button id="close-settings-btn">Закрити налаштування</button>
    </div>
  </div>

  <canvas id="capture-canvas"></canvas>

  <script>
    const video = document.getElementById('camera-stream');
    const irisShutter = document.getElementById('iris-shutter');
    const canvas = document.getElementById('capture-canvas');
    const settingsModal = document.getElementById('settings-modal');
    const evSlider = document.getElementById('ev-slider');
    const evVal = document.getElementById('ev-val');
    const gridOverlay = document.getElementById('grid-overlay');
    const gridBtn = document.getElementById('grid-btn');
    const filmBtn = document.getElementById('film-btn');
    const lensBtn = document.getElementById('lens-btn');

    let videoTrack = null;
    let currentStream = null;
    let currentEV = 0.0;
    let rearCameras = [];
    let currentCameraIndex = 0;

    // Пресети плівок
    const filmPresets = [
      { name: 'Tri-X 400', filter: 'grayscale(100%) contrast(155%)' },
      { name: 'HP5 Plus', filter: 'grayscale(100%) contrast(120%)' },
      { name: 'T-Max 3200', filter: 'grayscale(100%) contrast(190%)' },
      { name: 'Neopan 100', filter: 'grayscale(100%) contrast(135%)' },
      { name: 'Portra 400', filter: 'saturate(85%) contrast(110%) sepia(10%)' },
      { name: 'Cinestill 800T', filter: 'saturate(115%) contrast(130%) hue-rotate(190deg) sepia(15%)' }
    ];
    let currentFilmIdx = 0;

    // Режими сіток
    const gridModes = ['thirds', 'golden', 'fibonacci', 'diagonals', 'center', 'off'];
    const gridLabels = {
      'thirds': '🌐 Третини',
      'golden': '🌐 Золотий перетин',
      'fibonacci': '🌐 Спіраль Фібоначчі',
      'diagonals': '🌐 Діагоналі',
      'center': '🌐 Центр',
      'off': '🌐 Сітка: Вимк'
    };
    let currentGridIdx = 0;

    // Відображення сіток
    function renderGrid() {
      const mode = gridModes[currentGridIdx];
      gridBtn.textContent = gridLabels[mode];
      gridOverlay.innerHTML = '';

      if (mode === 'thirds') {
        gridOverlay.innerHTML = `
          <div class="grid-line-v" style="left: 33.33%;"></div>
          <div class="grid-line-v" style="left: 66.66%;"></div>
          <div class="grid-line-h" style="top: 33.33%;"></div>
          <div class="grid-line-h" style="top: 66.66%;"></div>
        `;
      } else if (mode === 'golden') {
        gridOverlay.innerHTML = `
          <div class="grid-line-v" style="left: 38.2%;"></div>
          <div class="grid-line-v" style="left: 61.8%;"></div>
          <div class="grid-line-h" style="top: 38.2%;"></div>
          <div class="grid-line-h" style="top: 61.8%;"></div>
        `;
      } else if (mode === 'fibonacci') {
        gridOverlay.innerHTML = `
          <svg class="grid-svg" viewBox="0 0 1000 618" preserveAspectRatio="none">
            <line x1="618" y1="0" x2="618" y2="618" stroke="rgba(255,255,255,0.25)" />
            <line x1="618" y1="382" x2="1000" y2="382" stroke="rgba(255,255,255,0.25)" />
            <line x1="764" y1="382" x2="764" y2="618" stroke="rgba(255,255,255,0.25)" />
            <line x1="618" y1="472" x2="764" y2="472" stroke="rgba(255,255,255,0.25)" />
            <path d="M 0,618 A 618,618 0 0,1 618,0 A 382,382 0 0,1 1000,382 A 236,236 0 0,1 764,618 A 146,146 0 0,1 618,472 A 90,90 0 0,1 708,382 A 56,56 0 0,1 764,438 A 34,34 0 0,1 730,472" />
          </svg>
        `;
      } else if (mode === 'diagonals') {
        gridOverlay.innerHTML = `
          <svg class="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <line x1="0" y1="0" x2="1000" y2="1000" />
            <line x1="1000" y1="0" x2="0" y2="1000" />
            <line x1="0" y1="500" x2="500" y2="0" stroke="rgba(255,255,255,0.25)" />
            <line x1="500" y1="1000" x2="1000" y2="500" stroke="rgba(255,255,255,0.25)" />
            <line x1="0" y1="500" x2="500" y2="1000" stroke="rgba(255,255,255,0.25)" />
            <line x1="500" y1="0" x2="1000" y2="500" stroke="rgba(255,255,255,0.25)" />
          </svg>
        `;
      } else if (mode === 'center') {
        gridOverlay.innerHTML = `
          <div class="center-cross"></div>
          <div class="grid-line-h" style="top: 50%;"></div>
          <div class="grid-line-v" style="left: 50%;"></div>
        `;
      }
    }

    // Пошук тільки задніх сенсорів/об'єктивів
    async function detectRearCameras() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        const videoDevices = devices.filter(d => d.kind === 'videoinput');
        
        // Відфільтровуємо фронтальні камери
        rearCameras = videoDevices.filter(d => {
          const label = (d.label || '').toLowerCase();
          return !label.includes('front') && !label.includes('user') && !label.includes('selfie') && !label.includes('передн');
        });

        if (rearCameras.length === 0) {
          rearCameras = videoDevices; // Резерв
        }
        updateLensButtonLabel();
      } catch (e) {
        console.error('Помилка визначення камер:', e);
      }
    }

    function updateLensButtonLabel() {
      if (rearCameras.length <= 1) {
        lensBtn.textContent = '📷 1x';
      } else {
        const currentCam = rearCameras[currentCameraIndex];
        const label = (currentCam.label || '').toLowerCase();
        if (label.includes('wide') || label.includes('0.5') || label.includes('ultra')) {
          lensBtn.textContent = '📷 0.5x';
        } else if (label.includes('tele') || label.includes('zoom') || label.includes('2x') || label.includes('3x')) {
          lensBtn.textContent = '📷 2x+';
        } else {
          lensBtn.textContent = `📷 Об'єктив ${currentCameraIndex + 1}`;
        }
      }
    }

    // Запуск обраного об'єктива
    async function startCamera(deviceId = null) {
      if (currentStream) {
        currentStream.getTracks().forEach(t => t.stop());
      }

      const constraints = {
        video: {
          width: { ideal: 1920 },
          height: { ideal: 1080 }
        },
        audio: false
      };

      if (deviceId) {
        constraints.video.deviceId = { exact: deviceId };
      } else {
        constraints.video.facingMode = { ideal: 'environment' };
      }

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        videoTrack = currentStream.getVideoTracks()[0];
        updateFilters();
        renderGrid();
      } catch (err) {
        console.error('Помилка відкриття камери:', err);
      }
    }

    // Перемикання об'єктивів
    lensBtn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (rearCameras.length <= 1) {
        await detectRearCameras();
      }
      if (rearCameras.length > 1) {
        currentCameraIndex = (currentCameraIndex + 1) % rearCameras.length;
        updateLensButtonLabel();
        await startCamera(rearCameras[currentCameraIndex].deviceId);
      }
    });

    // Фільтри видошукача
    function getCombinedFilter() {
      const brightnessFactor = Math.pow(2, currentEV);
      const baseFilter = filmPresets[currentFilmIdx].filter;
      return `${baseFilter} brightness(${brightnessFactor * 100}%)`;
    }

    function updateFilters() {
      video.style.filter = getCombinedFilter();
    }

    // Перемикання емуляцій плівок
    filmBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentFilmIdx = (currentFilmIdx + 1) % filmPresets.length;
      filmBtn.textContent = `🎞️ ${filmPresets[currentFilmIdx].name}`;
      updateFilters();
    });

    // Перемикання сіток
    gridBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentGridIdx = (currentGridIdx + 1) % gridModes.length;
      renderGrid();
    });

    // Зміна EV
    evSlider.addEventListener('input', (e) => {
      currentEV = parseFloat(e.target.value);
      evVal.textContent = `${currentEV > 0 ? '+' : ''}${currentEV.toFixed(1)} EV`;
      updateFilters();

      if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (caps.exposureCompensation) {
          videoTrack.applyConstraints({
            advanced: [{ exposureCompensation: currentEV }]
          }).catch(() => {});
        }
      }
    });

    // Зональне фокусування (Leica M Scale)
    document.querySelectorAll('#focus-group .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#focus-group .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const dist = btn.getAttribute('data-dist');
        if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
          const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
          if (caps.focusMode) {
            if (dist === 'auto') {
              videoTrack.applyConstraints({
                advanced: [{ focusMode: 'continuous' }]
              }).catch(() => {});
            } else {
              const distanceVal = parseFloat(dist);
              videoTrack.applyConstraints({
                advanced: [{ focusMode: 'manual', focusDistance: distanceVal }]
              }).catch(() => {});
            }
          }
        }
      });
    });

    // ISO
    document.querySelectorAll('#iso-group .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#iso-group .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const val = btn.getAttribute('data-val');
        if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
          const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
          if (caps.iso) {
            if (val === 'auto') {
              videoTrack.applyConstraints({ advanced: [{ iso: caps.iso.min }] }).catch(() => {});
            } else {
              videoTrack.applyConstraints({ advanced: [{ iso: parseInt(val) }] }).catch(() => {});
            }
          }
        }
      });
    });

    // Спуск затвора з анімацією діафрагми та автозбереженням
    async function triggerShutter() {
      // Анімація ірисової діафрагми
      irisShutter.classList.remove('iris-anim');
      void irisShutter.offsetWidth;
      irisShutter.classList.add('iris-anim');

      if (navigator.vibrate) navigator.vibrate([30, 20, 30]);

      const width = video.videoWidth || 1920;
      const height = video.videoHeight || 1080;
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.filter = getCombinedFilter();
      ctx.drawImage(video, 0, 0, width, height);

      canvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `STREET_${filmPresets[currentFilmIdx].name.replace(/\s+/g, '')}_${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);
      }, 'image/jpeg', 0.95);
    }

    // Спуск кліком по екрану
    document.getElementById('viewfinder-container').addEventListener('click', () => {
      if (settingsModal.style.display === 'flex') return;
      triggerShutter();
    });

    // Фізичні клавіші гучності та кнопки камери
    function handleHardwareKeys(e) {
      const code = e.code || e.key;
      if (
        code === 'VolumeDown' || code === 'VolumeUp' || 
        code === 'AudioVolumeDown' || code === 'AudioVolumeUp' ||
        code === 'Camera' || code === 'MediaPlayPause' || e.keyCode === 24 || e.keyCode === 25
      ) {
        e.preventDefault();
        e.stopPropagation();
        triggerShutter();
      }
    }
    window.addEventListener('keydown', handleHardwareKeys, { passive: false });
    window.addEventListener('keyup', (e) => {
      const code = e.code || e.key;
      if (code === 'VolumeDown' || code === 'VolumeUp' || e.keyCode === 24 || e.keyCode === 25) {
        e.preventDefault();
      }
    }, { passive: false });

    // Меню налаштувань
    document.getElementById('open-settings-btn').addEventListener('click', (e) => {
      e.stopPropagation();
      settingsModal.style.display = 'flex';
    });
    document.getElementById('close-settings-btn').addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });

    // Старт
    window.addEventListener('load', async () => {
      await startCamera();
      await detectRearCameras();
      document.body.focus();
    });
  </script>
</body>
</html>
