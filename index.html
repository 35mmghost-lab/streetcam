<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam Test</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    #log {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      font-size: 14px;
      color: #00ff66;
      background: rgba(0,0,0,0.8);
      padding: 8px;
      z-index: 999;
      text-align: center;
    }
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: grayscale(100%) contrast(140%);
    }
    button {
      position: fixed;
      z-index: 1000;
      padding: 20px 40px;
      font-size: 18px;
      font-weight: bold;
      background: #ffb642;
      border: 2px solid #fff;
      border-radius: 10px;
      color: #000;
    }
  </style>
</head>
<body>
  <div id="log">Натисніть кнопку нижче</div>
  <video id="v" autoplay playsinline muted></video>
  <button id="btn">УВІМКНУТИ КАМЕРУ</button>

  <script>
    const log = document.getElementById('log');
    const btn = document.getElementById('btn');
    const v = document.getElementById('v');

    btn.addEventListener('click', () => {
      log.textContent = "⏳ Запит дозволу камери...";
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      }).then(stream => {
        v.srcObject = stream;
        v.play();
        btn.style.display = 'none';
        log.textContent = "🟢 Камера працює!";
      }).catch(err => {
        log.textContent = "❌ Помилка: " + err.name + " - " + err.message;
        log.style.color = "#ff4444";
      });
    });
  </script>
</body>
</html>
