<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      overflow: hidden;
    }
    #app-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    #viewfinder-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    video {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      background: #000;
    }

    /* Діагностичний екран при помилці або першому запуску */
    #status-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      text-align: center;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 8px;
      border: 1px solid #333;
      max-width: 80%;
    }
    #status-text {
      font-size: 13px;
      color: #ccc;
      line-height: 1.4;
    }
    #start-cam-btn {
      padding: 10px 18px;
      background: #fff;
      color: #000;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }

    /* Шар сіток */
    #grid-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .grid-line-v, .grid-line-h {
      position: absolute;
      background: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.8);
    }
    .grid-line-v { top: 0; bottom: 0; width: 1px; }
    .grid-line-h { left: 0; right: 0; height: 1px; }

    .grid-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      stroke: rgba(255, 255, 255, 0.5);
      stroke-width: 1.5;
      fill: none;
      filter: drop-shadow(0 0 1px rgba(0,0,0,0.9));
    }

    .center-cross {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
    }
    .center-cross::before, .center-cross::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.9);
    }
    .center-cross::before { top: 15px; left: 0; width: 32px; height: 1px; }
    .center-cross::after { top: 0; left: 15px; width: 1px; height: 32px; }

    /* Ірисова діафрагма затвора */
    #iris-shutter {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 25;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
    }
    .iris-blade-container {
      width: 140vmax;
      height: 140vmax;
      border-radius: 50%;
      background: radial-gradient(circle, transparent 18%, rgba(12,12,12,0.98) 22%);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.9);
      transform: scale(2.8);
    }
    .iris-anim {
      animation: irisMech 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes irisMech {
      0% { opacity: 0; transform: scale(2.8) rotate(0deg); }
      20% { opacity: 1; }
      50% { opacity: 1; transform: scale(0.28) rotate(60deg); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: scale(2.8) rotate(120deg); }
    }

    /* Верхній HUD */
    #top-hud {
      position: absolute;
      top: 12px;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 6px 12px;
      z-index: 20;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }
    .hud-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #eee;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }
    .hud-btn:active {
      background: rgba(255, 255, 255, 0.2);
    }

    /* Меню налаштувань */
    #settings-modal {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(12, 12, 12, 0.96);
      border-top: 1px solid #333;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 30;
      max-height: 80vh;
      overflow-y: auto;
    }
    .setting-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 6px;
    }
    .setting-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }
    .opt-btn {
      padding: 8px 4px;
      background: #1e1e1e;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
      font-family: monospace;
    }
    .opt-btn.active {
      background: #fff;
      color: #000;
      font-weight: bold;
      border-color: #fff;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }
    input[type=range] {
      flex: 1;
      accent-color: #fff;
      height: 4px;
    }
    .slider-val {
      font-size: 12px;
      font-family: monospace;
      min-width: 45px;
      text-align: right;
    }
    #close-settings-btn {
      width: 100%;
      padding: 11px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      margin-top: 4px;
      cursor: pointer;
    }
    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="viewfinder-container">
      <video id="camera-stream" autoplay playsinline muted></video>
      <div id="grid-overlay"></div>
      
      <!-- Діагностика/Кнопка старту -->
      <div id="status-overlay">
        <div id="status-text">Очікування дозволу на камеру...</div>
        <button id="start-cam-btn">📷 Увімкнути камеру</button>
      </div>

      <div id="iris-shutter">
        <div class="iris-blade-container"></div>
      </div>
    </div>

    <!-- HUD -->
    <div id="top-hud">
      <button class="hud-btn" id="lens-btn">📷 1.0x</button>
      <button class="hud-btn" id="aspect-btn">3:2</button>
      <button class="hud-btn" id="grid-btn">🌐 Третини</button>
      <button class="hud-btn" id="film-btn">🎞️ Tri-X 400</button>
      <button class="hud-btn" id="open-settings-btn">⚙️</button>
    </div>

    <!-- Налаштування -->
    <div id="settings-modal">
      <div>
        <div class="setting-title">Експокорекція (EV)</div>
        <div class="slider-container">
          <input type="range" id="ev-slider" min="-2.0" max="2.0" step="0.1" value="0.0">
          <span class="slider-val" id="ev-val">0.0 EV</span>
        </div>
      </div>

      <!-- Зональне фокусування Leica M -->
      <div>
        <div class="setting-title">Фокусна відстань (Leica Zone Focus)</div>
        <div class="setting-grid" id="focus-group">
          <button class="opt-btn active" data-dist="auto">AF Auto</button>
          <button class="opt-btn" data-dist="0.7">0.7 m</button>
          <button class="opt-btn" data-dist="1.0">1.0 m</button>
          <button class="opt-btn" data-dist="1.2">1.2 m</button>
          <button class="opt-btn" data-dist="1.5">1.5 m</button>
          <button class="opt-btn" data-dist="2.0">2.0 m</button>
          <button class="opt-btn" data-dist="3.0">3.0 m</button>
          <button class="opt-btn" data-dist="5.0">5.0 m</button>
          <button class="opt-btn" data-dist="100.0" style="grid-column: span 4;">∞ Нескінченність</button>
        </div>
      </div>

      <div>
        <div class="setting-title">Світлочутливість (ISO)</div>
        <div class="setting-grid" id="iso-group">
          <button class="opt-btn active" data-val="auto">Auto</button>
          <button class="opt-btn" data-val="400">400</button>
          <button class="opt-btn" data-val="800">800</button>
          <button class="opt-btn" data-val="1600">1600</button>
        </div>
      </div>

      <button id="close-settings-btn">Закрити налаштування</button>
    </div>
  </div>

  <canvas id="capture-canvas"></canvas>

  <script>
    const video = document.getElementById('camera-stream');
    const irisShutter = document.getElementById('iris-shutter');
    const canvas = document.getElementById('capture-canvas');
    const settingsModal = document.getElementById('settings-modal');
    const evSlider = document.getElementById('ev-slider');
    const evVal = document.getElementById('ev-val');
    const gridOverlay = document.getElementById('grid-overlay');
    const gridBtn = document.getElementById('grid-btn');
    const filmBtn = document.getElementById('film-btn');
    const lensBtn = document.getElementById('lens-btn');
    const statusOverlay = document.getElementById('status-overlay');
    const statusText = document.getElementById('status-text');
    const startCamBtn = document.getElementById('start-cam-btn');

    let videoTrack = null;
    let currentStream = null;
    let currentEV = 0.0;

    const filmPresets = [
      { name: 'Tri-X 400', filter: 'grayscale(100%) contrast(155%)', grain: 16 },
      { name: 'HP5 Plus', filter: 'grayscale(100%) contrast(120%)', grain: 10 },
      { name: 'T-Max 3200', filter: 'grayscale(100%) contrast(190%)', grain: 28 },
      { name: 'Neopan 100', filter: 'grayscale(100%) contrast(135%)', grain: 6 },
      { name: 'Portra 400', filter: 'saturate(85%) contrast(110%) sepia(10%)', grain: 12 },
      { name: 'Cinestill 800T', filter: 'saturate(115%) contrast(130%) hue-rotate(190deg) sepia(15%)', grain: 20 }
    ];
    let currentFilmIdx = 0;

    const zoomLevels = [
      { label: '📷 1.0x (28mm)', zoom: 1.0 },
      { label: '📷 2.0x (50mm)', zoom: 2.0 },
      { label: '📷 3.0x (85mm)', zoom: 3.0 },
      { label: '📷 0.5x (14mm)', zoom: 0.5 }
    ];
    let currentZoomIdx = 0;

    const gridModes = ['thirds', 'golden', 'fibonacci', 'diagonals', 'center', 'off'];
    const gridLabels = {
      'thirds': '🌐 Третини',
      'golden': '🌐 Золотий перетин',
      'fibonacci': '🌐 Спіраль Фібоначчі',
      'diagonals': '🌐 Діагоналі',
      'center': '🌐 Центр',
      'off': '🌐 Сітка: Вимк'
    };
    let currentGridIdx = 0;

    function renderGrid() {
      const mode = gridModes[currentGridIdx];
      gridBtn.textContent = gridLabels[mode];
      gridOverlay.innerHTML = '';

      if (mode === 'thirds') {
        gridOverlay.innerHTML = `
          <div class="grid-line-v" style="left: 33.33%;"></div>
          <div class="grid-line-v" style="left: 66.66%;"></div>
          <div class="grid-line-h" style="top: 33.33%;"></div>
          <div class="grid-line-h" style="top: 66.66%;"></div>
        `;
      } else if (mode === 'golden') {
        gridOverlay.innerHTML = `
          <div class="grid-line-v" style="left: 38.2%;"></div>
          <div class="grid-line-v" style="left: 61.8%;"></div>
          <div class="grid-line-h" style="top: 38.2%;"></div>
          <div class="grid-line-h" style="top: 61.8%;"></div>
        `;
      } else if (mode === 'fibonacci') {
        gridOverlay.innerHTML = `
          <svg class="grid-svg" viewBox="0 0 1000 618" preserveAspectRatio="none">
            <line x1="618" y1="0" x2="618" y2="618" stroke="rgba(255,255,255,0.25)" />
            <line x1="618" y1="382" x2="1000" y2="382" stroke="rgba(255,255,255,0.25)" />
            <line x1="764" y1="382" x2="764" y2="618" stroke="rgba(255,255,255,0.25)" />
            <line x1="618" y1="472" x2="764" y2="472" stroke="rgba(255,255,255,0.25)" />
            <path d="M 0,618 A 618,618 0 0,1 618,0 A 382,382 0 0,1 1000,382 A 236,236 0 0,1 764,618 A 146,146 0 0,1 618,472 A 90,90 0 0,1 708,382 A 56,56 0 0,1 764,438 A 34,34 0 0,1 730,472" />
          </svg>
        `;
      } else if (mode === 'diagonals') {
        gridOverlay.innerHTML = `
          <svg class="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
            <line x1="0" y1="0" x2="1000" y2="1000" />
            <line x1="1000" y1="0" x2="0" y2="1000" />
            <line x1="0" y1="500" x2="500" y2="0" stroke="rgba(255,255,255,0.25)" />
            <line x1="500" y1="1000" x2="1000" y2="500" stroke="rgba(255,255,255,0.25)" />
            <line x1="0" y1="500" x2="500" y2="1000" stroke="rgba(255,255,255,0.25)" />
            <line x1="500" y1="0" x2="1000" y2="500" stroke="rgba(255,255,255,0.25)" />
          </svg>
        `;
      } else if (mode === 'center') {
        gridOverlay.innerHTML = `
          <div class="center-cross"></div>
          <div class="grid-line-h" style="top: 50%;"></div>
          <div class="grid-line-v" style="left: 50%;"></div>
        `;
      }
    }

    // Безвідмовний запуск камери
    async function initCamera() {
      try {
        if (currentStream) {
          currentStream.getTracks().forEach(t => t.stop());
        }

        let stream = null;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { ideal: 'environment' } },
            audio: false
          });
        } catch (e1) {
          // Резервний запит
          stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });
        }

        currentStream = stream;
        video.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];

        await video.play();
        statusOverlay.style.display = 'none';
        updateFilters();
        renderGrid();
      } catch (err) {
        console.error('Camera Init Error:', err);
        statusOverlay.style.display = 'flex';
        statusText.textContent = 'Надайте браузеру дозвіл на використання камери.';
      }
    }

    startCamBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      initCamera();
    });

    function getCombinedFilter() {
      const brightnessFactor = Math.pow(2, currentEV);
      const baseFilter = filmPresets[currentFilmIdx].filter;
      return `${baseFilter} brightness(${brightnessFactor * 100}%)`;
    }

    function updateFilters() {
      video.style.filter = getCombinedFilter();
    }

    lensBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentZoomIdx = (currentZoomIdx + 1) % zoomLevels.length;
      lensBtn.textContent = zoomLevels[currentZoomIdx].label.split(' ')[1];

      if (videoTrack && typeof videoTrack.applyConstraints === 'function' && typeof videoTrack.getCapabilities === 'function') {
        const caps = videoTrack.getCapabilities();
        if (caps && caps.zoom) {
          const targetZoom = zoomLevels[currentZoomIdx].zoom;
          const clampedZoom = Math.min(Math.max(targetZoom, caps.zoom.min), caps.zoom.max);
          videoTrack.applyConstraints({ advanced: [{ zoom: clampedZoom }] }).catch(() => {});
        }
      }
    });

    filmBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentFilmIdx = (currentFilmIdx + 1) % filmPresets.length;
      filmBtn.textContent = `🎞️ ${filmPresets[currentFilmIdx].name}`;
      updateFilters();
    });

    gridBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      currentGridIdx = (currentGridIdx + 1) % gridModes.length;
      renderGrid();
    });

    evSlider.addEventListener('input', (e) => {
      currentEV = parseFloat(e.target.value);
      evVal.textContent = `${currentEV > 0 ? '+' : ''}${currentEV.toFixed(1)} EV`;
      updateFilters();
    });

    // Leica Zone Focus
    document.querySelectorAll('#focus-group .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#focus-group .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const dist = btn.getAttribute('data-dist');
        if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
          const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
          if (caps.focusMode) {
            if (dist === 'auto') {
              videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
            } else {
              videoTrack.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: parseFloat(dist) }] }).catch(() => {});
            }
          }
        }
      });
    });

    // ISO
    document.querySelectorAll('#iso-group .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#iso-group .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');

        const val = btn.getAttribute('data-val');
        if (videoTrack && typeof videoTrack.applyConstraints === 'function') {
          const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
          if (caps.iso) {
            if (val === 'auto') {
              videoTrack.applyConstraints({ advanced: [{ iso: caps.iso.min }] }).catch(() => {});
            } else {
              videoTrack.applyConstraints({ advanced: [{ iso: parseInt(val) }] }).catch(() => {});
            }
          }
        }
      });
    });

    // Зерно та віньєтка
    function applyFilmGrainAndVignette(ctx, width, height, grainIntensity) {
      const imgData = ctx.getImageData(0, 0, width, height);
      const data = imgData.data;
      const len = data.length;

      for (let i = 0; i < len; i += 4) {
        const noise = (Math.random() - 0.5) * grainIntensity * 2.2;
        data[i] = Math.min(255, Math.max(0, data[i] + noise));
        data[i + 1] = Math.min(255, Math.max(0, data[i + 1] + noise));
        data[i + 2] = Math.min(255, Math.max(0, data[i + 2] + noise));
      }
      ctx.putImageData(imgData, 0, 0);

      const gradient = ctx.createRadialGradient(
        width / 2, height / 2, Math.min(width, height) * 0.45,
        width / 2, height / 2, Math.max(width, height) * 0.75
      );
      gradient.addColorStop(0, 'rgba(0,0,0,0)');
      gradient.addColorStop(1, 'rgba(0,0,0,0.42)');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, width, height);
    }

    // Спуск затвора
    async function triggerShutter() {
      irisShutter.classList.remove('iris-anim');
      void irisShutter.offsetWidth;
      irisShutter.classList.add('iris-anim');

      if (navigator.vibrate) navigator.vibrate([40, 30, 40]);

      const width = video.videoWidth || 1920;
      const height = video.videoHeight || 1080;
      canvas.width = width;
      canvas.height = height;

      const ctx = canvas.getContext('2d');
      ctx.filter = getCombinedFilter();
      ctx.drawImage(video, 0, 0, width, height);

      const activePreset = filmPresets[currentFilmIdx];
      applyFilmGrainAndVignette(ctx, width, height, activePreset.grain);

      canvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.style.display = 'none';
        a.href = url;
        a.download = `STREET_${activePreset.name.replace(/\s+/g, '')}_${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.r
