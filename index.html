<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cam Test</title>
  <style>
    body { background: #000; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
    button { padding: 20px; font-size: 18px; background: #ffb642; border: none; border-radius: 10px; font-weight: bold; width: 100%; max-width: 300px; }
    #log { margin-top: 20px; font-family: monospace; color: #39ff14; font-size: 14px; word-break: break-all; }
    video { width: 100%; max-width: 400px; margin-top: 15px; border: 2px solid #39ff14; display: none; }
  </style>
</head>
<body>
  <h2>ТЕСТ СЕНСОРА</h2>
  <button id="btn" onclick="runCam()">▶ ТЕСТОВИЙ СТАРТ</button>
  <div id="log">Очікування натискання...</div>
  <video id="v" autoplay playsinline muted></video>

  <script>
    // 1. Примусове видалення старих кешів і сервіс-воркерів
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        for (var r of regs) { r.unregister(); }
      });
    }

    function runCam() {
      var log = document.getElementById('log');
      var v = document.getElementById('v');
      log.innerText = 'Запит дозволу...';

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        log.innerText = 'ПОМИЛКА: mediaDevices не знайдено';
        alert('mediaDevices не знайдено');
        return;
      }

      navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment' },
        audio: false
      })
      .then(function(stream) {
        log.innerText = 'УСПІХ! Відео підключено.';
        v.style.display = 'block';
        v.srcObject = stream;
        v.play();
      })
      .catch(function(err) {
        log.innerText = 'ПОМИЛКА: ' + err.name + ' - ' + err.message;
        alert('ПОМИЛКА: ' + err.name + '\n' + err.message);
      });
    }
  </script>
</body>
</html>
