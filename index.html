<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Відео видошукача */
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: grayscale(100%) contrast(155%);
    }

    /* Стартова кнопка */
    #btn-start {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      padding: 20px 40px;
      font-size: 16px;
      font-weight: bold;
      background: #ffb642;
      border: 2px solid #fff;
      border-radius: 10px;
      color: #000;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 182, 66, 0.9);
    }

    /* Верхня панель HUD */
    #hud {
      position: fixed;
      top: 10px;
      left: 0;
      width: 100%;
      display: none;
      justify-content: space-around;
      align-items: center;
      padding: 6px 4px;
      z-index: 500;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
    }
    .hud-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #eee;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .hud-btn.active {
      background: rgba(255, 182, 66, 0.3);
      border-color: #ffb642;
      color: #ffb642;
    }

    /* Сітки композиції */
    #grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }
    .grid-v, .grid-h {
      position: absolute;
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.8);
    }
    .grid-v { top: 0; bottom: 0; width: 1px; }
    .grid-h { left: 0; right: 0; height: 1px; }

    .grid-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      stroke: rgba(255, 255, 255, 0.45);
      stroke-width: 1.5;
      fill: none;
      filter: drop-shadow(0 0 1px rgba(0,0,0,0.8));
    }
    .center-cross {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
    }
    .center-cross::before, .center-cross::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.9);
    }
    .center-cross::before { top: 15px; left: 0; width: 32px; height: 1px; }
    .center-cross::after { top: 0; left: 15px; width: 1px; height: 32px; }

    /* Бурштиновий рівень Pip-Boy */
    #level {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 220px;
      height: 20px;
      pointer-events: none;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #level-line {
      width: 100%;
      height: 2px;
      background: #ffb642;
      box-shadow: 0 0 8px rgba(255, 182, 66, 0.9);
      transition: transform 0.05s ease-out;
      transform-origin: center center;
    }
    #level-line.aligned {
      height: 3px;
      background: #ffe082;
      box-shadow: 0 0 18px rgba(255, 182, 66, 1);
    }

    /* Стадіаметричний далекомір */
    #rangefinder {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 70;
      display: none;
    }
    #range-text {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.8);
      border: 1px solid #ffb642;
      color: #ffb642;
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }
    .stadia-svg {
      width: 100%;
      height: 100%;
      stroke: #ffb642;
      stroke-width: 1.5;
      fill: none;
      filter: drop-shadow(0 0 2px #000);
    }
    .stadia-label {
      fill: #ffb642;
      font-size: 11px;
      font-family: monospace;
    }

    /* Затвор */
    #shutter {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease-out;
    }
    #shutter.flash {
      opacity: 0.9;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  
  <div id="grid"></div>
  
  <div id="level">
    <div id="level-line"></div>
  </div>

  <div id="rangefinder">
    <div id="range-text">DIST: -- m (H: 1.60m)</div>
    <svg class="stadia-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <line x1="420" y1="120" x2="440" y2="120" />
      <line x1="420" y1="880" x2="440" y2="880" />
      <text x="380" y="505" class="stadia-label">1.2m</text>
      
      <line x1="460" y1="260" x2="475" y2="260" />
      <line x1="460" y1="740" x2="475" y2="740" />
      <text x="425" y="505" class="stadia-label">2.0m</text>

      <line x1="485" y1="340" x2="495" y2="340" />
      <line x1="485" y1="660" x2="495" y2="660" />
      <text x="505" y="505" class="stadia-label">3.0m</text>
    </svg>
  </div>

  <div id="shutter"></div>

  <button id="btn-start">▶ УВІМКНУТИ КАМЕРУ</button>

  <div id="hud">
    <button class="hud-btn" id="btn-snap">📷 SNAP</button>
    <button class="hud-btn" id="btn-film">🎞️ Tri-X 400</button>
    <button class="hud-btn" id="btn-grid">🌐 Третини</button>
    <button class="hud-btn" id="btn-level">🧭 Рівень</button>
    <button class="hud-btn" id="btn-range">🎯 Далекомір</button>
  </div>

  <canvas id="c"></canvas>

  <script>
    const v = document.getElementById('v');
    const btnStart = document.getElementById('btn-start');
    const hud = document.getElementById('hud');
    const grid = document.getElementById('grid');
    const level = document.getElementById('level');
    const levelLine = document.getElementById('level-line');
    const rangefinder = document.getElementById('rangefinder');
    const rangeText = document.getElementById('range-text');
    const shutter = document.getElementById('shutter');
    const canvas = document.getElementById('c');

    const btnSnap = document.getElementById('btn-snap');
    const btnFilm = document.getElementById('btn-film');
    const btnGrid = document.getElementById('btn-grid');
    const btnLevel = document.getElementById('btn-level');
    const btnRange = document.getElementById('btn-range');

    let isLevelActive = false;
    let isRangeActive = false;
    let wasAligned = false;
    const cameraHeight = 1.60;

    const films = [
      { name: 'Tri-X 400', isBW: true, filter: 'grayscale(100%) contrast(155%)' },
      { name: 'HP5 Plus', isBW: true, filter: 'grayscale(100%) contrast(125%)' },
      { name: 'T-Max 3200', isBW: true, filter: 'grayscale(100%) contrast(190%)' },
      { name: 'Neopan 100', isBW: true, filter: 'grayscale(100%) contrast(135%)' },
      { name: 'Portra 400', isBW: false, filter: 'saturate(85%) contrast(110%) sepia(10%)' },
      { name: 'Cinestill 800T', isBW: false, filter: 'saturate(115%) contrast(130%) hue-rotate(190deg) sepia(15%)' }
    ];
    let filmIdx = 0;

    const grids = ['thirds', 'golden', 'fibonacci', 'diagonals', 'center', 'off'];
    const gridNames = {
      'thirds': '🌐 Третини',
      'golden': '🌐 Золотий перетин',
      'fibonacci': '🌐 Спіраль Фібоначчі',
      'diagonals': '🌐 Діагоналі',
      'center': '🌐 Центр',
      'off': '🌐 Сітка: Вимк'
    };
    let gridIdx = 0;

    // 1. ЗАПУСК КАМЕРИ
    btnStart.addEventListener('click', () => {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      }).then(stream => {
        v.srcObject = stream;
        v.play();
        btnStart.style.display = 'none';
        hud.style.display = 'flex';
        renderGrid();
        initSensors();
      }).catch(err => {
        alert("Помилка камери: " + err.message);
      });
    });

    // 2. ПЛІВКИ
    btnFilm.addEventListener('click', (e) => {
      e.stopPropagation();
      filmIdx = (filmIdx + 1) % films.length;
      btnFilm.textContent = '🎞️ ' + films[filmIdx].name;
      v.style.filter = films[filmIdx].filter;
    });

    // 3. СІТКИ КОМПОЗИЦІЇ
    function renderGrid() {
      const mode = grids[gridIdx];
      btnGrid.textContent = gridNames[mode];
      grid.innerHTML = '';

      if (mode === 'thirds') {
        grid.innerHTML = '<div class="grid-v" style="left:33.33%;"></div><div class="grid-v" style="left:66.66%;"></div><div class="grid-h" style="top:33.33%;"></div><div class="grid-h" style="top:66.66%;"></div>';
      } else if (mode === 'golden') {
        grid.innerHTML = '<div class="grid-v" style="left:38.2%;"></div><div class="grid-v" style="left:61.8%;"></div><div class="grid-h" style="top:38.2%;"></div><div class="grid-h" style="top:61.8%;"></div>';
      } else if (mode === 'fibonacci') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 618" preserveAspectRatio="none"><path d="M 0,618 A 618,618 0 0,1 618,0 A 382,382 0 0,1 1000,382 A 236,236 0 0,1 764,618 A 146,146 0 0,1 618,472 A 90,90 0 0,1 708,382 A 56,56 0 0,1 764,438 A 34,34 0 0,1 730,472" /><line x1="618" y1="0" x2="618" y2="618" stroke="rgba(255,255,255,0.25)" /><line x1="618" y1="382" x2="1000" y2="382" stroke="rgba(255,255,255,0.25)" /><line x1="764" y1="382" x2="764" y2="618" stroke="rgba(255,255,255,0.25)" /></svg>';
      } else if (mode === 'diagonals') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><line x1="0" y1="0" x2="1000" y2="1000" /><line x1="1000" y1="0" x2="0" y2="1000" /><line x1="0" y1="500" x2="500" y2="0" stroke="rgba(255,255,255,0.25)" /><line x1="500" y1="1000" x2="1000" y2="500" stroke="rgba(255,255,255,0.25)" /></svg>';
      } else if (mode === 'center') {
        grid.innerHTML = '<div class="center-cross"></div><div class="grid-v" style="left:50%;"></div><div class="grid-h" style="top:50%;"></div>';
      }
    }

    btnGrid.addEventListener('click', (e) => {
      e.stopPropagation();
      gridIdx = (gridIdx + 1) % grids.length;
      renderGrid();
    });

    // 4. РІВЕНЬ ТА ДАЛЕКОМІР
    btnLevel.addEventListener('click', (e) => {
      e.stopPropagation();
      isLevelActive = !isLevelActive;
      level.style.display = isLevelActive ? 'flex' : 'none';
      btnLevel.classList.toggle('active', isLevelActive);
      requestSensorPermission();
    });

    btnRange.addEventListener('click', (e) => {
      e.stopPropagation();
      isRangeActive = !isRangeActive;
      rangefinder.style.display = isRangeActive ? 'block' : 'none';
      btnRange.classList.toggle('active', isRangeActive);
      requestSensorPermission();
    });

    function handleOrientation(e) {
      const isLandscape = window.innerWidth > window.innerHeight;
      const roll = isLandscape ? (e.beta || 0) : (e.gamma || 0);
      const pitch = isLandscape ? (e.gamma || 0) : (e.beta || 0);

      if (isLevelActive) {
        levelLine.style.transform = 'rotate(' + roll + 'deg)';
        const isAligned = Math.abs(roll) <= 0.6;
        if (isAligned) {
          levelLine.classList.add('aligned');
          if (!wasAligned && navigator.vibrate) navigator.vibrate(20);
          wasAligned = true;
        } else {
          levelLine.classList.remove('aligned');
          wasAligned = false;
        }
      }

      if (isRangeActive) {
        const declination = Math.max(1, 90 - Math.abs(pitch));
        const rad = declination * (Math.PI / 180);
        let dist = cameraHeight / Math.tan(rad);
        dist = Math.min(Math.max(dist, 0.5), 50.0);
        rangeText.textContent = 'DIST: ' + dist.toFixed(1) + ' m (H: ' + cameraHeight.toFixed(2) + 'm)';
      }
    }

    function requestSensorPermission() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') {
            window.addEventListener('deviceorientation', handleOrientation, true);
          }
        }).catch(console.error);
      }
    }

    function initSensors() {
      window.addEventListener('deviceorientation', handleOrientation, true);
    }

    // 5. ЗЙОМКА (SNAP)
    function capturePhoto() {
      shutter.classList.add('flash');
      setTimeout(() => shutter.classList.remove('flash'), 100);
      if (navigator.vibrate) navigator.vibrate([30, 20, 30]);

      const w = v.videoWidth || 1920;
      const h = v.videoHeight || 1080;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(v, 0, 0, w, h);

      if (films[filmIdx].isBW) {
        const imgData = ctx.getImageData(0, 0, w, h);
        const d = imgData.data;
        for (let i = 0; i < d.length; i += 4) {
          let y = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
          y = ((y / 255 - 0.5) * 1.45 + 0.5) * 255;
          y = Math.min(255, Math.max(0, y));
          d[i] = y; d[i + 1] = y; d[i + 2] = y;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      canvas.toBlob((blob) => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'STREET_' + films[filmIdx].name.replace(/\s+/g, '') + '_' + Date.now() + '.jpg';
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 500);
      }, 'image/jpeg', 0.95);
    }

    btnSnap.addEventListener('click', (e) => {
      e.stopPropagation();
      capturePhoto();
    });

    v.addEventListener('click', capturePhoto);
  </script>
</body>
</html>
