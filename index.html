<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Відео видошукача */
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: grayscale(100%) contrast(155%);
    }

    /* Стартова кнопка */
    #btn-start {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      padding: 20px 40px;
      font-size: 16px;
      font-weight: bold;
      background: #ffb642;
      border: 2px solid #fff;
      border-radius: 10px;
      color: #000;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 182, 66, 0.9);
      touch-action: manipulation;
    }

    /* Верхня панель HUD */
    #hud {
      position: fixed;
      top: 10px;
      left: 0;
      width: 100%;
      display: none;
      justify-content: space-around;
      align-items: center;
      padding: 6px 4px;
      z-index: 500;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
    }
    .hud-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #eee;
      padding: 6px 7px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
      touch-action: manipulation;
    }
    .hud-btn.active {
      background: rgba(255, 182, 66, 0.3);
      border-color: #ffb642;
      color: #ffb642;
    }

    /* Сітки композиції */
    #grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }
    .grid-v, .grid-h {
      position: absolute;
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.8);
    }
    .grid-v { top: 0; bottom: 0; width: 1px; }
    .grid-h { left: 0; right: 0; height: 1px; }

    .grid-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      stroke: rgba(255, 255, 255, 0.45);
      stroke-width: 1.5;
      fill: none;
      filter: drop-shadow(0 0 1px rgba(0,0,0,0.8));
    }
    .center-cross {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
    }
    .center-cross::before, .center-cross::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.9);
    }
    .center-cross::before { top: 15px; left: 0; width: 32px; height: 1px; }
    .center-cross::after { top: 0; left: 15px; width: 1px; height: 32px; }

    /* Бурштиновий рівень горизонту */
    #level {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 240px;
      height: 24px;
      pointer-events: none;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #level-line {
      width: 100%;
      height: 2.5px;
      background: #ffb642;
      box-shadow: 0 0 10px rgba(255, 182, 66, 0.95);
      transform-origin: center center;
    }
    #level-line.aligned {
      height: 3.5px;
      background: #ffe082;
      box-shadow: 0 0 20px rgba(255, 182, 66, 1);
    }

    /* Стадіаметричний далекомір */
    #rangefinder {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 70;
      display: none;
    }
    #range-text {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1.5px solid #ffb642;
      color: #ffb642;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      font-family: monospace;
      letter-spacing: 0.5px;
      white-space: nowrap;
      box-shadow: 0 0 10px rgba(0,0,0,0.8);
    }
    .stadia-svg {
      width: 100%;
      height: 100%;
      stroke: #ffb642;
      stroke-width: 2;
      fill: none;
      filter: drop-shadow(0 0 3px rgba(0,0,0,0.9));
    }
    .stadia-label {
      fill: #ffb642;
      font-size: 15px;
      font-weight: bold;
      font-family: monospace;
    }

    /* Механічний затвор */
    #shutter {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease-out;
    }
    #shutter.flash {
      opacity: 0.9;
    }

    /* Модальне вікно налаштувань */
    #settings-modal {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(12, 12, 12, 0.97);
      border-top: 1px solid #333;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 900;
      max-height: 80vh;
      overflow-y: auto;
    }
    .setting-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #888;
      margin-bottom: 6px;
    }
    .setting-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
      width: 100%;
    }
    .opt-btn {
      padding: 8px 4px;
      background: #1e1e1e;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      font-family: monospace;
    }
    .opt-btn.active {
      background: #fff;
      color: #000;
      font-weight: bold;
      border-color: #fff;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
    }
    input[type=range] {
      flex: 1;
      accent-color: #ffb642;
      height: 4px;
    }
    .slider-val {
      font-size: 12px;
      font-family: monospace;
      min-width: 45px;
      text-align: right;
      color: #ffb642;
    }
    #close-settings-btn {
      width: 100%;
      padding: 12px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      margin-top: 6px;
      cursor: pointer;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  
  <div id="grid"></div>
  
  <div id="level">
    <div id="level-line"></div>
  </div>

  <div id="rangefinder">
    <div id="range-text">DIST: -- m (H: 1.60m)</div>
    <svg class="stadia-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <line x1="390" y1="120" x2="430" y2="120" />
      <line x1="390" y1="880" x2="430" y2="880" />
      <text x="325" y="505" class="stadia-label">1.2m</text>
      
      <line x1="440" y1="260" x2="470" y2="260" />
      <line x1="440" y1="740" x2="470" y2="740" />
      <text x="395" y="505" class="stadia-label">2.0m</text>

      <line x1="475" y1="340" x2="495" y2="340" />
      <line x1="475" y1="660" x2="495" y2="660" />
      <text x="515" y="505" class="stadia-label">3.0m</text>
    </svg>
  </div>

  <div id="shutter"></div>

  <button id="btn-start">▶ УВІМКНУТИ КАМЕРУ</button>

  <div id="hud">
    <button class="hud-btn" id="btn-snap">📷 SNAP</button>
    <button class="hud-btn" id="btn-film">🎞️ Tri-X 400</button>
    <button class="hud-btn" id="btn-grid">🌐 Третини</button>
    <button class="hud-btn" id="btn-level">🧭 Рівень</button>
    <button class="hud-btn" id="btn-range">🎯 Далекомір</button>
    <button class="hud-btn" id="btn-settings">⚙️</button>
  </div>

  <div id="settings-modal">
    <div>
      <div class="setting-title">Висота зйомки далекоміра</div>
      <div class="setting-grid" style="grid-template-columns: repeat(2, 1fr);" id="height-group">
        <button class="opt-btn active" data-h="1.6">👁️ Рівень очей (1.60 м)</button>
        <button class="opt-btn" data-h="1.3">🥋 Рівень пояса (1.30 м)</button>
      </div>
    </div>

    <div>
      <div class="setting-title">Тактильний відгук горизонту</div>
      <div class="setting-grid" style="grid-template-columns: repeat(2, 1fr);" id="haptic-group">
        <button class="opt-btn active" data-haptic="on">📳 Увімк</button>
        <button class="opt-btn" data-haptic="off">🔕 Вимк</button>
      </div>
    </div>

    <div>
      <div class="setting-title">Експокорекція (EV)</div>
      <div class="slider-container">
        <input type="range" id="ev-slider" min="-2.0" max="2.0" step="0.1" value="0.0">
        <span class="slider-val" id="ev-val">0.0 EV</span>
      </div>
    </div>

    <div>
      <div class="setting-title">Зонне фокусування Leica</div>
      <div class="setting-grid" id="focus-group">
        <button class="opt-btn active" data-dist="auto">AF Auto</button>
        <button class="opt-btn" data-dist="0.7">0.7 m</button>
        <button class="opt-btn" data-dist="1.0">1.0 m</button>
        <button class="opt-btn" data-dist="1.2">1.2 m</button>
        <button class="opt-btn" data-dist="1.5">1.5 m</button>
        <button class="opt-btn" data-dist="2.0">2.0 m</button>
        <button class="opt-btn" data-dist="3.0">3.0 m</button>
        <button class="opt-btn" data-dist="5.0">5.0 m</button>
        <button class="opt-btn" data-dist="100.0" style="grid-column: span 4;">∞ Нескінченність</button>
      </div>
    </div>

    <div>
      <div class="setting-title">ISO</div>
      <div class="setting-grid" id="iso-group">
        <button class="opt-btn active" data-val="auto">Auto</button>
        <button class="opt-btn" data-val="400">400</button>
        <button class="opt-btn" data-val="800">800</button>
        <button class="opt-btn" data-val="1600">1600</button>
      </div>
    </div>

    <button id="close-settings-btn">Закрити налаштування</button>
  </div>

  <canvas id="c"></canvas>

  <script>
    const v = document.getElementById('v');
    const btnStart = document.getElementById('btn-start');
    const hud = document.getElementById('hud');
    const grid = document.getElementById('grid');
    const level = document.getElementById('level');
    const levelLine = document.getElementById('level-line');
    const rangefinder = document.getElementById('rangefinder');
    const rangeText = document.getElementById('range-text');
    const shutter = document.getElementById('shutter');
    const canvas = document.getElementById('c');
    const settingsModal = document.getElementById('settings-modal');

    let videoTrack = null;
    let isLevelActive = false;
    let isRangeActive = false;
    let hapticsEnabled = true;
    let wasAligned = false;
    let cameraHeight = 1.60;
    let currentEV = 0.0;

    const films = [
      { name: 'Tri-X 400', isBW: true, contrast: 1.55 },
      { name: 'HP5 Plus', isBW: true, contrast: 1.25 },
      { name: 'T-Max 3200', isBW: true, contrast: 1.90 },
      { name: 'Neopan 100', isBW: true, contrast: 1.35 },
      { name: 'Portra 400', isBW: false, filter: 'saturate(85%) contrast(110%) sepia(10%)' },
      { name: 'Cinestill 800T', isBW: false, filter: 'saturate(115%) contrast(130%) hue-rotate(190deg) sepia(15%)' }
    ];
    let filmIdx = 0;

    const grids = ['thirds', 'golden', 'fibonacci', 'diagonals', 'center', 'off'];
    const gridNames = {
      'thirds': '🌐 Третини',
      'golden': '🌐 Золотий перетин',
      'fibonacci': '🌐 Спіраль Фібоначчі',
      'diagonals': '🌐 Діагоналі',
      'center': '🌐 Центр',
      'off': '🌐 Сітка: Вимк'
    };
    let gridIdx = 0;

    function updateFilters() {
      const brightnessFactor = Math.pow(2, currentEV);
      const preset = films[filmIdx];
      if (preset.isBW) {
        v.style.filter = 'grayscale(100%) contrast(' + (preset.contrast * 100) + '%) brightness(' + (brightnessFactor * 100) + '%)';
      } else {
        v.style.filter = preset.filter + ' brightness(' + (brightnessFactor * 100) + '%)';
      }
    }

    function renderGrid() {
      const mode = grids[gridIdx];
      document.getElementById('btn-grid').textContent = gridNames[mode];
      grid.innerHTML = '';

      if (mode === 'thirds') {
        grid.innerHTML = '<div class="grid-v" style="left:33.33%;"></div><div class="grid-v" style="left:66.66%;"></div><div class="grid-h" style="top:33.33%;"></div><div class="grid-h" style="top:66.66%;"></div>';
      } else if (mode === 'golden') {
        grid.innerHTML = '<div class="grid-v" style="left:38.2%;"></div><div class="grid-v" style="left:61.8%;"></div><div class="grid-h" style="top:38.2%;"></div><div class="grid-h" style="top:61.8%;"></div>';
      } else if (mode === 'fibonacci') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 618" preserveAspectRatio="none"><path d="M 0,618 A 618,618 0 0,1 618,0 A 382,382 0 0,1 1000,382 A 236,236 0 0,1 764,618 A 146,146 0 0,1 618,472 A 90,90 0 0,1 708,382 A 56,56 0 0,1 764,438 A 34,34 0 0,1 730,472" /><line x1="618" y1="0" x2="618" y2="618" stroke="rgba(255,255,255,0.25)" /><line x1="618" y1="382" x2="1000" y2="382" stroke="rgba(255,255,255,0.25)" /><line x1="764" y1="382" x2="764" y2="618" stroke="rgba(255,255,255,0.25)" /></svg>';
      } else if (mode === 'diagonals') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><line x1="0" y1="0" x2="1000" y2="1000" /><line x1="1000" y1="0" x2="0" y2="1000" /><line x1="0" y1="500" x2="500" y2="0" stroke="rgba(255,255,255,0.25)" /><line x1="500" y1="1000" x2="1000" y2="500" stroke="rgba(255,255,255,0.25)" /></svg>';
      } else if (mode === 'center') {
        grid.innerHTML = '<div class="center-cross"></div><div class="grid-v" style="left:50%;"></div><div class="grid-h" style="top:50%;"></div>';
      }
    }

    // 1. ЗАПУСК КАМЕРИ
    btnStart.addEventListener('click', () => {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      }).then(stream => {
        v.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        v.play();
        btnStart.style.display = 'none';
        hud.style.display = 'flex';
        renderGrid();
        updateFilters();
      }).catch(err => {
        alert("Помилка камери: " + err.message);
      });
    });

    // 2. ПЛІВКИ
    document.getElementById('btn-film').addEventListener('click', (e) => {
      e.stopPropagation();
      filmIdx = (filmIdx + 1) % films.length;
      document.getElementById('btn-film').textContent = '🎞️ ' + films[filmIdx].name;
      updateFilters();
    });

    // 3. СІТКИ
    document.getElementById('btn-grid').addEventListener('click', (e) => {
      e.stopPropagation();
      gridIdx = (gridIdx + 1) % grids.length;
      renderGrid();
    });

    // 4. СЕНСОРИ (РІВЕНЬ І ДАЛЕКОМІР)
    window.addEventListener('deviceorientation', (e) => {
      const isLandscape = window.innerWidth > window.innerHeight;
      const roll = isLandscape ? (e.beta || 0) : (e.gamma || 0);
      const pitch = isLandscape ? (e.gamma || 0) : (e.beta || 0);

      if (isLevelActive) {
        levelLine.style.transform = 'rotate(' + roll + 'deg)';
        const isAligned = Math.abs(roll) <= 0.6;
        if (isAligned) {
          levelLine.classList.add('aligned');
          if (!wasAligned && hapticsEnabled && navigator.vibrate) navigator.vibrate(20);
          wasAligned = true;
        } else {
          levelLine.classList.remove('aligned');
          wasAligned = false;
        }
      }

      if (isRangeActive) {
        const declination = Math.max(1, 90 - Math.abs(pitch));
        const rad = declination * (Math.PI / 180);
        let dist = cameraHeight / Math.tan(rad);
        dist = Math.min(Math.max(dist, 0.5), 50.0);
        rangeText.textContent = 'DIST: ' + dist.toFixed(1) + ' m (H: ' + cameraHeight.toFixed(2) + 'm)';
      }
    }, true);

    document.getElementById('btn-level').addEventListener('click', (e) => {
      e.stopPropagation();
      isLevelActive = !isLevelActive;
      level.style.display = isLevelActive ? 'flex' : 'none';
      document.getElementById('btn-level').classList.toggle('active', isLevelActive);
    });

    document.getElementById('btn-range').addEventListener('click', (e) => {
      e.stopPropagation();
      isRangeActive = !isRangeActive;
      rangefinder.style.display = isRangeActive ? 'block' : 'none';
      document.getElementById('btn-range').classList.toggle('active', isRangeActive);
    });

    // 5. НАЛАШТУВАННЯ
    document.getElementById('btn-settings').addEventListener('click', (e) => {
      e.stopPropagation();
      settingsModal.style.display = 'flex';
    });
    document.getElementById('close-settings-btn').addEventListener('click', () => {
      settingsModal.style.display = 'none';
    });

    document.getElementById('ev-slider').addEventListener('input', (e) => {
      currentEV = parseFloat(e.target.value);
      document.getElementById('ev-val').textContent = (currentEV > 0 ? '+' : '') + currentEV.toFixed(1) + ' EV';
      updateFilters();
    });

    document.querySelectorAll('#height-group .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#height-group .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        cameraHeight = parseFloat(btn.getAttribute('data-h'));
      });
    });

    document.querySelectorAll('#haptic-group .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#haptic-group .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        hapticsEnabled = btn.getAttribute('data-haptic') === 'on';
      });
    });

    document.querySelectorAll('#focus-group .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#focus-group .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const dist = btn.getAttribute('data-dist');
        if (videoTrack && videoTrack.applyConstraints) {
          if (dist === 'auto') {
            videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
          } else {
            videoTrack.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: parseFloat(dist) }] }).catch(() => {});
          }
        }
      });
    });

    document.querySelectorAll('#iso-group .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#iso-group .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const val = btn.getAttribute('data-val');
        if (videoTrack && videoTrack.applyConstraints) {
          const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
          if (caps.iso) {
            videoTrack.applyConstraints({ advanced: [{ iso: val === 'auto' ? caps.iso.min : parseInt(val) }] }).catch(() => {});
          }
        }
      });
    });

    // 6. ЗЙОМКА (SNAP)
    function capturePhoto() {
      if (settingsModal.style.display === 'flex') return;

      shutter.classList.add('flash');
      setTimeout(() => shutter.classList.remove('flash'), 100);
      if (navigator.vibrate) navigator.vibrate([30, 20, 30]);

      const w = v.videoWidth || 1920;
      const h = v.videoHeight || 1080;
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(v, 0, 0, w, h);

      const activePreset = films[filmIdx];
