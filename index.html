<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam Pro</title>
  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      user-select: none; 
      -webkit-user-select: none; 
      -webkit-tap-highlight-color: transparent; 
    }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
    #v { width: 100vw; height: 100vh; object-fit: cover; display: none; }

    #btn-start {
      position: fixed; top: 45%; left: 50%; transform: translate(-50%, -50%);
      padding: 20px 32px; font-size: 17px; font-weight: bold; background: #ffb642;
      border: 3px solid #fff; border-radius: 12px; color: #000; z-index: 10000; cursor: pointer;
    }
    #debug-log {
      position: fixed; top: 58%; left: 5%; width: 90%; color: #39ff14;
      font-size: 13px; background: rgba(0,0,0,0.85); padding: 10px; border-radius: 6px;
      border: 1px solid #333; z-index: 10000; text-align: center;
    }

    #top-bar {
      position: fixed; top: 10px; left: 0; width: 100%; display: none;
      z-index: 999; background: rgba(0,0,0,0.8); padding: 8px 10px;
      overflow-x: auto; white-space: nowrap; gap: 8px;
      transition: all 0.3s ease;
    }
    #top-bar::-webkit-scrollbar { display: none; }

    .t-btn {
      display: inline-block; background: #222; color: #ffb642; border: 1px solid #ffb642;
      padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;
    }
    .t-btn.active { background: #39ff14; color: #000; border-color: #39ff14; font-weight: bold; }

    #control-strip {
      position: fixed; top: 56px; left: 0; width: 100%; display: none;
      justify-content: center; align-items: center; gap: 10px; z-index: 998;
      background: rgba(0,0,0,0.65); padding: 6px 12px;
    }
    .strip-label { font-size: 11px; color: #fff; font-weight: bold; }
    #ev-slider { accent-color: #ffb642; width: 140px; height: 20px; }
    #ev-label { font-size: 12px; color: #ffb642; min-width: 55px; text-align: right; font-weight: bold; }

    /* Рамка кадрування з підтримкою орієнтації */
    #frameline { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 40; display: none; }
    #frame-box {
      position: absolute; border: 1.5px solid rgba(255, 182, 66, 0.85);
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55); overflow: hidden;
      transition: width 0.2s ease, height 0.2s ease, top 0.2s ease, left 0.2s ease;
    }

    #grid { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 50; }
    .g-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
    .grid-v, .grid-h { position: absolute; background: rgba(255, 255, 255, 0.45); }
    .grid-v { top: 0; bottom: 0; width: 1px; }
    .grid-h { left: 0; right: 0; height: 1px; }
    .grid-svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; stroke: rgba(255,255,255,0.7); stroke-width: 1.5; fill: none; }
    .grid-sub { stroke: rgba(255,255,255,0.35); stroke-width: 1; stroke-dasharray: 6,6; fill: none; }
    .center-cross { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 36px; height: 36px; }
    .center-cross::before, .center-cross::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.8); }
    .center-cross::before { top: 17px; left: 0; width: 36px; height: 1px; }
    .center-cross::after { top: 0; left: 17px; width: 1px; height: 36px; }

    #rangefinder { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 60; display: none; }
    .rad-svg { width: 100%; height: 100%; filter: drop-shadow(0 0 4px #39ff14); }

    #stealth-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 20000; display: none; cursor: pointer; }
    #btn-stealth-exit { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); color: #888; padding: 8px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; }

    #hud {
      position: fixed; bottom: 30px; left: 0; width: 100%; display: none;
      justify-content: center; align-items: center; z-index: 999;
    }
    #btn-snap {
      width: 76px; height: 76px; border-radius: 50%; background: #ffb642;
      border: 4px solid #fff; box-shadow: 0 0 0 3px rgba(0,0,0,0.6); cursor: pointer;
    }

    /* Ландшафтне перемикання для зручності */
    @media (orientation: landscape) {
      #top-bar { top: 5px; padding: 4px 10px; width: auto; max-width: 80vw; left: 10px; border-radius: 6px; }
      #control-strip { top: 5px; right: 10px; left: auto; width: auto; border-radius: 6px; padding: 4px 10px; }
      #hud { bottom: 10px; right: 20px; width: auto; justify-content: flex-end; }
      #btn-snap { width: 64px; height: 64px; }
    }

    canvas { display: none; }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>

  <!-- Рамка кадрування -->
  <div id="frameline">
    <div id="frame-box"></div>
  </div>

  <!-- Сітки композиції -->
  <div id="grid">
    <div class="g-layer" id="layer-thirds">
      <div class="grid-v" style="left:33.33%;"></div>
      <div class="grid-v" style="left:66.66%;"></div>
      <div class="grid-h" style="top:33.33%;"></div>
      <div class="grid-h" style="top:66.66%;"></div>
    </div>
    <div class="g-layer" id="layer-golden">
      <div class="grid-v" style="left:38.2%;"></div>
      <div class="grid-v" style="left:61.8%;"></div>
      <div class="grid-h" style="top:38.2%;"></div>
      <div class="grid-h" style="top:61.8%;"></div>
    </div>
    <div class="g-layer" id="layer-center">
      <div class="center-cross"></div>
      <div class="grid-v" style="left:50%;"></div>
      <div class="grid-h" style="top:50%;"></div>
    </div>
    <div class="g-layer" id="layer-diagonals">
      <svg class="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
        <line x1="0" y1="0" x2="1000" y2="1000"></line>
        <line x1="1000" y1="0" x2="0" y2="1000"></line>
        <line x1="0" y1="1000" x2="500" y2="0" class="grid-sub"></line>
        <line x1="1000" y1="1000" x2="500" y2="0" class="grid-sub"></line>
        <line x1="0" y1="0" x2="500" y2="1000" class="grid-sub"></line>
        <line x1="1000" y1="0" x2="500" y2="1000" class="grid-sub"></line>
      </svg>
    </div>
    <div class="g-layer" id="layer-fibonacci">
      <svg class="grid-svg" viewBox="0 0 618 1000" preserveAspectRatio="none">
        <path d="M 0,0 A 618,618 0 0,1 618,618 A 382,382 0 0,1 236,1000 A 236,236 0 0,1 0,764 A 146,146 0 0,1 146,618 A 90,90 0 0,1 236,708 A 56,56 0 0,1 180,764"></path>
        <line x1="0" y1="618" x2="618" y2="618" class="grid-sub"></line>
        <line x1="236" y1="618" x2="236" y2="1000" class="grid-sub"></line>
        <line x1="0" y1="764" x2="236" y2="764" class="grid-sub"></line>
        <line x1="146" y1="618" x2="146" y2="764" class="grid-sub"></line>
      </svg>
    </div>
  </div>

  <!-- Далекомір -->
  <div id="rangefinder">
    <svg class="rad-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <line x1="160" y1="120" x2="240" y2="120" stroke="#39ff14" stroke-width="3"></line>
      <line x1="160" y1="880" x2="240" y2="880" stroke="#39ff14" stroke-width="3"></line>
      <text x="100" y="505" fill="#39ff14" font-size="16" font-weight="bold" font-family="monospace">1.2m</text>
      <circle cx="200" cy="210" r="45" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" fill="none"></circle>
      <line x1="200" y1="255" x2="200" y2="560" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4"></line>
      <line x1="140" y1="350" x2="260" y2="350" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4"></line>
      <line x1="200" y1="560" x2="150" y2="880" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4"></line>
      <line x1="200" y1="560" x2="250" y2="880" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4"></line>

      <line x1="470" y1="260" x2="530" y2="260" stroke="#39ff14" stroke-width="3"></line>
      <line x1="470" y1="740" x2="530" y2="740" stroke="#39ff14" stroke-width="3"></line>
      <text x="545" y="505" fill="#39ff14" font-size="16" font-weight="bold" font-family="monospace">2.0m</text>
      <circle cx="500" cy="315" r="26" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" fill="none"></circle>
      <line x1="500" y1="341" x2="500" y2="540" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4"></line>
      <line x1="460" y1="400" x2="540" y2="400" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4"></line>
      <line x1="500" y1="540" x2="470" y2="740" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4"></line>
      <line x1="500" y1="540" x2="530" y2="740" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4"></line>

      <line x1="750" y1="340" x2="790" y2="340" stroke="#39ff14" stroke-width="3"></line>
      <line x1="750" y1="660" x2="790" y2="660" stroke="#39ff14" stroke-width="3"></line>
      <text x="805" y="505" fill="#39ff14" font-size="16" font-weight="bold" font-family="monospace">3.0m</text>
      <circle cx="770" cy="375" r="18" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4" fill="none"></circle>
      <line x1="770" y1="393" x2="770" y2="535" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4"></line>
      <line x1="740" y1="440" x2="800" y2="440" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4"></line>
      <line x1="770" y1="535" x2="745" y2="660" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4"></line>
      <line x1="770" y1="535" x2="795" y2="660" stroke="#39ff14" stroke-width="1.5" stroke-dasharray="4,4"></line>
    </svg>
  </div>

  <!-- Стелс екран -->
  <div id="stealth-overlay" onclick="takeSnapshot(true)">
    <button id="btn-stealth-exit" onclick="exitStealth(event)">✕ EXIT</button>
  </div>

  <button id="btn-start">▶ УВІМКНУТИ КАМЕРУ</button>
  <div id="debug-log">Готово до запуску.</div>

  <!-- Верхня панель інструментів -->
  <div id="top-bar">
    <button class="t-btn" id="film-btn" onclick="nextFilm()">🎞️ Tri-X 400</button>
    <button class="t-btn" id="frame-btn" onclick="nextFrame()">📐 Full</button>
    <button class="t-btn" id="focus-btn" onclick="nextFocus()">🔍 Фокус: Auto</button>
    <button class="t-btn" id="grid-btn" onclick="nextGrid()">🌐 Сітка: Вимк</button>
    <button class="t-btn" id="range-btn" onclick="toggleRange()">🎯 Далекомір</button>
    <button class="t-btn" id="stealth-btn" onclick="enterStealth()">🕶️ Стелс</button>
  </div>

  <!-- Смуга експозиції (EV) -->
  <div id="control-strip">
    <span class="strip-label">EV:</span>
    <input type="range" id="ev-slider" min="-2.0" max="2.0" step="0.2" value="0.0" oninput="setEV(this.value)">
    <span id="ev-label">0.0 EV</span>
  </div>

  <!-- Кнопка спуску -->
  <div id="hud">
    <button id="btn-snap" onclick="takeSnapshot(false)"></button>
  </div>

  <canvas id="c"></canvas>

  <script>
    var v = document.getElementById('v');
    var btnStart = document.getElementById('btn-start');
    var debugLog = document.getElementById('debug-log');
    var topBar = document.getElementById('top-bar');
    var controlStrip = document.getElementById('control-strip');
    var evSlider = document.getElementById('ev-slider');
    var evLabel = document.getElementById('ev-label');
    var filmBtn = document.getElementById('film-btn');
    var frameBtn = document.getElementById('frame-btn');
    var focusBtn = document.getElementById('focus-btn');
    var gridBtn = document.getElementById('grid-btn');
    var rangeBtn = document.getElementById('range-btn');
    var frameline = document.getElementById('frameline');
    var frameBox = document.getElementById('frame-box');
    var rangeEl = document.getElementById('rangefinder');
    var stealthEl = document.getElementById('stealth-overlay');
    var hud = document.getElementById('hud');
    var c = document.getElementById('c');

    var activeStream = null;

    var films = [
      { name: 'Tri-X 400', mode: 'bw', contrast: 1.5, base: 'grayscale(100%) contrast(150%)' },
      { name: 'T-Max 3200', mode: 'bw', contrast: 1.9, base: 'grayscale(100%) contrast(190%)' },
      { name: 'HP5 Plus', mode: 'bw', contrast: 1.25, base: 'grayscale(100%) contrast(125%)' },
      { name: 'Neopan 100', mode: 'bw', contrast: 1.35, base: 'grayscale(100%) contrast(135%)' },
      { name: 'Aerochrome', mode: 'aero', contrast: 1.4, base: 'hue-rotate(180deg) saturate(220%) contrast(135%)' },
      { name: 'Portra 400', mode: 'color', contrast: 1.1, base: 'saturate(85%) contrast(110%) sepia(15%)' },
      { name: 'Cinestill 800T', mode: 'color', contrast: 1.3, base: 'saturate(120%) contrast(130%) hue-rotate(190deg)' }
    ];
    var fIdx = 0;
    var currentEV = 0.0;

    var frames = [
      { name: 'Full', ratio: null },
      { name: '3:2 (35mm)', ratio: 2/3 },
      { name: '4:3 (645)', ratio: 3/4 },
      { name: '1:1 (6x6)', ratio: 1.0 },
      { name: '65:24 (XPan)', ratio: 65/24 }
    ];
    var rIdx = 0;

    var focusZones = [
      { name: 'Auto', val: 'auto' },
      { name: '0.7m', val: 0.7 },
      { name: '1.0m', val: 1.0 },
      { name: '1.5m', val: 1.5 },
      { name: '2.0m', val: 2.0 },
      { name: '2.5m', val: 2.5 },
      { name: '3.0m', val: 3.0 },
      { name: '3.5m', val: 3.5 },
      { name: '5.0m', val: 5.0 },
      { name: '∞', val: 100.0 }
    ];
    var focusIdx = 0;

    var layerIds = ['none', 'layer-thirds', 'layer-golden', 'layer-diagonals', 'layer-fibonacci', 'layer-center'];
    var gridLabels = [
      '🌐 Сітка: Вимк',
      '🌐 Третини',
      '🌐 Золотий перетин',
      '🌐 Діагоналі',
      '🌐 Фібоначчі',
      '🌐 Центр'
    ];
    var gIdx = 0;
    var isRangeOn = false;

    function initCam() {
      debugLog.innerText = 'Запит сенсора у високій якості...';

      navigator.mediaDevices.getUserMedia({
        video: { 
          facingMode: { ideal: 'environment' },
          width: { ideal: 3840 },
          height: { ideal: 2160 }
        },
        audio: false
      })
      .then(function(stream) {
        activeStream = stream;
        v.srcObject = stream;
        v.play();
        v.style.display = 'block';

        btnStart.style.display = 'none';
        debugLog.style.display = 'none';
        topBar.style.display = 'flex';
        controlStrip.style.display = 'flex';
        hud.style.display = 'flex';

        applyFilm();
        renderLayout();
      })
      .catch(function(err) {
        debugLog.innerText = 'Помилка: ' + (err.message || err.name);
      });
    }

    btnStart.addEventListener('click', initCam);
    window.initCam = initCam;

    function applyFilm() {
      var bFactor = Math.pow(2, currentEV);
      v.style.filter = films[fIdx].base + ' brightness(' + (bFactor * 100) + '%)';
    }

    function setEV(val) {
      currentEV = parseFloat(val);
      evLabel.textContent = (currentEV > 0 ? '+' : '') + currentEV.toFixed(1) + ' EV';
      applyFilm();
    }

    function nextFilm() {
      fIdx = (fIdx + 1) % films.length;
      filmBtn.textContent = '🎞️ ' + films[fIdx].name;
      applyFilm();
    }

    function nextFrame() {
      rIdx = (rIdx + 1) % frames.length;
      frameBtn.textContent = '📐 ' + frames[rIdx].name;
      renderLayout();
    }

    function renderLayout() {
      var cur = frames[rIdx];
      if (!cur.ratio) {
        frameline.style.display = 'none';
        return;
      }
      frameline.style.display = 'block';

      var winW = window.innerWidth;
      var winH = window.innerHeight;
      var isLandscape = winW > winH;

      var targetW, targetH;

      if (!isLandscape) {
        // Портретна орієнтація
        targetH = winH * 0.8;
        targetW = targetH * (cur.ratio < 1 ? cur.ratio : 1 / cur.ratio);
        if (targetW > winW * 0.95) {
          targetW = winW * 0.95;
          targetH = targetW / (cur.ratio < 1 ? cur.ratio : 1 / cur.ratio);
        }
      } else {
        // Альбомна (горизонтальна) орієнтація
        targetW = winW * 0.75;
        targetH = targetW / cur.ratio;
        if (targetH > winH * 0.9) {
          targetH = winH * 0.9;
          targetW = targetH * cur.ratio;
        }
      }

      frameBox.style.width = Math.round(targetW) + 'px';
      frameBox.style.height = Math.round(targetH) + 'px';
      frameBox.style.top = Math.round((winH - targetH) / 2) + 'px';
      frameBox.style.left = Math.round((winW - targetW) / 2) + 'px';
    }

    window.addEventListener('resize', renderLayout);

    function nextFocus() {
      focusIdx = (focusIdx + 1) % focusZones.length;
      var zone = focusZones[focusIdx];
      focusBtn.textContent = '🔍 Фокус: ' + zone.name;

      if (activeStream) {
        var track = activeStream.getVideoTracks()[0];
        if (track && track.applyConstraints) {
          if (zone.val === 'auto') {
            track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function(){});
          } else {
            track.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: zone.val }] }).catch(function(){});
          }
        }
      }
    }

    function nextGrid() {
      gIdx = (gIdx + 1) % layerIds.length;
      gridBtn.textContent = gridLabels[gIdx];

      for (var i = 1; i < layerIds.length; i++) {
        var el = document.getElementById(layerIds[i]);
        if (el) el.style.display = 'none';
      }
      if (layerIds[gIdx] !== 'none') {
        var activeEl = document.getElementById(layerIds[gIdx]);
        if (activeEl) activeEl.style.display = 'block';
      }
    }

    function toggleRange() {
      isRangeOn = !isRangeOn;
      rangeEl.style.display = isRangeOn ? 'block' : 'none';
      rangeBtn.classList.toggle('active', isRangeOn);
    }

    function enterStealth() {
      stealthEl.style.display = 'block';
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function exitStealth(e) {
      if (e) e.stopPropagation();
      stealthEl.style.display = 'none';
      if (navigator.vibrate) navigator.vibrate([20, 20]);
    }

    function takeSnapshot(isSilent) {
      if (navigator.vibrate) navigator.vibrate(isSilent ? 40 : 30);

      var rawW = v.videoWidth || 1920;
      var rawH = v.videoHeight || 1080;
      var curFrame = frames[rIdx];

      var streamW = Math.min(rawW, rawH);
      var streamH = Math.max(rawW, rawH);

      var cropW = streamW;
      var cropH = streamH;
      var cropX = 0;
      var cropY = 0;

      if (curFrame.ratio) {
        var targetRatio = curFrame.ratio;
        var currentStreamRatio = streamW / streamH;

        if (currentStreamRatio > targetRatio) {
          cropH = streamH;
          cropW = Math.round(streamH * targetRatio);
          cropX = Math.round((streamW - cropW) / 2);
        } else {
          cropW = streamW;
          cropH = Math.round(streamW / targetRatio);
          cropY = Math.round((streamH - cropH) / 2);
        }
      }

      c.width = cropW;
      c.height = cropH;

      var ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';

      var bFactor = Math.pow(2, currentEV);
      var curFilm = films[fIdx];

      if (rawW > rawH) {
        ctx.drawImage(v, (rawW - cropW) / 2, (rawH - cropH) / 2, cropW, cropH, 0, 0, cropW, cropH);
      } else {
        ctx.drawImage(v, cropX, cropY, cropW, cropH, 0, 0, cropW, cropH);
      }

      if (curFilm.mode === 'bw') {
        var imgData = ctx.getImageData(0, 0, cropW, cropH);
        var d = imgData.data;
        var contrast = curFilm.contrast;
        for (var i = 0; i < d.length; i += 4) {
          var gray = (0.299 * d[i] + 0.587 * d[i+1] + 0.114 * d[i+2]) * bFactor;
          gray = ((gray - 12
