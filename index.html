<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
      height: 100vh;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    /* Відео видошукача */
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      filter: grayscale(100%) contrast(150%);
    }

    /* Стартова кнопка */
    #btn-start {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      padding: 20px 40px;
      font-size: 16px;
      font-weight: bold;
      background: #ffb642;
      border: 2px solid #fff;
      border-radius: 10px;
      color: #000;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 182, 66, 0.9);
    }

    /* Верхня панель HUD */
    #hud {
      position: fixed;
      top: 10px;
      left: 0;
      width: 100%;
      display: none;
      justify-content: space-around;
      align-items: center;
      padding: 6px 4px;
      z-index: 500;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(4px);
    }
    .hud-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #eee;
      padding: 6px 7px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    .hud-btn.active {
      background: rgba(255, 182, 66, 0.3);
      border-color: #ffb642;
      color: #ffb642;
    }

    /* Сітки */
    #grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }
    .grid-v, .grid-h {
      position: absolute;
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 1px rgba(0, 0, 0, 0.8);
    }
    .grid-v { top: 0; bottom: 0; width: 1px; }
    .grid-h { left: 0; right: 0; height: 1px; }

    .grid-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      stroke: rgba(255, 255, 255, 0.45);
      stroke-width: 1.5;
      fill: none;
    }
    .center-cross {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
    }
    .center-cross::before, .center-cross::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
    }
    .center-cross::before { top: 15px; left: 0; width: 32px; height: 1px; }
    .center-cross::after { top: 0; left: 15px; width: 1px; height: 32px; }

    /* Рівень */
    #level {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 240px;
      height: 24px;
      pointer-events: none;
      z-index: 60;
      display: none;
      align-items: center;
      justify-content: center;
    }
    #level-line {
      width: 100%;
      height: 2.5px;
      background: #ffb642;
      box-shadow: 0 0 10px rgba(255, 182, 66, 0.95);
      transform-origin: center center;
    }
    #level-line.aligned {
      height: 3.5px;
      background: #ffe082;
      box-shadow: 0 0 20px rgba(255, 182, 66, 1);
    }

    /* Далекомір */
    #rangefinder {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 70;
      display: none;
    }
    #range-text {
      position: absolute;
      top: 54px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1.5px solid #ffb642;
      color: #ffb642;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      white-space: nowrap;
    }
    .stadia-svg {
      width: 100%;
      height: 100%;
      stroke: #ffb642;
      stroke-width: 2;
      fill: none;
    }
    .stadia-label {
      fill: #ffb642;
      font-size: 16px;
      font-weight: bold;
      font-family: monospace;
    }

    /* Спалах затвора */
    #shutter {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease-out;
    }
    #shutter.flash {
      opacity: 0.9;
    }

    /* Модальне вікно налаштувань */
    #settings-modal {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(12, 12, 12, 0.97);
      border-top: 1px solid #333;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 900;
      max-height: 80vh;
      overflow-y: auto;
    }
    .setting-title {
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
    }
    .setting-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .opt-btn {
      padding: 8px 4px;
      background: #1e1e1e;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      font-family: monospace;
    }
    .opt-btn.active {
      background: #fff;
      color: #000;
      font-weight: bold;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type=range] {
      flex: 1;
      accent-color: #ffb642;
      height: 4px;
    }
    #close-settings-btn {
      width: 100%;
      padding: 12px;
      background: #222;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  
  <div id="grid"></div>
  
  <div id="level">
    <div id="level-line"></div>
  </div>

  <div id="rangefinder">
    <div id="range-text">DIST: -- m (H: 1.60m)</div>
    <svg class="stadia-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <line x1="390" y1="120" x2="430" y2="120" />
      <line x1="390" y1="880" x2="430" y2="880" />
      <text x="320" y="505" class="stadia-label">1.2m</text>
      
      <line x1="440" y1="260" x2="470" y2="260" />
      <line x1="440" y1="740" x2="470" y2="740" />
      <text x="390" y="505" class="stadia-label">2.0m</text>

      <line x1="475" y1="340" x2="495" y2="340" />
      <line x1="475" y1="660" x2="495" y2="660" />
      <text x="515" y="505" class="stadia-label">3.0m</text>
    </svg>
  </div>

  <div id="shutter"></div>

  <button id="btn-start" onclick="startApp()">▶ УВІМКНУТИ КАМЕРУ</button>

  <div id="hud">
    <button class="hud-btn" id="btn-snap" onclick="capturePhoto(event)">📷 SNAP</button>
    <button class="hud-btn" id="btn-film" onclick="nextFilm(event)">🎞️ Tri-X 400</button>
    <button class="hud-btn" id="btn-grid" onclick="nextGrid(event)">🌐 Третини</button>
    <button class="hud-btn" id="btn-level" onclick="toggleLevel(event)">🧭 Рівень</button>
    <button class="hud-btn" id="btn-range" onclick="toggleRange(event)">🎯 Далекомір</button>
    <button class="hud-btn" id="btn-settings" onclick="openSettings(event)">⚙️</button>
  </div>

  <div id="settings-modal">
    <div>
      <div class="setting-title">ВИСОТА ЗЙОМКИ</div>
      <div class="setting-grid" style="grid-template-columns: repeat(2, 1fr);" id="height-group">
        <button class="opt-btn active" onclick="setHeight(1.6, this)">👁️ Очі (1.60 м)</button>
        <button class="opt-btn" onclick="setHeight(1.3, this)">🥋 Пояс (1.30 м)</button>
      </div>
    </div>

    <div>
      <div class="setting-title">ЕКСПОКОРЕКЦІЯ (EV)</div>
      <div class="slider-container">
        <input type="range" id="ev-slider" min="-2.0" max="2.0" step="0.1" value="0.0" oninput="changeEV(this.value)">
        <span id="ev-val" style="min-width: 45px; color: #ffb642;">0.0 EV</span>
      </div>
    </div>

    <div>
      <div class="setting-title">ЗОННЕ ФОКУСУВАННЯ LEICA</div>
      <div class="setting-grid" id="focus-group">
        <button class="opt-btn active" onclick="setFocus('auto', this)">AF Auto</button>
        <button class="opt-btn" onclick="setFocus(0.7, this)">0.7 m</button>
        <button class="opt-btn" onclick="setFocus(1.2, this)">1.2 m</button>
        <button class="opt-btn" onclick="setFocus(2.0, this)">2.0 m</button>
        <button class="opt-btn" onclick="setFocus(3.0, this)">3.0 m</button>
        <button class="opt-btn" onclick="setFocus(5.0, this)">5.0 m</button>
        <button class="opt-btn" onclick="setFocus(100.0, this)" style="grid-column: span 2;">∞ Нескінченність</button>
      </div>
    </div>

    <button id="close-settings-btn" onclick="closeSettings()">Закрити налаштування</button>
  </div>

  <canvas id="c"></canvas>

  <script>
    var v = document.getElementById('v');
    var hud = document.getElementById('hud');
    var btnStart = document.getElementById('btn-start');
    var grid = document.getElementById('grid');
    var level = document.getElementById('level');
    var levelLine = document.getElementById('level-line');
    var rangefinder = document.getElementById('rangefinder');
    var rangeText = document.getElementById('range-text');
    var shutter = document.getElementById('shutter');
    var canvas = document.getElementById('c');
    var settingsModal = document.getElementById('settings-modal');

    var videoTrack = null;
    var isLevelActive = false;
    var isRangeActive = false;
    var cameraHeight = 1.60;
    var currentEV = 0.0;

    var films = [
      { name: 'Tri-X 400', isBW: true, contrast: 1.55 },
      { name: 'HP5 Plus', isBW: true, contrast: 1.25 },
      { name: 'T-Max 3200', isBW: true, contrast: 1.90 },
      { name: 'Neopan 100', isBW: true, contrast: 1.35 },
      { name: 'Portra 400', isBW: false, filter: 'saturate(85%) contrast(110%) sepia(10%)' },
      { name: 'Cinestill 800T', isBW: false, filter: 'saturate(115%) contrast(130%) hue-rotate(190deg) sepia(15%)' }
    ];
    var filmIdx = 0;

    var grids = ['thirds', 'golden', 'fibonacci', 'diagonals', 'center', 'off'];
    var gridNames = {
      'thirds': '🌐 Третини',
      'golden': '🌐 Золотий перетин',
      'fibonacci': '🌐 Спіраль Фібоначчі',
      'diagonals': '🌐 Діагоналі',
      'center': '🌐 Центр',
      'off': '🌐 Сітка: Вимк'
    };
    var gridIdx = 0;

    function applyFilter() {
      var brightnessFactor = Math.pow(2, currentEV);
      var preset = films[filmIdx];
      if (preset.isBW) {
        v.style.filter = 'grayscale(100%) contrast(' + (preset.contrast * 100) + '%) brightness(' + (brightnessFactor * 100) + '%)';
      } else {
        v.style.filter = preset.filter + ' brightness(' + (brightnessFactor * 100) + '%)';
      }
    }

    function renderGrid() {
      var mode = grids[gridIdx];
      document.getElementById('btn-grid').textContent = gridNames[mode];
      grid.innerHTML = '';

      if (mode === 'thirds') {
        grid.innerHTML = '<div class="grid-v" style="left:33.33%;"></div><div class="grid-v" style="left:66.66%;"></div><div class="grid-h" style="top:33.33%;"></div><div class="grid-h" style="top:66.66%;"></div>';
      } else if (mode === 'golden') {
        grid.innerHTML = '<div class="grid-v" style="left:38.2%;"></div><div class="grid-v" style="left:61.8%;"></div><div class="grid-h" style="top:38.2%;"></div><div class="grid-h" style="top:61.8%;"></div>';
      } else if (mode === 'fibonacci') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 618" preserveAspectRatio="none"><path d="M 0,618 A 618,618 0 0,1 618,0 A 382,382 0 0,1 1000,382 A 236,236 0 0,1 764,618 A 146,146 0 0,1 618,472 A 90,90 0 0,1 708,382 A 56,56 0 0,1 764,438 A 34,34 0 0,1 730,472" /><line x1="618" y1="0" x2="618" y2="618" stroke="rgba(255,255,255,0.25)" /><line x1="618" y1="382" x2="1000" y2="382" stroke="rgba(255,255,255,0.25)" /><line x1="764" y1="382" x2="764" y2="618" stroke="rgba(255,255,255,0.25)" /></svg>';
      } else if (mode === 'diagonals') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><line x1="0" y1="0" x2="1000" y2="1000" /><line x1="1000" y1="0" x2="0" y2="1000" /><line x1="0" y1="500" x2="500" y2="0" stroke="rgba(255,255,255,0.25)" /><line x1="500" y1="1000" x2="1000" y2="500" stroke="rgba(255,255,255,0.25)" /></svg>';
      } else if (mode === 'center') {
        grid.innerHTML = '<div class="center-cross"></div><div class="grid-v" style="left:50%;"></div><div class="grid-h" style="top:50%;"></div>';
      }
    }

    window.startApp = function() {
      navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: "environment" } },
        audio: false
      }).then(function(stream) {
        v.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        v.play();
        btnStart.style.display = 'none';
        hud.style.display = 'flex';
        renderGrid();
        applyFilter();
      }).catch(function(err) {
        alert("Помилка камери: " + err.message);
      });
    };

    window.nextFilm = function(e) {
      if (e) e.stopPropagation();
      filmIdx = (filmIdx + 1) % films.length;
      document.getElementById('btn-film').textContent = '🎞️ ' + films[filmIdx].name;
      applyFilter();
    };

    window.nextGrid = function(e) {
      if (e) e.stopPropagation();
      gridIdx = (gridIdx + 1) % grids.length;
      renderGrid();
    };

    window.toggleLevel = function(e) {
      if (e) e.stopPropagation();
      isLevelActive = !isLevelActive;
      level.style.display = isLevelActive ? 'flex' : 'none';
      document.getElementById('btn-level').classList.toggle('active', isLevelActive);
    };

    window.toggleRange = function(e) {
      if (e) e.stopPropagation();
      isRangeActive = !isRangeActive;
      rangefinder.style.display = isRangeActive ? 'block' : 'none';
      document.getElementById('btn-range').classList.toggle('active', isRangeActive);
    };

    window.openSettings = function(e) {
      if (e) e.stopPropagation();
      settingsModal.style.display = 'flex';
    };

    window.closeSettings = function() {
      settingsModal.style.display = 'none';
    };

    window.changeEV = function(val) {
      currentEV = parseFloat(val);
      document.getElementById('ev-val').textContent = (currentEV > 0 ? '+' : '') + currentEV.toFixed(1) + ' EV';
      applyFilter();
    };

    window.setHeight = function(h, btn) {
      document.querySelectorAll('#height-group .opt-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      cameraHeight = parseFloat(h);
    };

    window.setFocus = function(dist, btn) {
      document.querySelectorAll('#focus-group .opt-btn').forEach(function(b) { b.classList.remove('active'); });
      btn.classList.add('active');
      if (videoTrack && videoTrack.applyConstraints) {
        if (dist === 'auto') {
          videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(function(){});
        } else {
          videoTrack.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: parseFloat(dist) }] }).catch(function(){});
        }
      }
    };

    window.addEventListener('deviceorientation', function(e) {
      var isLandscape = window.innerWidth > window.innerHeight;
      var roll = isLandscape ? (e.beta || 0) : (e.gamma || 0);
      var pitch = isLandscape ? (e.gamma || 0) : (e.beta || 0);

      if (isLevelActive) {
        levelLine.style.transform = 'rotate(' + roll + 'deg)';
        if (Math.abs(roll) <= 0.6) {
          levelLine.classList.add('aligned');
        } else {
          levelLine.classList.remove('aligned');
        }
      }

      if (isRangeActive) {
        var declination = Math.max(1, 90 - Math.abs(pitch));
        var rad = declination * (Math.PI / 180);
        var dist = cameraHeight / Math.tan(rad);
        dist = Math.min(Math.max(dist, 0.5), 50.0);
        rangeText.textContent = 'DIST: ' + dist.toFixed(1) + ' m (H: ' + cameraHeight.toFixed(2) + 'm)';
      }
    }, true);

    window.capturePhoto = function(e) {
      if (e) e.stopPropagation();
      if (settingsModal.style.display === 'flex') return;

      shutter.classList.add('flash');
      setTimeout(function() { shutter.classList.remove('flash'); }, 100);
      if (navigator.vibrate) navigator.vibrate([30, 20, 30]);

      var w = v.videoWidth || 1920;
      var h = v.videoHeight || 1080;
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(v, 0, 0, w, h);

      var activePreset = films[filmIdx];
      var evFactor = Math.pow(2, currentEV);

      if (activePreset.isBW) {
        var imgData = ctx.getImageData(0, 0, w, h);
        var d = imgData.data;
        var contrast = activePreset.contrast || 1.45;

        for (var i = 0; i < d.length; i += 4) {
          var r = d[i] * evFactor;
          var g = d[i + 1] * evFactor;
          var b = d[i + 2] * evFactor;

          var y = 0.299 * r + 0.587 * g + 0.114 * b;
          y = ((y / 255 - 0.5) * contrast + 0.5) * 255;
          y = Math.min(255, Math.max(0, y));

          d[i] = y; d[i + 1] = y; d[i + 2] = y;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      canvas.toBlob(function(blob) {
        if (!blob) return;
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = 'STREET_' + activePreset.name.replace(/\s+/g, '') + '_' + Date.now() + '.jpg';
        a.click();
        setTimeout(function() { URL.revokeObjectURL(url); }, 500);
      }, 'image/jpeg', 0.98);
    };

    v.addEventListener('click', window.capturePhoto);
  </script>
</body>
</html>
