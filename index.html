<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: monospace;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    #viewfinder-box {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* Стартова кнопка */
    #btn-start {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 1000;
      padding: 20px 32px;
      font-size: 16px;
      font-weight: bold;
      background: #ffb642;
      border: 2px solid #fff;
      border-radius: 10px;
      color: #000;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(255, 182, 66, 0.8);
      text-align: center;
    }

    /* Верхня панель HUD */
    #hud {
      position: fixed;
      top: env(safe-area-inset-top, 8px);
      left: 0;
      width: 100%;
      display: none;
      justify-content: space-around;
      align-items: center;
      padding: 6px 2px;
      z-index: 500;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
    }
    .hud-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #eee;
      padding: 6px 6px;
      border-radius: 4px;
      font-size: 10.5px;
      cursor: pointer;
      white-space: nowrap;
    }
    .hud-btn.active {
      background: rgba(255, 182, 66, 0.3);
      border-color: #ffb642;
      color: #ffb642;
    }

    /* Сітки композиції */
    #grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50;
    }
    .grid-v, .grid-h {
      position: absolute;
      background: rgba(255, 255, 255, 0.35);
    }
    .grid-v { top: 0; bottom: 0; width: 1px; }
    .grid-h { left: 0; right: 0; height: 1px; }

    .grid-svg {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      stroke: rgba(255, 255, 255, 0.45);
      stroke-width: 1.5;
      fill: none;
    }
    .center-cross {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 32px;
      height: 32px;
    }
    .center-cross::before, .center-cross::after {
      content: '';
      position: absolute;
      background: rgba(255, 255, 255, 0.6);
    }
    .center-cross::before { top: 15px; left: 0; width: 32px; height: 1px; }
    .center-cross::after { top: 0; left: 15px; width: 1px; height: 32px; }

    /* Далекомір */
    #rangefinder {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 70;
      display: none;
    }
    #range-text {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.85);
      border: 1.5px solid #ffb642;
      color: #ffb642;
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: bold;
      white-space: nowrap;
    }
    .stadia-svg {
      width: 100%;
      height: 100%;
      stroke: #ffb642;
      stroke-width: 2;
      fill: none;
    }
    .stadia-label {
      fill: #ffb642;
      font-size: 15px;
      font-weight: bold;
      font-family: monospace;
    }

    /* Затвор */
    #shutter {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #000;
      z-index: 800;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.08s ease-out;
    }
    #shutter.flash {
      opacity: 0.9;
    }

    /* Стелс-режим */
    #stealth-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 950;
      display: none;
      cursor: pointer;
    }
    #btn-stealth-exit {
      position: absolute;
      top: env(safe-area-inset-top, 14px);
      right: 14px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.7);
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      z-index: 960;
    }

    /* Меню налаштувань */
    #settings-modal {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: rgba(15, 15, 15, 0.98);
      border-top: 1px solid #333;
      padding: 16px;
      display: none;
      flex-direction: column;
      gap: 12px;
      z-index: 900;
      max-height: 85vh;
      overflow-y: auto;
    }
    .setting-title {
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .setting-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .opt-btn {
      padding: 8px 4px;
      background: #222;
      color: #aaa;
      border: 1px solid #333;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
      font-family: monospace;
    }
    .opt-btn.active {
      background: #fff;
      color: #000;
      font-weight: bold;
    }
    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    input[type=range] {
      flex: 1;
      accent-color: #ffb642;
    }
    #close-settings-btn {
      width: 100%;
      padding: 12px;
      background: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>
  <div id="viewfinder-box">
    <video id="v" autoplay playsinline muted onclick="takePhoto(false)"></video>
  </div>
  
  <div id="grid"></div>

  <div id="rangefinder">
    <div id="range-text">DIST: -- m</div>
    <svg class="stadia-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
      <line x1="390" y1="120" x2="430" y2="120" />
      <line x1="390" y1="880" x2="430" y2="880" />
      <text x="320" y="505" class="stadia-label">1.2m</text>
      
      <line x1="440" y1="260" x2="470" y2="260" />
      <line x1="440" y1="740" x2="470" y2="740" />
      <text x="390" y="505" class="stadia-label">2.0m</text>

      <line x1="475" y1="340" x2="495" y2="340" />
      <line x1="475" y1="660" x2="495" y2="660" />
      <text x="515" y="505" class="stadia-label">3.0m</text>
    </svg>
  </div>

  <div id="shutter"></div>

  <!-- Стелс-оверлей -->
  <div id="stealth-overlay" onclick="takePhoto(true)">
    <button id="btn-stealth-exit" onclick="exitStealth(event)">✕ EXIT</button>
  </div>

  <button id="btn-start" onclick="startApp()">▶ УВІМКНУТИ КАМЕРУ</button>

  <div id="hud">
    <button class="hud-btn" id="btn-lang" onclick="toggleLang()">🌐 UA</button>
    <button class="hud-btn" id="btn-snap" onclick="takePhoto(false)">📷 СПУСК</button>
    <button class="hud-btn" id="btn-film" onclick="nextFilm()">🎞️ Tri-X</button>
    <button class="hud-btn" id="btn-grid" onclick="nextGrid()">🌐 Сітка</button>
    <button class="hud-btn" id="btn-range" onclick="toggleRange()">🎯 Далекомір</button>
    <button class="hud-btn" id="btn-stealth" onclick="enterStealth()">🕶️ Стелс</button>
    <button class="hud-btn" id="btn-settings" onclick="openSettings()">⚙️</button>
  </div>

  <div id="settings-modal">
    <div>
      <div class="setting-title" id="t-shooting-height">ВИСОТА ТОЧКИ ЗЙОМКИ</div>
      <div class="setting-grid" style="grid-template-columns: repeat(2, 1fr);" id="height-group">
        <button class="opt-btn active" onclick="setHeight(1.6, this)" id="opt-eye">👁️ Рівень очей (1.60м)</button>
        <button class="opt-btn" onclick="setHeight(1.3, this)" id="opt-hip">🥋 Рівень пояса (1.30м)</button>
      </div>
    </div>

    <div>
      <div class="setting-title" id="t-ev">ЕКСПОКОРЕКЦІЯ (EV)</div>
      <div class="slider-container">
        <input type="range" id="ev-slider" min="-2.0" max="2.0" step="0.1" value="0.0" oninput="setEV(this.value)">
        <span id="ev-val" style="min-width: 45px; color: #ffb642;">0.0 EV</span>
      </div>
    </div>

    <div>
      <div class="setting-title" id="t-zone-focus">ЗОННЕ ФОКУСУВАННЯ LEICA</div>
      <div class="setting-grid" id="focus-group">
        <button class="opt-btn active" onclick="setFocus('auto', this)">AF Auto</button>
        <button class="opt-btn" onclick="setFocus('0.7', this)">0.7 m</button>
        <button class="opt-btn" onclick="setFocus('1.2', this)">1.2 m</button>
        <button class="opt-btn" onclick="setFocus('2.0', this)">2.0 m</button>
        <button class="opt-btn" onclick="setFocus('3.0', this)">3.0 m</button>
        <button class="opt-btn" onclick="setFocus('5.0', this)">5.0 m</button>
        <button class="opt-btn" onclick="setFocus('100.0', this)" id="opt-inf" style="grid-column: span 2;">∞ Нескінченність</button>
      </div>
    </div>

    <button id="close-settings-btn" onclick="closeSettings()">Закрити</button>
  </div>

  <canvas id="c"></canvas>

  <script>
    const v = document.getElementById('v');
    const btnStart = document.getElementById('btn-start');
    const hud = document.getElementById('hud');
    const grid = document.getElementById('grid');
    const rangefinder = document.getElementById('rangefinder');
    const rangeText = document.getElementById('range-text');
    const shutter = document.getElementById('shutter');
    const canvas = document.getElementById('c');
    const settingsModal = document.getElementById('settings-modal');
    const stealthOverlay = document.getElementById('stealth-overlay');

    const btnLang = document.getElementById('btn-lang');
    const btnSnap = document.getElementById('btn-snap');
    const btnFilm = document.getElementById('btn-film');
    const btnGrid = document.getElementById('btn-grid');
    const btnRange = document.getElementById('btn-range');
    const btnStealth = document.getElementById('btn-stealth');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const evVal = document.getElementById('ev-val');

    const tShootingHeight = document.getElementById('t-shooting-height');
    const optEye = document.getElementById('opt-eye');
    const optHip = document.getElementById('opt-hip');
    const tEv = document.getElementById('t-ev');
    const tZoneFocus = document.getElementById('t-zone-focus');
    const optInf = document.getElementById('opt-inf');

    let videoTrack = null;
    let isRangeActive = false;
    let isStealthActive = false;
    let currentEV = 0.0;
    let currentHeight = 1.6;

    const i18n = {
      ua: {
        langTag: '🌐 UA',
        startBtn: '▶ УВІМКНУТИ КАМЕРУ',
        snap: '📷 СПУСК',
        range: '🎯 Далекомір',
        stealth: '🕶️ Стелс',
        stealthExit: '✕ ВИЙТИ',
        settingsTitleHeight: 'ВИСОТА ТОЧКИ ЗЙОМКИ',
        optEye: '👁️ Рівень очей (1.60м)',
        optHip: '🥋 Рівень пояса (1.30м)',
        evTitle: 'ЕКСПОКОРЕКЦІЯ (EV)',
        focusTitle: 'ЗОННЕ ФОКУСУВАННЯ LEICA',
        optInf: '∞ Нескінченність',
        closeSettings: 'Закрити',
        distPrefix: 'ВІДСТАНЬ',
        grids: {
          'thirds': '🌐 Третини',
          'golden': '🌐 Золотий',
          'fibonacci': '🌐 Фібоначчі',
          'diagonals': '🌐 Діагоналі',
          'center': '🌐 Центр',
          'off': '🌐 Сітка: Вимк'
        }
      },
      en: {
        langTag: '🌐 EN',
        startBtn: '▶ START CAMERA',
        snap: '📷 SNAP',
        range: '🎯 Rangefinder',
        stealth: '🕶️ Stealth',
        stealthExit: '✕ EXIT',
        settingsTitleHeight: 'CAMERA HEIGHT',
        optEye: '👁️ Eye level (1.60m)',
        optHip: '🥋 Hip level (1.30m)',
        evTitle: 'EXPOSURE (EV)',
        focusTitle: 'LEICA ZONE FOCUS',
        optInf: '∞ Infinity',
        closeSettings: 'Close',
        distPrefix: 'DIST',
        grids: {
          'thirds': '🌐 Thirds',
          'golden': '🌐 Golden',
          'fibonacci': '🌐 Fibonacci',
          'diagonals': '🌐 Diagonals',
          'center': '🌐 Center',
          'off': '🌐 Grid: Off'
        }
      },
      ja: {
        langTag: '🌐 日本語',
        startBtn: '▶ カメラを起動',
        snap: '📷 シャッター',
        range: '🎯 距離計',
        stealth: '🕶️ ステルス',
        stealthExit: '✕ 終了',
        settingsTitleHeight: '撮影の高さ',
        optEye: '👁️ 目線位置 (1.60m)',
        optHip: '🥋 腰の位置 (1.30m)',
        evTitle: '露出補正 (EV)',
        focusTitle: 'ゾーンフォーカス',
        optInf: '∞ 無限遠',
        closeSettings: '閉じる',
        distPrefix: '距離',
        grids: {
          'thirds': '🌐 三分割',
          'golden': '🌐 黄金比',
          'fibonacci': '🌐 フィボナッチ',
          'diagonals': '🌐 対角線',
          'center': '🌐 中央クロス',
          'off': '🌐 グリッド: 切'
        }
      }
    };

    const langKeys = ['ua', 'en', 'ja'];
    let currentLang = 'ua';

    function applyLanguage(lang) {
      currentLang = lang;
      const dict = i18n[lang] || i18n.ua;

      btnLang.textContent = dict.langTag;
      btnStart.textContent = dict.startBtn;
      btnSnap.textContent = dict.snap;
      btnRange.textContent = dict.range;
      btnStealth.textContent = dict.stealth;
      document.getElementById('btn-stealth-exit').textContent = dict.stealthExit;

      tShootingHeight.textContent = dict.settingsTitleHeight;
      optEye.textContent = dict.optEye;
      optHip.textContent = dict.optHip;
      tEv.textContent = dict.evTitle;
      tZoneFocus.textContent = dict.focusTitle;
      optInf.textContent = dict.optInf;
      closeSettingsBtn.textContent = dict.closeSettings;

      renderGrid();
      updateRangeText();
    }

    function toggleLang() {
      const nextIdx = (langKeys.indexOf(currentLang) + 1) % langKeys.length;
      applyLanguage(langKeys[nextIdx]);
    }

    const films = [
      { name: 'Tri-X 400', isBW: true, contrast: 1.55 },
      { name: 'HP5 Plus', isBW: true, contrast: 1.25 },
      { name: 'T-Max 3200', isBW: true, contrast: 1.90 },
      { name: 'Neopan 100', isBW: true, contrast: 1.35 },
      { name: 'Portra 400', isBW: false, filter: 'saturate(85%) contrast(110%) sepia(10%)' },
      { name: 'Cinestill 800T', isBW: false, filter: 'saturate(115%) contrast(130%) hue-rotate(190deg) sepia(15%)' }
    ];
    let filmIdx = 0;

    const grids = ['thirds', 'golden', 'fibonacci', 'diagonals', 'center', 'off'];
    let gridIdx = 0;

    function updateRangeText() {
      const dict = i18n[currentLang] || i18n.ua;
      rangeText.textContent = `${dict.distPrefix}: -- m (H: ${currentHeight.toFixed(2)}m)`;
    }

    function updateFilters() {
      const brightnessFactor = Math.pow(2, currentEV);
      const preset = films[filmIdx];
      if (preset.isBW) {
        v.style.filter = 'grayscale(100%) contrast(' + (preset.contrast * 100) + '%) brightness(' + (brightnessFactor * 100) + '%)';
      } else {
        v.style.filter = preset.filter + ' brightness(' + (brightnessFactor * 100) + '%)';
      }
    }

    function renderGrid() {
      const mode = grids[gridIdx];
      const dict = i18n[currentLang] || i18n.ua;
      btnGrid.textContent = dict.grids[mode] || mode;
      grid.innerHTML = '';

      if (mode === 'thirds') {
        grid.innerHTML = '<div class="grid-v" style="left:33.33%;"></div><div class="grid-v" style="left:66.66%;"></div><div class="grid-h" style="top:33.33%;"></div><div class="grid-h" style="top:66.66%;"></div>';
      } else if (mode === 'golden') {
        grid.innerHTML = '<div class="grid-v" style="left:38.2%;"></div><div class="grid-v" style="left:61.8%;"></div><div class="grid-h" style="top:38.2%;"></div><div class="grid-h" style="top:61.8%;"></div>';
      } else if (mode === 'fibonacci') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 618" preserveAspectRatio="none"><path d="M 0,618 A 618,618 0 0,1 618,0 A 382,382 0 0,1 1000,382 A 236,236 0 0,1 764,618 A 146,146 0 0,1 618,472 A 90,90 0 0,1 708,382 A 56,56 0 0,1 764,438 A 34,34 0 0,1 730,472" /><line x1="618" y1="0" x2="618" y2="618" stroke="rgba(255,255,255,0.25)" /><line x1="618" y1="382" x2="1000" y2="382" stroke="rgba(255,255,255,0.25)" /><line x1="764" y1="382" x2="764" y2="618" stroke="rgba(255,255,255,0.25)" /></svg>';
      } else if (mode === 'diagonals') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><line x1="0" y1="0" x2="1000" y2="1000" /><line x1="1000" y1="0" x2="0" y2="1000" /><line x1="0" y1="500" x2="500" y2="0" stroke="rgba(255,255,255,0.25)" /><line x1="500" y1="1000" x2="1000" y2="500" stroke="rgba(255,255,255,0.25)" /></svg>';
      } else if (mode === 'center') {
        grid.innerHTML = '<div class="center-cross"></div><div class="grid-v" style="left:50%;"></div><div class="grid-h" style="top:50%;"></div>';
      }
    }

    async function startApp() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        v.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        btnStart.style.display = 'none';
        hud.style.display = 'flex';
        applyLanguage(currentLang);
        updateFilters();
      } catch (err) {
        alert("Помилка камери: " + err.message);
      }
    }

    function nextFilm() {
      filmIdx = (filmIdx + 1) % films.length;
      btnFilm.textContent = '🎞️ ' + films[filmIdx].name;
      updateFilters();
    }

    function nextGrid() {
      gridIdx = (gridIdx + 1) % grids.length;
      renderGrid();
    }

    function toggleRange() {
      isRangeActive = !isRangeActive;
      rangefinder.style.display = isRangeActive ? 'block' : 'none';
      btnRange.classList.toggle('active', isRangeActive);
    }

    function enterStealth() {
      isStealthActive = true;
      stealthOverlay.style.display = 'block';
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function exitStealth(e) {
      if (e) e.stopPropagation();
      isStealthActive = false;
      stealthOverlay.style.display = 'none';
      if (navigator.vibrate) navigator.vibrate([20, 20]);
    }

    function openSettings() {
      settingsModal.style.display = 'flex';
    }

    function closeSettings() {
      settingsModal.style.display = 'none';
    }

    function setHeight(val, el) {
      document.querySelectorAll('#height-group .opt-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      currentHeight = val;
      updateRangeText();
    }

    function setEV(val) {
      currentEV = parseFloat(val);
      evVal.textContent = (currentEV > 0 ? '+' : '') + currentEV.toFixed(1) + ' EV';
      updateFilters();
    }

    function setFocus(dist, el) {
      document.querySelectorAll('#focus-group .opt-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      if (videoTrack && videoTrack.applyConstraints) {
        if (dist === 'auto') {
          videoTrack.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {});
        } else {
          videoTrack.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: parseFloat(dist) }] }).catch(() => {});
        }
      }
    }

    function takePhoto(isSilentStealth = false) {
      if (settingsModal.style.display === 'flex') return;

      if (!isSilentStealth) {
        shutter.classList.add('flash');
        setTimeout(() => shutter.classList.remove('flash'), 100);
      }

      if (navigator.vibrate) {
        if (isSilentStealth)
