<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cam Test</title>
</head>
<body style="background:#111; color:#fff; text-align:center; padding-top:40px; font-family:sans-serif;">
  <h2>Тест камери</h2>
  <button id="t-btn" style="padding:15px 25px; font-size:16px; background:#ffb642; border:none; border-radius:8px;" onclick="testCam()">
    ▶ ТЕСТ ПІДКЛЮЧЕННЯ
  </button>
  <p id="out" style="margin-top:20px; color:#aaa; font-size:14px;"></p>
  <video id="vid" autoplay playsinline muted style="width:90%; margin-top:20px; border:1px solid #444; border-radius:8px;"></video>

  <script>
    async function testCam() {
      const out = document.getElementById('out');
      out.textContent = "Запит дозволу...";
      try {
        const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false });
        document.getElementById('vid').srcObject = s;
        out.textContent = "Успіх! Відеопотік отримано.";
      } catch (e) {
        out.innerHTML = "<span style='color:red;'>Помилка: " + e.name + " (" + e.message + ")</span>";
      }
    }
  </script>
</body>
</html>
