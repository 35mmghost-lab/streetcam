<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>StreetCam</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; }
    #v { width: 100vw; height: 100vh; object-fit: cover; }

    #btn-start {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 18px 28px; font-size: 16px; font-weight: bold; background: #ffb642;
      border: 2px solid #fff; border-radius: 10px; color: #000; z-index: 999;
    }

    #top-bar {
      position: fixed; top: 10px; left: 0; width: 100%; display: none;
      justify-content: space-around; z-index: 999; background: rgba(0,0,0,0.6); padding: 8px 0;
    }
    .t-btn {
      background: #222; color: #ffb642; border: 1px solid #ffb642;
      padding: 6px 10px; border-radius: 4px; font-size: 11px;
    }

    #hud {
      position: fixed; bottom: 25px; left: 0; width: 100%; display: none;
      justify-content: center; z-index: 999;
    }
    #btn-snap {
      width: 75px; height: 75px; border-radius: 50%; background: #ffb642;
      border: 4px solid #fff; font-size: 13px; font-weight: bold; color: #000;
    }
    canvas { display: none; }
  </style>
</head>
<body>
  <video id="v" autoplay playsinline muted></video>
  
  <button id="btn-start" onclick="startCam()">▶ УВІМКНУТИ КАМЕРУ</button>

  <div id="top-bar">
    <button class="t-btn" id="film-btn" onclick="nextFilm()">🎞️ Tri-X 400</button>
    <button class="t-btn" id="frame-btn" onclick="nextFrame()">📐 Рамка: Full</button>
  </div>

  <div id="hud">
    <button id="btn-snap" onclick="snap()">📷 СПУСК</button>
  </div>

  <canvas id="c"></canvas>

  <script>
    const v = document.getElementById('v');
    const btnStart = document.getElementById('btn-start');
    const topBar = document.getElementById('top-bar');
    const hud = document.getElementById('hud');
    const c = document.getElementById('c');
    const filmBtn = document.getElementById('film-btn');
    const frameBtn = document.getElementById('frame-btn');

    const films = [
      { name: 'Tri-X 400', filter: 'grayscale(100%) contrast(150%)' },
      { name: 'T-Max 3200', filter: 'grayscale(100%) contrast(190%) brightness(90%)' },
      { name: 'Portra 400', filter: 'saturate(85%) contrast(110%) sepia(15%)' },
      { name: 'Cinestill 800T', filter: 'saturate(120%) contrast(130%) hue-rotate(190deg)' }
    ];
    let fIdx = 0;

    const frames = [
      { name: 'Full', ratio: null },
      { name: '3:2 (35mm)', ratio: 2/3 },
      { name: '1:1 (6x6)', ratio: 1.0 },
      { name: '65:24 (XPan)', ratio: 24/65 }
    ];
    let rIdx = 0;

    async function startCam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        v.srcObject = stream;
        btnStart.style.display = 'none';
        topBar.style.display = 'flex';
        hud.style.display = 'flex';
        applyFilm();
      } catch (err) {
        alert("Помилка: " + err.message);
      }
    }

    function applyFilm() {
      v.style.filter = films[fIdx].filter;
    }

    function nextFilm() {
      fIdx = (fIdx + 1) % films.length;
      filmBtn.textContent = '🎞️ ' + films[fIdx].name;
      applyFilm();
    }

    function nextFrame() {
      rIdx = (rIdx + 1) % frames.length;
      frameBtn.textContent = '📐 Рамка: ' + frames[rIdx].name;
    }

    function snap() {
      const rawW = v.videoWidth || 1920;
      const rawH = v.videoHeight || 1080;
      const curFrame = frames[rIdx];

      let cropW = rawW, cropH = rawH, cropX = 0, cropY = 0;

      if (curFrame.ratio) {
        if (rawW / rawH > curFrame.ratio) {
          cropW = rawH * curFrame.ratio;
          cropX = (rawW - cropW) / 2;
        } else {
          cropH = rawW / curFrame.ratio;
          cropY = (rawH - cropH) / 2;
        }
      }

      c.width = Math.round(cropW);
      c.height = Math.round(cropH);
      const ctx = c.getContext('2d');
      ctx.filter = films[fIdx].filter;
      ctx.drawImage(v, cropX, cropY, cropW, cropH, 0, 0, c.width, c.height);
      
      c.toBlob(blob => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'STREET_' + films[fIdx].name.replace(/ /g, '') + '_' + Date.now() + '.jpg';
        a.click();
      }, 'image/jpeg', 0.95);
    }
  </script>
</body>
</html>
