<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreetCam Test</title>
  <style>
    body { background: #000; color: #fff; text-align: center; padding-top: 50px; font-family: sans-serif; }
    video { width: 90%; max-height: 60vh; object-fit: cover; border: 2px solid #ffb642; margin-top: 20px; }
    button { padding: 16px 28px; font-size: 18px; font-weight: bold; background: #ffb642; border: none; border-radius: 8px; cursor: pointer; }
  </style>
</head>
<body>
  <button id="test-btn">▶ ТЕСТ КАМЕРИ</button>
  <br>
  <video id="test-video" autoplay playsinline muted></video>

  <script>
    const btn = document.getElementById('test-btn');
    const vid = document.getElementById('test-video');

    btn.addEventListener('click', async () => {
      btn.textContent = "Запит дозволу...";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        vid.srcObject = stream;
        btn.textContent = "Камера працює!";
      } catch (err) {
        alert("Помилка доступу: " + err.name + " — " + err.message);
        btn.textContent = "Помилка";
      }
    });
  </script>
</body>
</html>
