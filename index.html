<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <title>StreetCam</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%; background: #000; color: #fff;
      font-family: monospace; overflow: hidden; user-select: none; -webkit-user-select: none;
    }
    #viewfinder-box {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; justify-content: center; align-items: center; background: #000;
      z-index: 10;
    }
    #video-wrapper {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
      transition: width 0.15s ease, height 0.15s ease;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    #btn-start {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      z-index: 1000; padding: 20px 32px; font-size: 16px; font-weight: bold;
      background: #ffb642; border: 2px solid #fff; border-radius: 10px; color: #000; cursor: pointer;
    }
    
    /* Верхня панель HUD */
    #hud {
      position: fixed; top: 12px; left: 8px; right: 54px; display: none;
      align-items: center; padding: 4px 6px; gap: 6px; z-index: 500;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
      border-radius: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    #hud::-webkit-scrollbar { display: none; }
    
    .hud-btn {
      background: transparent; border: 1px solid rgba(255, 255, 255, 0.4);
      color: #eee; padding: 6px 8px; border-radius: 4px; font-size: 11px;
      cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .hud-btn.active {
      background: rgba(255, 182, 66, 0.3);
      border-color: #ffb642;
      color: #ffb642;
    }

    /* Окрема кнопка налаштувань у кутку */
    #btn-settings-floating {
      position: fixed; top: 12px; right: 8px; width: 38px; height: 38px;
      display: none; justify-content: center; align-items: center;
      background: rgba(0, 0, 0, 0.85); border: 1.5px solid #ffb642;
      color: #ffb642; border-radius: 6px; font-size: 18px; cursor: pointer;
      z-index: 550; backdrop-filter: blur(4px);
    }

    /* Сітки */
    #grid { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
    .grid-v, .grid-h { position: absolute; background: rgba(255, 255, 255, 0.4); }
    .grid-v { top: 0; bottom: 0; width: 1px; }
    .grid-h { left: 0; right: 0; height: 1px; }
    .grid-svg { width: 100%; height: 100%; position: absolute; top: 0; left: 0; stroke: rgba(255,255,255,0.45); stroke-width: 1.5; fill: none; }
    .center-cross { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 32px; height: 32px; }
    .center-cross::before, .center-cross::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.7); }
    .center-cross::before { top: 15px; left: 0; width: 32px; height: 1px; }
    .center-cross::after { top: 0; left: 15px; width: 1px; height: 32px; }

    /* Далекомір */
    #rangefinder {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 70; display: none;
    }
    .stadia-svg { width: 100%; height: 100%; stroke: #ffb642; stroke-width: 2; fill: none; }
    .stadia-label { fill: #ffb642; font-size: 15px; font-weight: bold; font-family: monospace; }

    /* Стелс-оверлей */
    #stealth-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #000; z-index: 950; display: none; cursor: pointer;
    }
    #btn-stealth-exit {
      position: absolute; top: 14px; right: 14px;
      background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.3);
      color: rgba(255, 255, 255, 0.7); padding: 8px 12px; border-radius: 4px; font-size: 11px; cursor: pointer;
    }

    /* Модальне вікно налаштувань */
    #settings-modal {
      position: fixed; bottom: 0; left: 0; width: 100%;
      background: rgba(15, 15, 15, 0.98); border-top: 1px solid #333;
      padding: 16px; display: none; flex-direction: column; gap: 14px;
      z-index: 900; max-height: 80vh; overflow-y: auto;
    }
    .setting-title { font-size: 11px; color: #888; margin-bottom: 6px; text-transform: uppercase; }
    .setting-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .opt-btn {
      padding: 8px 4px; background: #222; color: #aaa; border: 1px solid #333;
      border-radius: 4px; font-size: 11px; cursor: pointer; text-align: center; font-family: monospace;
    }
    .opt-btn.active { background: #fff; color: #000; font-weight: bold; }
    .slider-container { display: flex; align-items: center; gap: 12px; }
    input[type=range] { flex: 1; accent-color: #ffb642; }
    #close-settings-btn {
      width: 100%; padding: 12px; background: #333; color: #fff; border: none;
      border-radius: 4px; font-size: 13px; cursor: pointer;
    }

    #shutter {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: #000; z-index: 800; opacity: 0; pointer-events: none; transition: opacity 0.08s;
    }
    #shutter.flash { opacity: 0.9; }
    canvas { display: none; }
  </style>
</head>
<body>
  <div id="viewfinder-box">
    <div id="video-wrapper">
      <video id="v" autoplay playsinline muted></video>
      <div id="grid"></div>
      <div id="rangefinder">
        <svg class="stadia-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
          <line x1="390" y1="120" x2="430" y2="120" />
          <line x1="390" y1="880" x2="430" y2="880" />
          <text x="320" y="505" class="stadia-label">1.2m</text>
          
          <line x1="440" y1="260" x2="470" y2="260" />
          <line x1="440" y1="740" x2="470" y2="740" />
          <text x="390" y="505" class="stadia-label">2.0m</text>

          <line x1="475" y1="340" x2="495" y2="340" />
          <line x1="475" y1="660" x2="495" y2="660" />
          <text x="515" y="505" class="stadia-label">3.0m</text>
        </svg>
      </div>
    </div>
  </div>

  <div id="shutter"></div>

  <!-- Стелс-оверлей -->
  <div id="stealth-overlay" onclick="takePhoto(true)">
    <button id="btn-stealth-exit" onclick="exitStealth(event)">✕ EXIT</button>
  </div>

  <button id="btn-start" onclick="startApp()">▶ УВІМКНУТИ КАМЕРУ</button>

  <!-- Верхня панель HUD -->
  <div id="hud">
    <button class="hud-btn" id="btn-lang" onclick="nextLang()">🌐 UA</button>
    <button class="hud-btn" id="btn-snap" onclick="takePhoto(false)">📷 СПУСК</button>
    <button class="hud-btn" id="btn-film" onclick="nextFilm()">🎞️ Tri-X 400</button>
    <button class="hud-btn" id="btn-ratio" onclick="nextRatio()">📐 3:2</button>
    <button class="hud-btn" id="btn-grid" onclick="nextGrid()">🌐 Сітка: Вимк</button>
    <button class="hud-btn" id="btn-range" onclick="toggleRange()">🎯 Далекомір</button>
    <button class="hud-btn" id="btn-stealth" onclick="enterStealth()">🕶️ Стелс</button>
  </div>

  <!-- Кнопка налаштувань -->
  <button id="btn-settings-floating" onclick="openSettings()">⚙️</button>

  <!-- Модальне вікно налаштувань -->
  <div id="settings-modal">
    <div>
      <div class="setting-title" id="t-ratio">ФОРМАТ КАДРУ (ASPECT RATIO)</div>
      <div class="setting-grid" id="ratio-group">
        <button class="opt-btn" onclick="selectRatio(0, this)">Повний</button>
        <button class="opt-btn active" onclick="selectRatio(1, this)">3:2 (35mm)</button>
        <button class="opt-btn" onclick="selectRatio(2, this)">4:3 (645)</button>
        <button class="opt-btn" onclick="selectRatio(3, this)">4:5 (Insta)</button>
        <button class="opt-btn" onclick="selectRatio(4, this)">1:1 (6x6)</button>
        <button class="opt-btn" onclick="selectRatio(5, this)">16:9</button>
        <button class="opt-btn" onclick="selectRatio(6, this)" style="grid-column: span 2;">65:24 (XPan)</button>
      </div>
    </div>

    <div>
      <div class="setting-title" id="t-ev">ЕКСПОКОРЕКЦІЯ (EV)</div>
      <div class="slider-container">
        <input type="range" id="ev-slider" min="-2.0" max="2.0" step="0.1" value="0.0" oninput="setEV(this.value)">
        <span id="ev-val" style="min-width: 45px; color: #ffb642;">0.0 EV</span>
      </div>
    </div>

    <div>
      <div class="setting-title" id="t-zone-focus">ЗОННЕ ФОКУСУВАННЯ LEICA</div>
      <div class="setting-grid" id="focus-group">
        <button class="opt-btn active" onclick="setFocus('auto', this)">AF Auto</button>
        <button class="opt-btn" onclick="setFocus('0.7', this)">0.7 m</button>
        <button class="opt-btn" onclick="setFocus('1.2', this)">1.2 m</button>
        <button class="opt-btn" onclick="setFocus('2.0', this)">2.0 m</button>
        <button class="opt-btn" onclick="setFocus('3.0', this)">3.0 m</button>
        <button class="opt-btn" onclick="setFocus('5.0', this)">5.0 m</button>
        <button class="opt-btn" onclick="setFocus('100.0', this)" id="opt-inf" style="grid-column: span 2;">∞ Нескінченність</button>
      </div>
    </div>

    <button id="close-settings-btn" onclick="closeSettings()">Закрити</button>
  </div>

  <canvas id="c"></canvas>

  <script>
    const v = document.getElementById('v');
    const videoWrapper = document.getElementById('video-wrapper');
    const btnStart = document.getElementById('btn-start');
    const hud = document.getElementById('hud');
    const btnSettingsFloating = document.getElementById('btn-settings-floating');
    const grid = document.getElementById('grid');
    const rangefinder = document.getElementById('rangefinder');
    const shutter = document.getElementById('shutter');
    const canvas = document.getElementById('c');
    const btnLang = document.getElementById('btn-lang');
    const btnSnap = document.getElementById('btn-snap');
    const btnFilm = document.getElementById('btn-film');
    const btnRatio = document.getElementById('btn-ratio');
    const btnGrid = document.getElementById('btn-grid');
    const btnRange = document.getElementById('btn-range');
    const btnStealth = document.getElementById('btn-stealth');
    const stealthOverlay = document.getElementById('stealth-overlay');
    const btnStealthExit = document.getElementById('btn-stealth-exit');
    const settingsModal = document.getElementById('settings-modal');
    const closeSettingsBtn = document.getElementById('close-settings-btn');
    const evVal = document.getElementById('ev-val');
    const tEv = document.getElementById('t-ev');
    const tRatio = document.getElementById('t-ratio');
    const tZoneFocus = document.getElementById('t-zone-focus');
    const optInf = document.getElementById('opt-inf');

    let videoTrack = null;
    let isRangeActive = false;
    let currentEV = 0.0;

    const ratios = [
      { id: 'full', name: 'Повний', portrait: null, landscape: null },
      { id: '3:2', name: '3:2', portrait: 2 / 3, landscape: 3 / 2 },
      { id: '4:3', name: '4:3', portrait: 3 / 4, landscape: 4 / 3 },
      { id: '4:5', name: '4:5', portrait: 4 / 5, landscape: 5 / 4 },
      { id: '1:1', name: '1:1', portrait: 1.0, landscape: 1.0 },
      { id: '16:9', name: '16:9', portrait: 9 / 16, landscape: 16 / 9 },
      { id: 'xpan', name: '65:24', portrait: 24 / 65, landscape: 65 / 24 }
    ];
    let ratioIdx = 1; // За замовчуванням 3:2

    const i18n = {
      ua: {
        tag: '🌐 UA',
        startBtn: '▶ УВІМКНУТИ КАМЕРУ',
        snap: '📷 СПУСК',
        range: '🎯 Далекомір',
        stealth: '🕶️ Стелс',
        stealthExit: '✕ ВИЙТИ',
        ratioTitle: 'ФОРМАТ КАДРУ (ASPECT RATIO)',
        evTitle: 'ЕКСПОКОРЕКЦІЯ (EV)',
        focusTitle: 'ЗОННЕ ФОКУСУВАННЯ LEICA',
        optInf: '∞ Нескінченність',
        closeSettings: 'Закрити',
        grids: {
          'off': '🌐 Сітка: Вимк',
          'thirds': '🌐 Третини',
          'golden': '🌐 Золотий',
          'fibonacci': '🌐 Фібоначчі',
          'diagonals': '🌐 Діагоналі',
          'center': '🌐 Центр'
        }
      },
      en: {
        tag: '🌐 EN',
        startBtn: '▶ START CAMERA',
        snap: '📷 SNAP',
        range: '🎯 Rangefinder',
        stealth: '🕶️ Stealth',
        stealthExit: '✕ EXIT',
        ratioTitle: 'ASPECT RATIO',
        evTitle: 'EXPOSURE (EV)',
        focusTitle: 'LEICA ZONE FOCUS',
        optInf: '∞ Infinity',
        closeSettings: 'Close',
        grids: {
          'off': '🌐 Grid: Off',
          'thirds': '🌐 Thirds',
          'golden': '🌐 Golden',
          'fibonacci': '🌐 Fibonacci',
          'diagonals': '🌐 Diagonals',
          'center': '🌐 Center'
        }
      },
      ja: {
        tag: '🌐 日本語',
        startBtn: '▶ カメラを起動',
        snap: '📷 シャッター',
        range: '🎯 距離計',
        stealth: '🕶️ ステルス',
        stealthExit: '✕ 終了',
        ratioTitle: 'アスペクト比',
        evTitle: '露出補正 (EV)',
        focusTitle: 'ゾーンフォーカス',
        optInf: '∞ 無限遠',
        closeSettings: '閉じる',
        grids: {
          'off': '🌐 グリッド: 切',
          'thirds': '🌐 三分割',
          'golden': '🌐 黄金比',
          'fibonacci': '🌐 フィボナッチ',
          'diagonals': '🌐 対角線',
          'center': '🌐 中央クロス'
        }
      }
    };

    const langKeys = ['ua', 'en', 'ja'];
    let langIdx = 0;

    function applyLanguage() {
      const currentLang = langKeys[langIdx];
      const dict = i18n[currentLang];

      btnLang.textContent = dict.tag;
      btnStart.textContent = dict.startBtn;
      btnSnap.textContent = dict.snap;
      btnRange.textContent = dict.range;
      btnStealth.textContent = dict.stealth;
      btnStealthExit.textContent = dict.stealthExit;

      tRatio.textContent = dict.ratioTitle;
      tEv.textContent = dict.evTitle;
      tZoneFocus.textContent = dict.focusTitle;
      optInf.textContent = dict.optInf;
      closeSettingsBtn.textContent = dict.closeSettings;

      btnRatio.textContent = '📐 ' + ratios[ratioIdx].name;
      renderGrid();
    }

    function nextLang() {
      langIdx = (langIdx + 1) % langKeys.length;
      applyLanguage();
    }

    const films = [
      { name: 'Tri-X 400', isBW: true, contrast: 1.55 },
      { name: 'HP5 Plus', isBW: true, contrast: 1.25 },
      { name: 'T-Max 3200', isBW: true, contrast: 1.90 },
      { name: 'Neopan 100', isBW: true, contrast: 1.35 },
      { name: 'Portra 400', isBW: false, filter: 'saturate(85%) contrast(110%) sepia(10%)' },
      { name: 'Cinestill 800T', isBW: false, filter: 'saturate(115%) contrast(130%) hue-rotate(190deg) sepia(15%)' }
    ];
    let filmIdx = 0;

    const grids = ['off', 'thirds', 'golden', 'fibonacci', 'diagonals', 'center'];
    let gridIdx = 0;

    function applyAspectRatio() {
      const r = ratios[ratioIdx];
      btnRatio.textContent = '📐 ' + r.name;

      document.querySelectorAll('#ratio-group .opt-btn').forEach((b, idx) => {
        b.classList.toggle('active', idx === ratioIdx);
      });

      if (r.id === 'full') {
        videoWrapper.style.width = '100vw';
        videoWrapper.style.height = '100vh';
        return;
      }

      const isPortrait = window.innerHeight >= window.innerWidth;
      const targetRatio = isPortrait ? r.portrait : r.landscape;
      const screenRatio = window.innerWidth / window.innerHeight;

      if (screenRatio > targetRatio) {
        videoWrapper.style.height = '100vh';
        videoWrapper.style.width = Math.round(window.innerHeight * targetRatio) + 'px';
      } else {
        videoWrapper.style.width = '100vw';
        videoWrapper.style.height = Math.round(window.innerWidth / targetRatio) + 'px';
      }
    }

    function nextRatio() {
      ratioIdx = (ratioIdx + 1) % ratios.length;
      applyAspectRatio();
    }

    function selectRatio(idx, el) {
      ratioIdx = idx;
      applyAspectRatio();
    }

    window.addEventListener('resize', applyAspectRatio);

    async function startApp() {
      try {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }
      } catch(e) {}

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" },
          audio: false
        });
        v.srcObject = stream;
        videoTrack = stream.getVideoTracks()[0];
        btnStart.style.display = 'none';
        hud.style.display = 'flex';
        btnSettingsFloating.style.display = 'flex';
        applyLanguage();
        applyFilmFilter();
        applyAspectRatio();
      } catch (err) {
        alert("Помилка камери: " + err.message);
      }
    }

    function applyFilmFilter() {
      const preset = films[filmIdx];
      const brightnessFactor = Math.pow(2, currentEV);
      if (preset.isBW) {
        v.style.filter = 'grayscale(100%) contrast(' + (preset.contrast * 100) + '%) brightness(' + (brightnessFactor * 100) + '%)';
      } else {
        v.style.filter = preset.filter + ' brightness(' + (brightnessFactor * 100) + '%)';
      }
    }

    function nextFilm() {
      filmIdx = (filmIdx + 1) % films.length;
      btnFilm.textContent = '🎞️ ' + films[filmIdx].name;
      applyFilmFilter();
    }

    function renderGrid() {
      const mode = grids[gridIdx];
      const currentLang = langKeys[langIdx];
      btnGrid.textContent = i18n[currentLang].grids[mode];
      grid.innerHTML = '';

      if (mode === 'thirds') {
        grid.innerHTML = '<div class="grid-v" style="left:33.33%;"></div><div class="grid-v" style="left:66.66%;"></div><div class="grid-h" style="top:33.33%;"></div><div class="grid-h" style="top:66.66%;"></div>';
      } else if (mode === 'golden') {
        grid.innerHTML = '<div class="grid-v" style="left:38.2%;"></div><div class="grid-v" style="left:61.8%;"></div><div class="grid-h" style="top:38.2%;"></div><div class="grid-h" style="top:61.8%;"></div>';
      } else if (mode === 'fibonacci') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 618" preserveAspectRatio="none"><path d="M 0,618 A 618,618 0 0,1 618,0 A 382,382 0 0,1 1000,382 A 236,236 0 0,1 764,618 A 146,146 0 0,1 618,472 A 90,90 0 0,1 708,382 A 56,56 0 0,1 764,438 A 34,34 0 0,1 730,472" /><line x1="618" y1="0" x2="618" y2="618" stroke="rgba(255,255,255,0.3)" /><line x1="618" y1="382" x2="1000" y2="382" stroke="rgba(255,255,255,0.3)" /><line x1="764" y1="382" x2="764" y2="618" stroke="rgba(255,255,255,0.3)" /></svg>';
      } else if (mode === 'diagonals') {
        grid.innerHTML = '<svg class="grid-svg" viewBox="0 0 1000 1000" preserveAspectRatio="none"><line x1="0" y1="0" x2="1000" y2="1000" stroke="rgba(255,255,255,0.45)" /><line x1="1000" y1="0" x2="0" y2="1000" stroke="rgba(255,255,255,0.45)" /><line x1="0" y1="500" x2="500" y2="0" stroke="rgba(255,255,255,0.25)" /><line x1="500" y1="1000" x2="1000" y2="500" stroke="rgba(255,255,255,0.25)" /></svg>';
      } else if (mode === 'center') {
        grid.innerHTML = '<div class="center-cross"></div><div class="grid-v" style="left:50%;"></div><div class="grid-h" style="top:50%;"></div>';
      }
    }

    function nextGrid() {
      gridIdx = (gridIdx + 1) % grids.length;
      renderGrid();
    }

    function toggleRange() {
      isRangeActive = !isRangeActive;
      rangefinder.style.display = isRangeActive ? 'block' : 'none';
      btnRange.classList.toggle('active', isRangeActive);
    }

    function enterStealth() {
      stealthOverlay.style.display = 'block';
      if (navigator.vibrate) navigator.vibrate(40);
